  /api/v1/tenants/{tenant_id}/mfa-reset-requests/{request_id}/approve:
    post:
      operationId: approveTenantMfaResetRequest
      tags: [Members]
      summary: MFA 초기화 승인(테넌트 관리자)
      description: |
        관리자가 조직 연락 경로·대면 등으로 본인을 확인한 뒤 승인한다.
        - 승인하면 대상 사용자·테넌트의 TOTP와 복구 코드를 초기화하고, 사용자는 다음 접근 때 다시 등록한다.
        - 사용자 재인증은 요청 생성 시점에 확인했다(FR-MFA-004-02).
        - 본인 요청은 승인할 수 없다(`403 self_action_forbidden`).
        - 다른 테넌트의 TOTP와 테넌트 MFA 정책은 유지한다.
        - `pending`이 아닌 요청은 `409 conflict`이다.
      x-requirements: [FR-MFA-004, FR-MFA-004-02]
      x-audit-event: mfa.reset_approved
      parameters:
        - $ref: '#/components/parameters/TenantIdPath'
        - $ref: '#/components/parameters/RequestIdPath'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Activity'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaResetApproval'
      responses:
        '200':
          description: 승인 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaResetRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TenantForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
