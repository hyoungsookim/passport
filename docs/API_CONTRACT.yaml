    ## 13. P0에서 제외한 API

    - 비밀번호 분실 재설정(FR-AUTH-004, P1), 개인정보 열람·반출(FR-USER-008, P1)
    - 초대장·수락(FR-MEM-006, P1), 멤버십 재가입 신청·승인(FR-MEM-008, P1). 해지 멤버십의 자동 복구 금지는 P0에서도 적용
    - 감사 이력 조회(FR-WEB-007, P1)
    - 외부 신원 연결 해제와 고급 연결 관리(P1), 이메일 주소 변경
    - 네이티브 클라이언트의 OIDC 로그인. 모바일 앱이 개발 범위에 없다
    - 플랫폼 관리자 역할 부여 API(설치 시 CLI로 지정)

    ## 14. Phase 1(DB 모델)에 넘기는 모델 영향

    - `Tenant.code`(로그인 링크·코드 입력용 고유 슬러그, FR-OIDC-011)와 `Tenant.mfa_enabled_at`(MFA 유예 판단)
    - `TenantOIDCConfiguration`: `provider_type`, `display_name`, `member_provisioning`, `accepted_acr_values`, `accepted_amr_values`, `trust_version`, `last_validation`
    - `TenantMembership.status`에 `pre_registered`와 사전 등록 이메일
    - `Application`: `audience`(= `code`), 서비스 자격 증명 해시
    - 로그인, 클라이언트별 Refresh Token 계열, BFF 세션·서버 측 토큰 저장 참조·무효화 연계, SSO 클라이언트·허용 redirect URI·일회용 인가 코드·PKCE, OIDC 로그인 트랜잭션, 링크 티켓, 이메일 확인 토큰, TOTP 등록·복구 코드, MFA 초기화 요청, 멱등 키 저장소
    - 모든 변경 가능 리소스의 버전(ETag 원천)

