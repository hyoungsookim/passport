    | NFR-SEC-004 | 4장 경계, 모든 테넌트 범위 API |
    | NFR-SEC-007 | 각 operation의 `x-audit-event` |
    | NFR-OPS-001 | `X-Request-ID`, `getLiveness`, `getReadiness` |
    | NFR-OPS-002-03 | 8장 외부 보안 기록 대상 변경 API, `completeWithdrawal`, `ssoCompleteWithdrawal`, 복원 절차 |

    | 시나리오 | 흐름 |
    | --- | --- |
    | SC-01 | F-01, F-02 |
    | SC-02 | F-03, F-04, F-07 |
    | SC-03 | `createTenant` → `putTenantApplication` → F-08 |
    | SC-04 | F-02, F-03, F-07 |
    | SC-05 | F-08, F-09 |
    | SC-06 | F-10 |

    ## 13. P0에서 제외한 API

    - 비밀번호 분실 재설정(FR-AUTH-004, P1), 개인정보 열람·반출(FR-USER-008, P1)
    - 초대장·수락(FR-MEM-006, P1), 멤버십 재가입 신청·승인(FR-MEM-008, P1). 해지 멤버십의 자동 복구 금지는 P0에서도 적용
    - 감사 이력 조회(FR-WEB-007, P1)
    - 외부 신원 연결 해제와 고급 연결 관리(P1), 이메일 주소 변경
    - 네이티브 클라이언트의 OIDC 로그인. 모바일 앱이 개발 범위에 없다
    - 플랫폼 관리자 역할 부여 API(설치 시 CLI로 지정)

    ## 14. Phase 1(DB 모델)에 넘기는 모델 영향

    - `Tenant.code`(로그인 링크·코드 입력용 고유 슬러그, FR-OIDC-011)
    - `TenantOIDCConfiguration`: `provider_type`, `display_name`, `member_provisioning`, `trust_version`, `last_validation`
    - `TenantMembership.user_id`는 필수 사용자 FK이며, 기존 계정 추가 시 `status = active`로 생성
    - `Application`: `audience`(= `code`), 서비스 자격 증명 해시
    - 로그인, 클라이언트별 Refresh Token 계열, SSO 세션·서버 측 토큰 저장 참조·무효화 연계, SSO 클라이언트·허용 redirect URI·일회용 인가 코드·PKCE, OIDC 로그인 트랜잭션, 링크 티켓, 이메일 확인 토큰, 멱등 키 저장소
    - 모든 변경 가능 리소스의 버전(ETag 원천)
    - OIDC 트랜잭션의 브라우저 바인딩 해시, 검증된 외부 세션·토큰별 `oidc_login_bindings`
    - 사용자 행·직접/간접 FK 자손의 `ON DELETE CASCADE`, 감사로그 보존, 사용자 삭제 후에도 동작하는 최종 무효화 버전 큐
    - 원 탈퇴 멱등 키에 연결한 `withdrawal_receipts`(해시·24시간 만료, 사용자 FK 없음)
    - 외부 보안 저널에 연결한 `security_change_events`와 백업의 저널 기준점

    ## 15. 상태 값

    | 대상 | 값 | 비고 |
    | --- | --- | --- |
    | 계정 | `pending_verification`, `active`, `suspended`, `deactivated` | 탈퇴 시 행 삭제. 폐기한 DB 상태 키 5는 재사용하지 않음 |
    | 테넌트 | `active`, `suspended`, `deactivated` | |
    | 멤버십 | `active`, `suspended`, `removed` | 생성 시 `active`, `suspended`는 비활성화, `removed`는 해지 |
    | Application, TenantApplication | `active`, `inactive` | 목록에는 TenantApplication 레코드가 없는 상태를 `not_enabled`로 표시 |
    | OIDC 설정 | `enabled`, `disabled` | 검증 실패는 `last_validation.status = failed` |

    ## 16. 미결·제안 목록 (승인 필요)

    1. SSO 세션 쿠키의 이름·SameSite 값, 세션 저장·고정 방지·암호화·동시 갱신 구현 상세. SSO 인가 코드 수명은 60초를 제안하며 재사용·PKCE 불일치·redirect URI 불일치는 거부한다. 기존 Refresh Token 재사용 탐지 정책은 완화하지 않는다.
    2. 마지막 관리자 보호(`409 last_tenant_admin`). 마지막 관리자의 강등·제거와 탈퇴를 막는다.
       탈퇴 즉시 완료 원칙(FR-USER-005)과 충돌하는지 확인이 필요하다.
    3. JWT `alg = ES256`, `aud`를 Application `code`로 쓰는 방식, 서명 키 게시·유지 24시간.
    4. 재인증 유효 5분, 링크 티켓 10분, 이메일 확인 토큰 24시간, 멱등 키 보관 24시간.
    5. 비밀번호 정책: 12~128자, 조합 규칙 없음, 이메일과 같은 값 금지. 유출 비밀번호 목록 대조 여부.
    6. 속도·실패 제한 수치(10장).
    7. 테넌트 코드 형식(`^[a-z0-9](?:[a-z0-9-]{1,30}[a-z0-9])$`)과 생성 후 변경 불가.

    ## 17. SSO 경계의 추가 검증
    - SSO 세션 쿠키의 값은 비밀 식별자이며 LoginInfo.login_id로 대체할 수 없다.
    - 일반 브라우저 응답에는 Access/Refresh Token·SSO가 사용하는 client 비밀값을 포함하지 않는다.
    권한 있는 관리자가 서비스 자격 증명을 생성·교체할 때 새 비밀값을 한 번 표시하는 기존 관리 계약은 별도로 적용한다.
    - 일반 리소스 API의 Set-Cookie·WWW-Authenticate를 브라우저로 그대로 전달하지 않는다.
      세션 쿠키 설정·삭제는 SSO 자신의 인증·종료 처리만 수행한다.
    - /api/v1/auth/sso/token은 OAuth Authorization Code의 서버 간 교환으로,
      application/x-www-form-urlencoded의 grant_type=authorization_code를 사용한다.
    - SSO client 등록에는 서버 자격 증명, 고정 audience, 정확한 callback URI가 필요하다.
      관리 포털 client는 설치 설정으로, SaaS client는 해당 Application과 연결하여 관리한다.
      이 client 인증은 사용자 인증·현재 접근 자격 검사를 대체하지 않는다.
    - JWKS·공개 헬스 체크는 일반 SSO 프록시 경계의 예외이다.
    - 외부 Provider의 OIDC callback은 중계가 아니라 Passport SSO가 직접 처리하는 인증 경로다(`ssoOidcCallback`).

