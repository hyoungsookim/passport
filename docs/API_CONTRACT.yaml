  /api/v1/service/access/verify:
    post:
      operationId: verifyAccess
      tags: [Service]
      summary: 요청별 접근 자격 검증(SaaS)
      description: |
        연동 SaaS 백엔드가 **테넌트 범위 요청마다** 호출한다(FR-APP-008-04). 한 번의 호출로 다음을 판정한다.
        - 토큰
          - 서명, `typ`, `iss`, `exp`, `nbf`를 검증한다.
          - `aud`가 호출한 Application의 `code`여야 한다. 다른 SaaS용 토큰은 검증할 수 없다(최소 권한).
          - 철회 여부와 로그인 유지 조건을 확인한다(FR-AUTH-009-06, FR-OIDC-015~018 반영).
        - 4장 인가 검사 2~5와 MFA
        - `user_activity = true`이면 로그인의 미사용 시각을 초기화한다.

        **캐시 최신성**(FR-APP-008-05)
        - SaaS는 사용자·테넌트·SaaS별 캐시에 세 버전(`tenant`, `membership`, `tenant_application`)을 기록해 두고 `cached_versions`로 보낸다.
        - 세 버전이 모두 현재와 같으면 `cache_status = fresh`이고, 응답에서 `entitlement`를 생략한다.
        - 하나라도 다르거나 보내지 않았으면 `stale` 또는 `absent`이고, 현재 자격 정보(`entitlement`)를 함께 반환한다.

        **판정**
        - `decision = deny`이면 SaaS는 `deny_reason`에 맞는 상태 코드(`suggested_status`)로 거부한다.
        - Valkey 버전을 신뢰할 수 없으면 DB의 커밋된 상태·버전으로 검증한다(FR-APP-008-08).
        - DB로도 확인할 수 없으면 `503 entitlement_unverifiable`이다. SaaS는 이전 캐시로 허용하지 않는다(FR-APP-008-03).

        **SaaS BFF 세션 정리**(FR-AUTH-009-02-03): Passport는 SaaS BFF의 세션을 직접 지울 수 없다.
        - `deny_reason`이 `invalid_token`, `token_revoked`, `login_expired`, `account_inactive`이면 SaaS BFF는 그 세션과 서버 측 토큰을 즉시 삭제하고 세션 쿠키를 지운다.
          남은 쿠키나 서버 측 토큰으로 다시 허용하지 않는다.
        - 테넌트 범위 사유(`membership_inactive`, `tenant_inactive`, `application_not_enabled` 등)는 그 요청만 거부하고 로그인 세션은 유지한다.
      security:
        - serviceBasic: []
      x-requirements: [FR-APP-003, FR-APP-004, FR-APP-005, FR-APP-007, FR-APP-008-01, FR-APP-008-03, FR-APP-008-04, FR-APP-008-05, FR-APP-008-07, FR-APP-008-08, FR-AUTH-008-02, FR-AUTH-008-03, FR-AUTH-008-04, FR-AUTH-009-02-03, FR-AUTH-009-03-03, FR-AUTH-009-03-06, FR-AUTH-009-06,FR-OIDC-015, FR-OIDC-016, FR-OIDC-017, FR-OIDC-018, FR-USER-002-02, NFR-OPS-002-02, SC-05]
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessVerifyRequest'
            examples:
              withCache:
                value:
                  access_token: eyJhbGciOiJFUzI1NiIsInR5cCI6ImF0K2p3dCIsImtpZCI6IjIwMjYtMTAifQ.eyJzdWIiOiIuLi4ifQ.sig
                  user_activity: true
                  cached_versions:
                    tenant: 7
                    membership: 3
                    tenant_application: 2
      responses:
        '200':
          description: 판정 결과
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessVerifyResponse'
              examples:
                allowFresh:
                  $ref: '#/components/examples/VerifyAllowFresh'
                allowStale:
                  $ref: '#/components/examples/VerifyAllowStale'
                denyMembership:
                  $ref: '#/components/examples/VerifyDenyMembership'
        '401':
          $ref: '#/components/responses/InvalidClient'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/EntitlementUnverifiable'

