    patch:
      operationId: updateTenantMember
      tags: [Members]
      summary: 멤버 역할·상태 변경
      description: |
        테넌트 `admin`이 역할(`admin`/`member`)과 상태(`active`/`suspended`)를 바꾼다.
        - 역할 또는 상태 변경은 access_version을 증가시키는 접근 자격 변경이다. 8장 규약(`If-Match`, `Idempotency-Key` 필수, `503 access_sync_pending`)을 따른다(FR-APP-008).
        - **[제안]** 마지막 `active` 관리자를 강등하거나 비활성화하면 `409 last_tenant_admin`이다.
        - `removed` 멤버십은 바꿀 수 없다(`409 conflict`). 복구는 P1 재가입 신청·승인으로 한다(FR-MEM-008).
      x-requirements: [FR-MEM-003, FR-MEM-004, FR-APP-008-01, FR-APP-008-05, FR-APP-008-06, FR-APP-008-07, FR-APP-008-09, FR-WEB-004, SC-05, NFR-OPS-002-03]
