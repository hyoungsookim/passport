        token_type: Bearer
        expires_in: 1800
        audience: passport
        tenant_id: null
        refresh_token: prt_6h2kD9sQ0vYxZ1uN4mB7cL3aE8fR5tW
        login:
          login_id: 0193a3d0-2222-7aaa-8bbb-0c0d0e0f1011
          auth_method: local
          client_type: native
