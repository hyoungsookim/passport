  /bff/auth/login:
    servers:
    - url: https://{saas_bff_host}
      description: 각 SaaS 웹의 BFF 호스트. Passport는 이 경로를 구현하지 않는다.
      variables:
        saas_bff_host:
          default: papyrus.example.com
    get:
      operationId: bffStartSso
      tags:
      - SaaS BFF Reference
      summary: '[SaaS 구현] Passport 중앙 로그인으로 SSO 시작'
      description: |
        **각 SaaS BFF가 구현하는 참고 계약이다. Passport는 이 경로를 구현하지 않는다.** 경로는 예시이며 SaaS가 정할 수 있다.
        SaaS BFF가 서버에서 자신의 client_id·등록된 callback·state·PKCE verifier를 생성·보관하고 Passport `GET /bff/auth/authorize`로 리다이렉트한다.
        요청의 임의 목적지·client 비밀값은 수용하지 않는다.
        대상 테넌트를 알면 `tenant_id`로 전달하고, 모르면 생략해 Passport가 테넌트 선택을 맡게 한다.
      x-implemented-by: saas-bff
      security: []
      x-requirements: [ADR-014, D-01, D-03, FR-AUTH-009-02-04]
      parameters:
      - name: tenant_id
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Uuid'
      responses:
        '302':
          description: 등록된 목적지로 이동. 토큰을 URL에 넣지 않는다.
          headers:
            Location:
              schema:
                type: string
                format: uri
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '400':
          $ref: '#/components/responses/BadRequest'

  /bff/auth/authorize:
    get:
      operationId: bffAuthorizeSso
      tags:
      - BFF
      summary: Passport 중앙 로그인에서 SSO 인가 코드 발급
      description: |
        Passport 호스트의 Passport BFF가 구현한다. SaaS BFF의 `bffStartSso`가 브라우저를 이 경로로 보낸다.

        **처리 순서**
        1. `client_id`가 활성 Application이고 `redirect_uri`가 그 `bff_redirect_uris` 값과 정확히 일치해야 한다.
           아니면 `400`을 반환하고 리다이렉트하지 않는다(오픈 리다이렉트 방지).
        2. 그 밖의 파라미터 오류는 `redirect_uri`로 `error=invalid_request`를 돌려보낸다.
        3. Passport BFF 세션이 없거나 만료됐으면 검증된 요청을 보존하고 Passport 로그인 화면(Local 또는 테넌트 OIDC)으로 이동한다.
           로그인을 마치면 이 단계부터 이어간다.
        4. 대상 테넌트를 정한다.
           - `tenant_id`가 있으면 그 테넌트를 쓴다.
           - 없으면 Passport 포털이 테넌트 선택 화면을 보여준다. 후보는 사용자의 `active` 멤버십 중 이 Application이 `active`인 테넌트다.
           - 후보가 없으면 `error=no_eligible_tenant`이다.
        5. 대상 테넌트의 인가 검사(4장 2~5)와 MFA를 확인한다.
           - 그 테넌트의 OIDC 로그인이 필요하거나 MFA가 미충족이면 Passport 포털에서 그 절차를 거친 뒤 이어간다.
           - 그 외 실패는 `error=tenant_access_denied`와 `error_reason`이다.
        6. client·redirect URI·원래 로그인·테넌트·PKCE에 묶인 일회용 코드를 발급하고 `redirect_uri?code=...&state=...`로 이동한다.
           코드 수명은 **[제안]** 60초다.

        Access/Refresh Token은 브라우저에 전달하지 않는다. 오류 리다이렉트에도 `state`를 그대로 돌려준다.

        **오류 리다이렉트**: `redirect_uri?error=...&error_reason=...&state=...`

        | `error` | 의미 |
        | --- | --- |
        | `invalid_request` | 파라미터 누락·형식 오류 |
        | `access_denied` | 사용자가 로그인·테넌트 선택·MFA를 취소함 |
        | `tenant_access_denied` | 대상 테넌트 접근 조건 미충족. `error_reason`은 `TenantAccessDeniedReason` 값 |
        | `no_eligible_tenant` | `tenant_id`를 생략했지만 선택할 수 있는 테넌트가 없음 |
        | `temporarily_unavailable` | 접근 자격 또는 외부 Provider 상태를 확인할 수 없음(`entitlement_unverifiable`, `idp_status_unavailable`) |
        | `server_error` | 그 밖의 서버 오류 |
      security: []
      x-requirements: [ADR-014, D-01, D-03, FR-AUTH-009-02-03, FR-AUTH-009-02-04, FR-OIDC-013, FR-APP-004, FR-MFA-003]
      parameters:
      - name: client_id
        in: query
        required: true
        schema:
          type: string
          maxLength: 128
      - name: redirect_uri
        in: query
        required: true
        schema:
          type: string
          format: uri
      - name: state
        in: query
        required: true
        schema:
          type: string
          minLength: 16
          maxLength: 256
      - name: code_challenge
        in: query
        required: true
        schema:
          type: string
          minLength: 43
          maxLength: 128
      - name: code_challenge_method
        in: query
        required: true
        schema:
          type: string
          const: S256
      - name: tenant_id
        in: query
        required: false
        description: 생략하면 Passport 포털이 테넌트 선택 화면을 보여준다(처리 순서 4).
        schema:
          $ref: '#/components/schemas/Uuid'
      responses:
        '302':
          description: '`redirect_uri`로 코드 또는 오류를 전달하거나, Passport 로그인·테넌트 선택·MFA 화면으로 이동. 토큰을 URL에 넣지 않는다.'
          headers:
            Location:
              schema:
                type: string
                format: uri
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`client_id`가 없거나 비활성이고, `redirect_uri`가 등록 값과 일치하지 않음. 리다이렉트하지 않는다.'

  /bff/auth/callback:
    servers:
    - url: https://{saas_bff_host}
      description: 각 SaaS 웹의 BFF 호스트. Passport는 이 경로를 구현하지 않는다.
      variables:
        saas_bff_host:
          default: papyrus.example.com
    get:
      operationId: bffSsoCallback
      tags:
      - SaaS BFF Reference
      summary: '[SaaS 구현] SSO 코드 교환과 BFF 세션 생성'
      description: |
        **각 SaaS BFF가 구현하는 참고 계약이다. Passport는 이 경로를 구현하지 않는다.** 실제 경로는 Application의 `bff_redirect_uris`에 등록한 값이다.
        브라우저와 연결해 보관한 state·PKCE를 검증하고 자신의 client 자격 증명으로 `/api/v1/auth/sso/token`을 호출한다.
        토큰은 서버에 보관하며 새 불투명 세션 쿠키만 설정한다. 원래 로그인 만료·활동·테넌트·MFA 범위와 철회 상태를 계속 적용한다.
        실패·재사용된 트랜잭션으로 세션을 만들지 않는다. state는 성공·실패 모두 검증하며 code와 error 중 하나만 수용한다.
        `error`가 오면 토큰을 교환하거나 세션을 만들지 않고, `bffAuthorizeSso`의 오류 표에 맞는 안내 화면을 보여준다.
      x-implemented-by: saas-bff
      security: []
      x-requirements: [ADR-014, D-01, D-03, FR-AUTH-009-02-01, FR-AUTH-009-02-03, FR-AUTH-009-02-04]
      parameters:
      - name: state
        in: query
        required: true
        schema:
          type: string
          maxLength: 256
      - name: code
        in: query
        required: false
        schema:
          type: string
          maxLength: 512
      - name: error
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/SsoAuthorizationError'
      - name: error_reason
        in: query
        required: false
        description: '`error = tenant_access_denied`일 때만 온다.'
        schema:
          $ref: '#/components/schemas/TenantAccessDeniedReason'
      responses:
        '302':
          description: SaaS 화면으로 이동. 토큰을 URL에 넣지 않는다.
          headers:
            Location:
              schema:
                type: string
                format: uri
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              description: SaaS BFF 자신의 불투명 세션 쿠키. 이름·속성은 SaaS가 정하되 HttpOnly·Secure·SameSite를 적용하고, 새 세션 ID로 발급한다(세션 고정 방지).
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/BffUnauthorized'
          description: 코드 교환 실패. 세션을 만들지 않는다.

  /api/v1/auth/sso/token:
    post:
      operationId: exchangeSsoCode
      tags:
      - Auth
      summary: BFF 서버의 SSO 인가 코드 교환
      description: |
        등록된 BFF client를 인증하고 코드의 client·redirect URI·PKCE·원래 로그인·테넌트와 현재 MFA·이용 자격·철회를 검증한다.
        코드를 원자적으로 한 번만 소비하며 해당 client의 허용 audience로만 토큰을 발급한다.
        BFF별 Refresh Token 계열을 사용하되 원래 로그인 유지 한도와 종료 범위에 연결한다. 서비스 간 쿠키나 Refresh Token을 공유하지 않는다.
        응답은 BFF 서버만 받고 브라우저에 전달하지 않는다.

        | 상태 | `code` | 경우 |
        | --- | --- | --- |
        | 400 | `invalid_grant` | 코드가 없거나 만료·사용됨, 코드의 client와 인증한 client 불일치, `redirect_uri` 불일치, `code_verifier`가 PKCE와 불일치 |
        | 401 | `invalid_client` | BFF client 인증 실패, 비활성 Application |
        | 403 | `tenant_access_denied`, `mfa_required` | 코드 발급 후 접근 자격·MFA 상태가 바뀜 |
        | 422 | `validation_failed` | 폼 필드 누락·형식 오류 |

        이미 사용된 코드가 다시 오면 `400 invalid_grant`를 반환하고, 그 코드로 발급한 Refresh Token 계열을 폐기한다.
      security:
      - bffClientBasic: []
      x-requirements:
      - ADR-014
      - FR-AUTH-009-02-01
      - FR-AUTH-009-02-03
      - FR-AUTH-009-02-04
      - D-03
      responses:
        '200':
          description: 처리 성공
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/InvalidGrant'
        '401':
          $ref: '#/components/responses/InvalidClient'
        '403':
          $ref: '#/components/responses/TokenForbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/TokenUnavailable'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SsoTokenRequest'

