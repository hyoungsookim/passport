openapi: 3.1.0
info:
  title: Passport API
  version: 0.2.0-draft
  summary: Passport P0 API 계약 (Phase 0 산출물)
  description: |
    Passport의 P0 범위 API 계약이다. `docs/REQUIREMENTS.md` 11장 Phase 0의 산출물이며,
    Phase 1 DB 모델 설계와 상호 검토한 뒤 구현의 기준으로 사용한다.

    ## 0. 문서 읽는 법

    - **확정**: 요구사항(FR/NFR/ADR/D-xx)에 이미 결정된 내용이다. 각 operation의
      `x-requirements`에 근거 ID를 적는다.
    - **[제안]**: 요구사항에 방식·수치가 없어 Phase 0에서 제안하는 값이다. 승인 전까지
      확정으로 간주하지 않는다. 전체 목록은 16장에 있다.
    - 브라우저 세션·서버 측 토큰 중계 계층의 외부 명칭은 **SSO**로 통일한다.
    - 경로·필드 이름은 `snake_case`이다. 리소스·서버 간 API는 `/api/v1`, 브라우저용 SSO는 `/sso` 아래에 둔다(헬스 체크 제외).
    - Phase 0에서 확정한 결정
      - **서비스 간 SSO**: 각 웹은 자신의 SSO를 사용한다. 브라우저는 HttpOnly 세션 쿠키로
        SSO를 호출하고, SSO는 Passport 로그인 연계로 자기 audience의 토큰을 서버에서 받는다.
      - **서비스 간 인증**: Application 등록 시 발급한 `client_id`와 `client_secret`을
        TLS 위 HTTP Basic으로 전달한다(FR-APP-007).
      - **서비스 이용 활성화 권한**: 테넌트 관리자는 자기 테넌트에서, 플랫폼 관리자는 모든
        테넌트에서 TenantApplication을 활성화·중단할 수 있다.

    **2026-11-02 확정 보완**: 외부 로그아웃·철회의 정확한 대상 매핑,
    독립 외부 보안 기록 영속화 후 완료 응답, 탈퇴 확인 키 24시간을 적용한다.
    OIDC 시작·콜백은 최초 브라우저에 바인딩하며, 캐시 버전은 DB 현재 버전과 대조한다.

    **인증 정책 책임:** OTP 등록·검증·복구와 MFA 정책은 OIDC Provider가 관리한다. Passport는 별도 MFA 판정·저장·전달과 `acr`·`amr` 인정 규칙을 제공하지 않는다. OIDC 토큰의 기본 검증과 민감 작업 재인증은 유지하며 Local 로그인에는 Provider의 OTP 정책이 적용되지 않는다.

    ## 1. 공통 규약

    | 항목 | 규약 |
    | --- | --- |
    | 인코딩 | 요청·응답 본문은 UTF-8 JSON. 오류는 `application/problem+json`(RFC 9457) |
    | 식별자 | `user_id`, `tenant_id` 등 모든 ID는 UUID 문자열. 추측하기 어려운 값이지만 ID만으로 인가를 대체하지 않는다 |
    | 시각 | RFC 3339 UTC 문자열(`2026-10-31T09:00:00Z`) |
    | null | 선택 항목의 값이 없으면 `null`. PATCH에서 `null`은 값 삭제를 뜻한다 |
    | 열거값 | 서버는 Python IntEnum과 DB smallint 키로 관리하고 API에는 이 계약의 문자열 명칭으로 변환한다. 내부 정수 키는 API enum 값으로 노출하지 않는다 |
    | 요청 추적 | 클라이언트는 `X-Request-ID`를 보낼 수 있다. 서버는 받은 값 또는 새 값을 모든 응답의 `X-Request-ID`와 오류 본문의 `request_id`로 돌려준다(NFR-OPS-001) |
    | 하위 호환 | 같은 메이저 버전 안에서는 필드 추가만 허용한다. 클라이언트는 모르는 필드를 무시해야 한다. 필드 삭제·의미 변경은 `/api/v2`로 한다 |
    | 비밀값 | 비밀번호, 토큰 원문, `client_secret`은 응답·로그에 다시 나타나지 않는다. 새 `client_secret`은 생성·교체 응답에서 한 번만 반환한다(NFR-SEC-008) |

    ## 2. 클라이언트와 인증 수단

    | 호출 주체 | 인증 수단 | 비고 |
    | --- | --- | --- |
    | 웹 관리 포털, SaaS 웹 프론트엔드 | 자신의 SSO에 HttpOnly 세션 쿠키 | 브라우저에는 Access/Refresh Token을 전달하지 않는다 |
    | 웹 SSO | 리소스 API에 사용자 Bearer 토큰, 토큰 발급·갱신에 SSO 클라이언트 인증 | 토큰은 서버에서만 보관·사용 |
    | 네이티브 앱(지원 시) | `Authorization: Bearer <access_token>` + Refresh Token은 응답 본문 | FR-AUTH-009-02-02. P0의 네이티브 로그인은 Local만 지원 |
    | 연동 SaaS 백엔드 | HTTP Basic(`client_id:client_secret`) | `/api/v1/service/*`만 호출 가능(FR-APP-007) |
    | 탈퇴 완료 확인 | 전용 `Withdrawal-Receipt` 헤더 | 해당 커밋된 탈퇴 요청의 처리 재개·완료 확인만 허용, 24시간 |
    | 공개 | 없음 | 가입, 이메일 확인, 로그인 시작, JWKS, 헬스 체크 |

    **SSO 세션 쿠키 [제안]**: Passport 포털의 이름은 `__Host-passport_session`, 속성은
    `HttpOnly; Secure; SameSite=Lax; Path=/`이다. 값은 무작위 불투명 세션 식별자이며
    Access/Refresh Token이나 외부 토큰을 담지 않는다. `Domain`을 지정하지 않는다.
    SaaS SSO는 자신의 호스트·쿠키 이름·세션을 사용한다. 쿠키의 수명은 연결된 원래 로그인
    최대 유지 한도 이내이며, 자동 세션 확인·갱신은 활동으로 처리하지 않는다.

    **CSRF 방어 [제안]**: 브라우저에서 SSO로 보내는 변경 요청에는 허용된 자기 Frontend의
    `Origin` 검사와 `X-CSRF-Protection: 1` 헤더를 모두 요구한다. 동일 Origin 요청도 서버에서
    헤더를 검증한다. OAuth 리다이렉트는 별도로 state·PKCE·허용된 redirect URI를 검증한다.
    SSO는 브라우저가 보낸 Authorization·Cookie·임의 목적지를 상위 API에 그대로 전달하지 않는다.
    CORS는 서비스마다 자신의 Frontend만 허용하며 다른 서비스의 쿠키를 공유하지 않는다.

    **API 경계**: `/api/v1`의 보호된 리소스는 Bearer 전용이다. 브라우저의 일반 업무 요청은 `/sso`로 보내고 SSO가 저장된 사용자 토큰으로 리소스 API를 호출한다. `/sso/api/v1/*`는 아래
    명시한 대응 API의 고정 프록시이며 자유로운 URL 프록시가 아니다. SaaS의 업무 API용 SSO는
    해당 SaaS가 구현한다. SSO는 기존 FastAPI 프로세스 안의 모듈로 구성할 수 있다.
    로그아웃·강제 종료·OIDC 근거 무효화·복원 시 연결된 SSO 세션도 종료한다.
    토큰 발급 응답은 SSO 서버 또는 직접 API 클라이언트만 받는다.
    OIDC 시작은 SSO가 직접 처리하고 공개 `/api/v1` 시작 경로를 두지 않는다. 트랜잭션별
    `__Host-passport_oidc_<id>` 쿠키는 256비트 난수이며 `HttpOnly; Secure; SameSite=Lax; Path=/`,
    `Domain` 없음, 트랜잭션과 동일 만료다. 콜백은 소비 전에 쿠키 해시를 대조하며 누락·불일치는 거부한다.
    탈퇴 확인 키는 Access/Refresh Token과 별개의 제한된 자격 증명으로, 클라이언트가 첫 요청 전에
    CSPRNG로 32바이트를 생성해 base64url(패딩 없음)로 보관한다. 웹은 자기 Origin의 sessionStorage에만
    완료 또는 최대 24시간까지 보관하고 완료·만료 시 지운다. 서버에는 해시만 저장하며 로그·응답에 노출하지 않는다.

    ## 3. 로그인과 토큰 모델

    ### 3.1 로그인(Login)

    인증(Local 비밀번호 또는 테넌트 OIDC)에 성공하면 서버에 **로그인**이 하나 생긴다.
    로그인 식별자는 Access Token의 `sid` 클레임이다. 로그인 하나는 다음을 기록한다.

    - 사용자, 인증 방식(`local`/`oidc`), 클라이언트 유형(`web`/`native`), 인증 시각
    - OIDC인 경우 대상 `tenant_id`, `oidc_config_id`, 외부 `(issuer, subject)`, 설정 버전(D-06 즉시 무효화용)
    - 최대 유지 만료 시각과 마지막 사용자 활동 시각(FR-AUTH-009-03)
    - 최근 재인증 시각·방식
    - 클라이언트별 Refresh Token 계열(회전 이력, 재사용 탐지용)과 연결된 SSO 세션
    - SSO 세션의 사용자·로그인·테넌트·인증 컨텍스트와 서버 측 토큰 저장 참조

    SSO의 세션 ID는 JWT `sid`와 별개의 비밀 자격 증명이다. `LoginInfo.login_id`는 공개해도
    인증할 수 없는 로그인 식별자이며 세션 쿠키 대신 사용할 수 없다. 세션 생성·SSO 연결로
    원래 인증 시각·만료·활동·테넌트 범위를 확대하지 않는다.

    | 클라이언트 유형 | 최대 유지 | 미사용 만료 | 근거 |
    | --- | --- | --- | --- |
    | `web` | 인증 후 8시간 | 마지막 사용자 활동 후 30분 | FR-AUTH-009-03-01/02 |
    | `native` | 인증 후 7일 | 마지막 사용자 활동 후 3일 | FR-AUTH-009-03-04/05 |

    갱신·회전은 최대 유지 시각을 늘리지 않고 미사용 시각도 초기화하지 않는다(FR-AUTH-009-07).

    ### 3.2 사용자 활동

    미사용 만료를 초기화하는 요청은 사용자의 명시적 동작으로 발생한 인증된 요청뿐이다
    (FR-AUTH-009-03-03/06). 클라이언트는 이런 요청에 `X-Passport-Activity: user` 헤더를 붙인다.
    헤더가 없으면 활동으로 보지 않는다. `POST /api/v1/auth/token`은 헤더와 관계없이 활동이 아니다.
    SaaS 요청의 활동 여부는 SaaS가 `POST /api/v1/service/access/verify`의 `user_activity`로 전달한다.

    ### 3.3 Access Token

    RFC 9068 JWT Access Token이다(FR-AUTH-008-01). 유효기간은 발급 후 30분(FR-AUTH-008)이다.

    | 위치 | 클레임 | 값 |
    | --- | --- | --- |
    | 헤더 | `typ` | `at+jwt` |
    | 헤더 | `alg` | **[제안]** `ES256`. 허용 목록 밖 알고리즘과 `none`은 거부(NFR-SEC-002) |
    | 헤더 | `kid` | 서명 키 ID. 검증 키는 `GET /api/v1/auth/jwks.json` |
    | 본문 | `iss` | 설치별 Passport 발급자 URL(설정값, 예: `https://passport.example.com`) |
    | 본문 | `sub` | Passport `user_id` |
    | 본문 | `aud` | 단일 문자열. Passport API는 `passport`, SaaS는 해당 Application의 `code`(예: `papyrus`) |
    | 본문 | `exp`, `iat`, `nbf` | `exp = iat + 1800` |
    | 본문 | `jti` | 토큰별 고유 ID |
    | 본문 | `client_id` | 토큰을 요청한 클라이언트. 관리 포털 `passport-portal`, 네이티브 `passport-native`, SaaS 웹은 Application `code` |
    | 본문 | `sid` | 로그인 ID. 즉시 철회 판단에 사용 |
    | 본문 | `auth_time` | 로그인의 인증 시각 |
    | 본문 | `auth_method` | `local` 또는 `oidc` |
    | 본문 | `tenant_id` | 테넌트 범위 토큰에만 있음 |
    | 본문 | `oidc_config_id` | `auth_method = oidc`일 때만 있음 |

    역할·멤버십은 토큰에 넣지 않는다. 멤버십 클레임만으로 현재 접근 자격을 보장하지 않기 때문이다
    (5장 보안 불변 조건). 외부 ID Token·외부 Access Token은 어떤 API에서도 인증 수단으로 받지 않는다
    (FR-AUTH-008-03, FR-OIDC-009-02).

    **토큰 범위**

    | 종류 | `aud` | `tenant_id` | 사용 가능한 API |
    | --- | --- | --- | --- |
    | 기본 토큰 | `passport` | 없음 | 사용자 수준 API: `/users/me/*`, 테넌트 생성, `/admin/*`(플랫폼 관리자) |
    | Passport 테넌트 토큰 | `passport` | 있음 | `/tenants/{tenant_id}/*`. 경로의 `tenant_id`와 클레임이 같아야 함 |
    | SaaS 토큰 | Application `code` | 항상 있음 | 해당 SaaS API. SaaS는 요청마다 `verify`를 호출 |

    로그인 응답은 기본 토큰을 준다. 테넌트 선택(FR-WEB-003)은
    `POST /api/v1/auth/token`에 `tenant_id`·`audience`를 지정해 새 토큰을 받는 것이다.
    이때 서버는 5장의 인가 검사 1~5를 모두 수행하고, 통과한 경우에만 발급한다
    (FR-OIDC-002, FR-APP-004).

    **audience 제한**: SSO는 등록된 confidential client의 서버 측 자격 증명으로 인증하고,
    자신에게 등록된 audience만 요청한다. 브라우저의 Origin이나 본문 client_type만으로 SSO를
    인증하지 않는다. 네이티브 클라이언트는 P0에서 `passport`만 요청할 수 있다.

    **서명 키 교체**: 90일마다 자동 교체한다(FR-AUTH-008). **[제안]** 새 키는 사용 24시간 전에
    JWKS에 게시하고, 이전 키는 마지막 서명 후 24시간 동안 게시를 유지한다. 검증자는 모르는 `kid`를
    만나면 JWKS를 다시 받되, 최소 5분 간격을 둔다.

    ### 3.4 Refresh Token과 회전

    - 갱신할 때마다 새 Refresh Token을 발급하고 이전 것을 무효화한다(FR-AUTH-009-07).
    - 무효화된 Refresh Token이 다시 오면 재사용으로 판단한다. 이때 해당 사용자의 모든 로그인을
      종료하고, Refresh Token 전체를 폐기하며, 발급된 Access Token 전체를 즉시 철회한다(FR-AUTH-009-07-01).
    - SSO는 동일 Refresh Token 계열의 갱신을 서버에서 직렬화하고 회전 결과를 원자적으로 저장한다.
      여러 SSO·브라우저가 하나의 Refresh 쿠키를 공유하지 않는다. 정상적인 동시 요청은 SSO에서
      조정하며, 이미 무효화된 Refresh Token을 다시 제출하면 기존 재사용 탐지 정책을 적용한다.

    ### 3.5 즉시 철회

    | 사건 | 철회 범위 | 근거 |
    | --- | --- | --- |
    | 현재 로그인 로그아웃 | 그 로그인(`sid`)의 Refresh·Access Token 전체 | FR-AUTH-009-04, 009-06-01 |
    | 모든 기기 로그아웃 | 사용자의 모든 로그인 | FR-AUTH-009-04, 009-06-01 |
    | 비밀번호 변경, 계정 차단·비활성화 | 사용자의 모든 로그인 | FR-AUTH-009-05, 009-06-02 |
    | Refresh Token 재사용 탐지 | 사용자의 모든 로그인 | FR-AUTH-009-07-01 |
    | OIDC 신뢰 설정 변경·비활성화 | 그 설정에 근거한 해당 테넌트의 OIDC 로그인 | D-06 |
    | 외부 계정 차단·비활성화 확인 | 그 외부 신원·테넌트의 OIDC 로그인 전체 | FR-OIDC-015 |
    | Provider 로그아웃 확인 | 검증된 외부 세션에 매핑된 Passport 로그인만 | FR-OIDC-017, 017-01 |
    | 외부 토큰 명시적 철회 확인 | 검증된 철회 대상 토큰에 매핑된 Passport 로그인만 | FR-OIDC-018, 017-01 |
    | 백업 복원 | 설치의 모든 로그인과 서명 키 | NFR-OPS-002-02 |

    Passport API는 요청마다 `sid`의 로그인 상태를 확인한다. SaaS는 테넌트 범위 요청마다
    `POST /api/v1/service/access/verify`를 호출하며, 이 응답이 철회·로그인 만료를 함께 판정한다.
    따라서 만료 전 Access Token도 철회 직후의 신규 요청부터 거부된다.

    Passport 로그아웃은 외부 Provider 로그아웃을 요청하지 않는다(FR-AUTH-009-04).
    외부 로그아웃·철회는 서명·발급자·대상자·테넌트 설정과 대상 식별자를 검증하고 저장된 외부 세션·토큰
    매핑으로만 반영한다. 식별자 누락·불일치·매핑 실패 통지는 거부·감사하고 신원 전체 종료로 확대하지 않는다.
    이 매핑을 지원하지 않는 Provider 기능·설정은 지원하지 않는다. Keycloak·Auth0도 버전·설정별 검증이 필요하다.

    **외부 상태 확인 불가(FR-OIDC-016)**: 외부 계정 상태를 확인할 수 없는 동안에는 다음과 같이 처리한다.
    - 신규 OIDC 로그인과 OIDC 로그인의 토큰 발급·갱신은 `503 idp_status_unavailable`로 거부한다.
    - 이미 발급된 Access Token은 다른 조건을 충족하는 동안 만료까지 수용한다.

    ## 4. 인가

    인가 검사는 다음 순서로 수행한다(5장 인가 모델).
    1. 토큰 신뢰성: 서명, `typ`, `iss`, `aud`, `exp`, `nbf`, 철회 여부, 로그인 유지 조건
    2. 테넌트 인증 요건: Local 로그인이거나, 대상 테넌트의 활성 OIDC 설정으로 성립한 OIDC 로그인이다(FR-OIDC-013)
    3. 계정 유효성: 계정 상태가 `active`이다
    4. 테넌트 소속: 대상 테넌트가 `active`이고 멤버십이 `active`이다
    5. 서비스 이용 계약: SaaS audience이면 TenantApplication이 `active`이다
    6. 도메인 권한: SaaS가 판단한다(Passport 범위 밖)


    **역할**

    | 역할 | 범위 | 부여 |
    | --- | --- | --- |
    | `member` | 소속 테넌트 | 관리자가 추가하거나 OIDC 자동 등록 |
    | `admin` | 소속 테넌트 | 테넌트 생성자(FR-MEM-004) 또는 기존 관리자가 지정 |
    | `platform_admin` | Passport 전체 | 설치 시 CLI로 지정. P0에는 부여 API가 없다 |

    **경계**
    - `/tenants/{tenant_id}/*`는 테넌트 토큰의 `tenant_id`와 경로가 같아야 한다. 다르면 `403 tenant_context_mismatch`이다.
    - 소속되지 않은 테넌트의 리소스는 존재를 숨기기 위해 `404 not_found`를 반환한다.
    - 플랫폼 관리자 기능은 `/admin/*`으로 분리하고 기본 토큰만 받는다. 모든 호출을 감사 기록한다(5장 보안 불변 조건).
    - `/service/*`는 Application 자격 증명만 받는다. 해당 Application이 `active`인 테넌트의 데이터만 반환한다.

    ## 5. 인증 단계별 허용 작업과 재인증

    | 상태 | 허용 | 거부 |
    | --- | --- | --- |
    | 이메일 미확인 Local 계정 | 이메일 확인, 재발송 | 로그인(`403 email_verification_required`), 그 외 모든 API |
    | 로그인했지만 테넌트 토큰 없음 | 사용자 수준 API, 재인증, 로그아웃, 토큰 발급 요청 | 테넌트 범위 API |
    | 유효한 테넌트 토큰 있음 | 역할·현재 이용 자격에 따른 테넌트 API | 권한 밖 작업 |

    계정 탈퇴와 외부 신원 연결에는 최근 재인증을 요구한다. **[제안]** 유효기간은 5분이며 로그인 직후 5분도 인정한다.
    - Local 로그인: `POST /api/v1/auth/reauthentication/password`
    - OIDC 로그인: `POST /sso/api/v1/auth/oidc/{tenant_code}/authorizations`(`intent = reauth`), 해당 Provider에서 재인증

    ## 6. 프로필 필드 열람 범위 (FR-USER-002-02)

    | 보는 사람 | `email` | `display_name` | `fist_name` | `last_name` | 스키마 |
    | --- | --- | --- | --- | --- | --- |
    | 본인 | O | O | O | O | `UserSelf` |
    | 같은 테넌트 관리자 | O | O | O | O | `MemberAdminView` |
    | 같은 테넌트 일반 구성원 | - | O | - | - | `MemberPeerView` |
    | 플랫폼 관리자 | O | O | - | - | `PlatformUserView` |
    | 연동 SaaS(이용 자격 범위) | O | O | - | - | `ServiceUserView` |

    탈퇴하면 사용자와 모든 FK 자손을 즉시 물리 삭제한다. 개인정보 추가 보관·탈퇴자 개인정보 조회 기능은 제공하지 않는다(FR-USER-005, 005-01).

    ## 7. 목록: 페이징·검색·정렬

    - 커서 페이징: `limit`(1~100, 기본 20), `cursor`(직전 응답의 `next_cursor`). 응답은 `{ "items": [...], "next_cursor": "..." | null }`.
    - 검색: `q`. 2자 이상이고 엔드포인트별로 지정된 필드에 대한 대소문자 무시 부분 일치이다.
      보는 사람이 열람할 수 없는 필드로는 검색하지 않는다(예: 일반 구성원은 이메일로 검색 불가).
    - 필터: 엔드포인트별 상태·역할 파라미터.
    - 정렬: `sort`. 허용 값은 엔드포인트별 enum이고, `-` 접두사는 내림차순이다. 동률은 ID로 정렬해 커서가 안정적이다.
    - 인가 필터는 항상 먼저 적용한다. 권한 밖 항목은 목록에 나타나지 않는다.
    - 전체 개수는 반환하지 않는다(대규모 테넌트의 비용).

    ## 8. 동시성·재시도·부분 실패

    - **낙관적 동시성**: 변경 가능한 리소스 응답에는 `ETag`가 있다. 그 리소스를 바꾸는 PUT/PATCH/DELETE는
      `If-Match`가 필요하다. 없으면 `428 precondition_required`, 버전이 다르면 `412 precondition_failed`이다.
      새로 만드는 PUT은 `If-None-Match: *`를 쓴다.
    - **멱등 키**: 생성 POST와 접근 자격·외부 보안 기록 대상 변경 API는 `Idempotency-Key`(1~128자, 클라이언트 생성 UUID 권장)를 받는다.
      - 접근 자격·외부 보안 기록 대상 변경 API에서는 필수이고, 없으면 `400 idempotency_key_required`이다.
      - 같은 키와 같은 본문이 다시 오면 처음 결과를 재생하고 `Idempotency-Replayed: true`를 붙인다.
      - 같은 키에 다른 본문이 오면 `422 idempotency_key_reused`이다.
      - **[제안]** 키는 24시간 보관한다.
      - 멱등 키 확인은 `If-Match` 평가보다 먼저 한다. 그래서 커밋 후 재시도할 때 바뀐 ETag 때문에 실패하지 않는다.
    - **접근 자격 변경 API**(FR-APP-008): 멤버십 추가·상태 변경·제거, 테넌트 상태 변경, TenantApplication 변경, 계정 탈퇴.
      1. 9.4절 대상이면 외부 변경 의도 영속화를 확인한 뒤 상태 변경과 관련 `access_version` 증가를 한 DB 트랜잭션으로 커밋한다(FR-APP-008-06). 멤버 추가는 초기 버전 `1`을 기록한다. 탈퇴는 삭제할 멤버십의 직전 버전 + 1을 최종 무효화 버전으로 큐·외부 기록에 남기고 사용자 및 FK 자손을 삭제한다.
      2. 커밋 후 최신 버전을 Valkey 검증 경로에 반영한다. 삭제한 멤버십은 큐의 최종 무효화 버전을 사용하며 사용자·멤버십 행 없이도 재시도한다. 이전 버전으로 덮어쓰지 않는다(FR-APP-008-07).
      3. 1과 2 및 대상 작업의 외부 커밋 확인이 끝난 뒤에만 성공을 응답한다. 이 응답 이후 시작된 해당 범위의 신규 요청에는 변경 후 접근 자격을 적용하며, 자격을 회수한 경우 거부한다(FR-APP-008-01).
      4. 2가 실패하면 `503 access_sync_pending`을 반환한다. 본문의 `db_committed: true`, `cache_synced: false`로
         저장 완료와 반영 미완료를 구분한다. 같은 `Idempotency-Key`로 재시도하면 상태·버전을 다시 바꾸지 않고,
         원 작업의 외부 커밋 확인과 최신 DB 상태·버전의 Valkey 반영을 마친 뒤 처음 결과를 반환한다(FR-APP-008-09).
    - **외부 보안 기록**(NFR-OPS-002-03): 탈퇴·차단·해지·접근 중지·개인정보 및 인증 수단 삭제와 대응하는
      재활성화·재부여는 `DB_MODEL.md` 9.4절을 따른다. 변경 의도를 독립 외부 저장소에 먼저 영속화하고,
      DB 상태·버전·연결 원장을 같은 트랜잭션에서 커밋한 뒤 외부 커밋 확인과 필요한 Valkey 반영을 마쳐야 성공이다.
      대상 변경 요청은 Idempotency-Key가 필수다. 실패 시 `503 security_record_pending`과 `db_committed`, `security_recorded: false`를 반환한다.
      커밋 전 실패는 롤백하고, 커밋 후 실패는 원 작업의 외부 확인·동기화만 재시도한다. 관련 operation의 503은 이 오류도 포함한다.
      복원 시 외부 기록의 누락·무결성 오류를 검증하고 삭제·차단을 재적용하기 전에는 서비스를 재개하지 않는다.
    - **Valkey 신뢰**: 매 요청 관련 세 버전을 DB의 현재 커밋된 상태·버전과 함께 읽는다.
      사용자·로그인·멤버십이 삭제되었으면 기존 토큰을 거부한다. SaaS·Valkey·DB 버전이 모두 같고 현재 자격이 유효한 경우에만 캐시를 `fresh`로 사용한다.
      Valkey 값 누락·불일치·장애는 DB 검증으로 대체하고 현재 자격을 함께 반환한다(캐시 제공 시 stale, 없으면 absent). 재구축 후 정상 비교를 재개하며 DB 검증도 실패하면 503이다.
      이전 스냅샷 복구·키 재생성·지연 쓰기도 같은 규칙으로 처리한다.
    - **탈퇴 재시도**: 첫 요청에 `Withdrawal-Receipt`를 필수로 보내 원 사용자·멱등 키·본문 해시에 바인딩한다.
      로그인 종료 후에는 전용 완료 경로로 이미 커밋된 원 요청의 외부 기록·Valkey 반영과 완료 응답만 재개한다.
      삭제된 사용자·로그인 행을 조회하거나 복구하지 않고 사용자 FK 없는 원 멱등·동기화·보안 기록으로만 처리한다.
      키는 원 DB 커밋부터 24시간 유효하고 일반 API 인증·새 탈퇴·계정 복구·정보 조회에는 사용할 수 없다.
      원 응답 유실이나 401·503 이후에도 클라이언트에 미리 보관한 키로 완료 경로를 사용할 수 있다.
    - 변경 응답 전에 이미 인가를 통과한 요청은 완료를 허용한다(FR-APP-008-02).

    ## 9. 오류 계약

    모든 오류는 RFC 9457 Problem Details(`Problem` 스키마)이다. 클라이언트는 `code`로 분기한다.
    `type`은 `urn:passport:problem:{code}`이다.

    | HTTP | `code` | 의미 |
    | --- | --- | --- |
    | 400 | `invalid_request` | 형식은 맞지만 처리할 수 없는 요청(잘못된 조합 등) |
    | 400 | `invalid_token_value` | 이메일 확인 토큰, 링크 티켓 등 일회성 값이 없거나 만료·사용됨 |
    | 400 | `invalid_grant` | SSO 인가 코드가 없거나 만료·사용됨, 또는 client·`redirect_uri`·PKCE 불일치 |
    | 400 | `idempotency_key_required` | 필수 `Idempotency-Key` 누락 |
    | 401 | `unauthenticated` | 인증 정보 없음 |
    | 401 | `invalid_token` | 서명·`typ`·`iss`·`aud`·만료 검증 실패 |
    | 401 | `token_revoked` | 철회된 토큰(로그아웃, 강제 종료 등) |
    | 401 | `login_expired` | 로그인 최대 유지·미사용 만료 |
    | 401 | `invalid_credentials` | 이메일·비밀번호 불일치. 계정 존재 여부를 드러내지 않는다(FR-AUTH-006) |
    | 401 | `refresh_token_invalid` | Refresh Token 없음·만료·무효 |
    | 401 | `refresh_token_reused` | 재사용 탐지. 모든 로그인 종료됨 |
    | 401 | `invalid_client` | 서비스 자격 증명 실패 |
    | 403 | `forbidden` | 역할 부족 |
    | 403 | `email_verification_required` | 이메일 미확인 |
    | 403 | `account_inactive` | 계정 차단·비활성(비밀번호 검증 후에만 반환) |
    | 403 | `tenant_access_denied` | 테넌트·서비스 접근 조건 미충족. `reason` 확장 필드 포함 |
    | 403 | `tenant_context_mismatch` | 토큰 `tenant_id`와 경로 불일치 |
    | 403 | `reauthentication_required` | 최근 재인증 필요. `accepted_methods` 확장 필드 포함 |
    | 403 | `self_action_forbidden` | 본인 대상 금지 작업(본인 계정 차단·비활성화 등) |
    | 404 | `not_found` | 없음 또는 은닉 |
    | 409 | `conflict` | 상태 충돌(일반) |
    | 409 | `already_exists` | 중복 생성(테넌트 코드, Application 코드, 멤버십) |
    | 409 | `identity_already_linked` | 외부 신원이 이미 다른 사용자에게 연결됨(FR-OIDC-005) |
    | 409 | `last_tenant_admin` | 마지막 관리자 제거·강등·탈퇴 |
    | 409 | `local_credential_not_set` | Local 비밀번호가 없는 계정 |
    | 412 | `precondition_failed` | `If-Match` 불일치 |
    | 422 | `validation_failed` | 필드 검증 실패. `errors[]` 포함 |
    | 422 | `idempotency_key_reused` | 같은 키에 다른 본문 |
    | 428 | `precondition_required` | `If-Match` 누락 |
    | 429 | `too_many_requests` | 속도 제한·실패 제한. `Retry-After` 포함 |
    | 503 | `access_sync_pending` | DB 저장 완료, Valkey 반영 미완료. 같은 멱등 키로 재시도. 탈퇴는 전용 완료 경로 |
    | 503 | `security_record_pending` | 외부 보안 기록 미완료. `db_committed`로 DB 반영 여부 구분. 원 요청의 안전한 재시도 |
    | 503 | `entitlement_unverifiable` | 접근 자격 최신 상태 확인 불가. 기존 로그인은 유지(FR-APP-008-03) |
    | 503 | `idp_status_unavailable` | 외부 Provider 상태 확인 불가(FR-OIDC-016) |
    | 503 | `oidc_provider_error` | Provider 통신·설정 오류(FR-OIDC-006) |

    `tenant_access_denied`의 `reason`: `not_a_member`, `membership_inactive`, `tenant_inactive`,
    `application_not_enabled`, `oidc_login_required`, `oidc_configuration_unavailable`.
    `not_a_member`는 존재하지 않는 `tenant_id`에도 같은 응답을 준다.

    ## 10. 속도·실패 제한 [제안] (FR-AUTH-006)

    | 대상 | 제한 |
    | --- | --- |
    | Local 로그인, 비밀번호 재인증 | 계정별 실패 5회/15분 후 15분 잠금, IP별 30회/분. 잠금 중에도 응답 문구는 `invalid_credentials`와 구분되지 않게 `429`만 사용 |
    | 가입, 이메일 재발송 | IP별 10회/시간, 이메일별 재발송 5회/시간 |
    | `POST /auth/token` | 로그인별 60회/분 |

    계정별 비밀번호·연속 실패 통계·잠금 만료 시각은 `user_securities`에서 관리한다.
    연속 실패 통계와 위 15분 시간창 집계는 구분하며, 저장된 `locked_until`은 캐시 손실 시에도 적용한다.
    실패 통계는 오류 응답 전에 커밋하고 Local 인증 잠금은 독립적인 OIDC 로그인을 차단하지 않는다.

    ## 11. 주요 흐름

    웹 브라우저 기준으로 적는다. 브라우저는 `/sso/*`만 호출하고, 각 `/sso/api/v1/*`는 같은 경로의 `/api/v1/*`로 고정 중계된다.
    네이티브 클라이언트는 `/sso` 접두사 없는 같은 `/api/v1/*` 경로를 Bearer로 호출하고, 테넌트 선택은 `POST /api/v1/auth/token`으로 한다.

    **F-01 Local 가입과 이메일 확인 (SC-01)**
    1. `POST /sso/api/v1/auth/signup`: 항상 `202`. 이미 가입된 이메일이면 새 계정 대신 안내 메일을 보낸다(계정 열거 방지).
    2. 사용자가 메일의 링크를 열면 포털이 `POST /sso/api/v1/auth/email-verifications/confirm`을 호출한다.
    3. 확인 전 로그인은 비밀번호 검증 후 `403 email_verification_required`이다.

    **F-02 Local 로그인과 테넌트 선택 (SC-01, SC-04)**
    1. `POST /sso/auth/local/login`: SSO가 서버에서 기본·Refresh Token을 받아 보관하고, 브라우저에는 세션 쿠키와 안전한 로그인 상태만 반환한다.
    2. `GET /sso/api/v1/users/me/tenants`: 테넌트별 `access.status`로 선택 화면을 그린다.
    3. `POST /sso/auth/context { "tenant_id": T }`: SSO가 서버에서 `POST /api/v1/auth/token`을 호출해 테넌트 토큰을 보관한다.
       - 성공하면 브라우저는 안전한 상태(`SsoSessionResponse`)만 받는다.
       - `oidc_login_required`이면 해당 테넌트의 OIDC 로그인이 필요하다. Local 로그인에는 이 사유가 나오지 않는다.

    **F-03 테넌트 OIDC 로그인 (SC-02)**
    1. 테넌트를 식별한다. 전용 링크면 경로의 `tenant_code`, 공통 화면이면 입력한 코드를 쓴다. `GET /sso/api/v1/auth/tenants/{tenant_code}/login-options`로 OIDC 가능 여부를 확인한다.
    2. `POST /sso/api/v1/auth/oidc/{tenant_code}/authorizations { "intent": "login" }`
       - 서버는 로그인 트랜잭션(state, nonce, PKCE verifier)을 테넌트·설정·설정 버전·브라우저 비밀 쿠키 해시에 묶어 저장한다.
       - 트랜잭션별 HttpOnly 쿠키를 설정한다. 다른 탭에서 시작한 트랜잭션의 쿠키를 덮어쓰지 않는다.
       - 응답의 `authorization_url`로 브라우저를 이동한다.
    3. Provider가 Passport SSO의 `GET /sso/auth/oidc/callback/{tenant_id}`로 돌려보낸다. 서버는 다음을 검증한다(FR-OIDC-003/007/008/012).
       - `state`로 찾은 트랜잭션의 최초 브라우저 쿠키 해시가 같은지(소비 전 검사)
       - 트랜잭션의 테넌트가 경로의 `tenant_id`와 같은지
       - `iss` 응답 파라미터(RFC 9207)가 있으면 그 값이 설정 발급자와 같은지
       - PKCE 코드 교환
       - ID Token의 서명, `iss`, `aud = client_id`, `nonce`, `exp`, `iat`
    4. `(issuer, subject)`로 사용자를 찾는다(FR-OIDC-004).
       - 없고 같은 이메일의 계정도 없으면 계정과 외부 신원을 자동 생성한다(D-08).
       - 같은 이메일의 기존 계정이 있으면 생성하지 않는다. `link_required`와 링크 티켓으로 돌려보낸다(F-04).
    5. 멤버십을 확인한다.
       - 활성 멤버십이 있으면 진행한다.
       - 자동 등록 모드이고 이전 멤버십이 없으면 `member`로 등록한다.
       - 수동 등록(`manual`) 모드이고 소속 이력이 없으면 멤버십을 생성하지 않고 계정·기본 로그인 생성만 진행한다. 관리자가 `user_id`로 추가하기 전까지 테넌트 토큰 발급·접근은 거부한다.
       - 해지·비활성 멤버십은 자동 복구하지 않으며, 로그인을 만들지 않고 `membership_required`로 돌려보낸다(FR-MEM-008).
    6. 로그인을 만들고 Passport SSO가 기본·Refresh Token을 서버에 저장한 후 세션 쿠키를 설정한다. 로그인에는 검증한 테넌트·OIDC 설정·신뢰 버전과 외부 종료 대상 매핑을 유지한다. 등록된 SSO 완료 경로로 이동하며 브라우저에 토큰은 전달하지 않는다.
    7. 포털은 `GET /sso/auth/session`으로 상태를 확인하고 `POST /sso/auth/context`로 테넌트를 선택한다.

    콜백 결과는 URL 조각(`#`)으로만 전달한다. 서버 로그와 Referer에 남지 않게 하기 위해서다.

    **F-04 외부 신원 연결 (FR-OIDC-005, FR-USER-006)**
    - 충돌에서 시작하는 경우
      1. F-03의 `link_required`로 링크 티켓을 받는다. **[제안]** 유효 10분, 1회용, 해당 외부 신원·테넌트·설정에 묶인다.
      2. 사용자가 기존 계정으로 로그인한다.
      3. `POST /sso/api/v1/users/me/identities { link_ticket, confirm: true }`를 호출한다. 로그인 직후이므로 재인증 조건을 충족한다.
    - 설정 화면에서 시작하는 경우
      1. `POST /sso/api/v1/auth/oidc/{tenant_code}/authorizations { "intent": "link" }`
      2. 콜백 결과 `link_ready`로 티켓을 받는다.
      3. 재인증 후 위와 같이 연결한다.
    - 외부 신원이 이미 다른 사용자에게 연결되어 있으면 `409 identity_already_linked`이고, 기존 연결을 유지한다.

    **F-07 SSO 로그인 유지·SaaS 진입 (D-01, D-03)**
    1. 새로고침 후 브라우저는 자신의 SSO의 `GET /sso/auth/session`으로 안전한 로그인 상태만 받는다.
       API 호출은 대응하는 `/sso/api/v1/*` 경로로 보내며 Access Token을 받거나 직접 붙이지 않는다.
    2. SaaS 진입 시 SaaS SSO는 state·PKCE를 저장하고 브라우저를 Passport의 `/sso/auth/authorize`로 보낸다.
       Passport는 자신의 SSO 세션으로 기존 로그인과 현재 테넌트·이용 자격을 검증한다.
    3. 로그인이 필요하면 Passport 포털에서 완료한다. 콜백 대상은 등록된 SSO URI와 정확히 일치해야 한다.
       검증이 끝나면 해당 client·redirect URI·원래 로그인·테넌트·PKCE에 묶인 일회용 인가 코드를 돌려준다.
    4. SaaS SSO는 자신의 서버 자격 증명과 code_verifier로 `/api/v1/auth/sso/token`에서 코드를 교환한다.
       SSO는 토큰을 서버에 보관하고 자신의 세션 쿠키를 설정한다. 코드는 짧은 수명·1회용이며 원자적으로 소비한다.
    5. 각 SSO가 자신의 Refresh Token 계열을 서버에서 갱신한다. 로그인 유지 한도·활동·외부 인증 범위는
       원래 로그인 기준을 유지하며, SSO 코드 교환으로 기존 인증의 유효기간을 연장하지 않는다.
    6. `/api/v1/auth/token`과 `/api/v1/auth/sso/token`은 SSO 서버와 직접 API 클라이언트만 호출한다.
       토큰 발급·테넌트 선택 결과는 SSO가 보관하고 브라우저에는 안전한 상태만 반환한다.
    7. 어느 SSO에서 로그아웃해도 원래 로그인(`sid`) 전체가 끝나 같은 브라우저의 모든 SSO 세션이 무효가 된다.
       Passport SSO는 요청마다 `sid`를 확인하고, SaaS SSO는 `verifyAccess` 거부(`token_revoked` 등)나 갱신 `401`을 받으면 자기 세션과 쿠키를 지운다.

    **F-08 SaaS 요청별 접근 자격 검증 (FR-APP-008-01~05, SC-05)**
    1. SaaS 백엔드는 받은 Passport 토큰의 서명과 `aud`를 로컬에서 검증할 수 있다(JWKS).
    2. 테넌트 범위 요청마다 `POST /service/access/verify`를 호출한다.
       - 본문에 토큰 원문, `user_activity`, 캐시해 둔 세 버전(`tenant`, `membership`, `tenant_application`)을 담는다.
    3. 응답의 `cache_status`에 따라 처리한다.
       - `fresh`이면 캐시를 그대로 쓴다.
       - `stale`이거나 `absent`이면 응답의 현재 자격으로 캐시를 교체한다.
    4. `decision = deny`이면 `deny_reason`에 따라 401 또는 403으로 응답한다.
    5. `503 entitlement_unverifiable`이면 요청을 거부한다. 이전 캐시로 허용하지 않는다(FR-APP-008-03).

    **F-09 접근 자격 변경과 부분 실패 (FR-APP-008-06~09)**
    - 관리자가 `DELETE /sso/api/v1/tenants/{tenant_id}/members/{membership_id}`를 `If-Match`·`Idempotency-Key`와 함께 호출한다.
      - `204`이면 완료다.
      - `503 access_sync_pending`이면 같은 `Idempotency-Key`로 재시도한다.
    - 테넌트 상태 변경과 TenantApplication 변경도 같은 방식이다.

    **F-10 탈퇴 (SC-06, FR-USER-005)**
    1. 재인증한다.
    2. 첫 요청 전에 256비트 확인 키를 생성·보관하고 `POST /sso/api/v1/users/me/withdrawal { confirm: true }`를
       `Idempotency-Key`·`Withdrawal-Receipt`와 함께 호출한다.
       - 즉시 완료되며 유예와 취소는 없다.
       - 사용자와 모든 FK 자손을 같은 트랜잭션에서 물리 삭제한다. 과거 해지 멤버십·종료 로그인·토큰도 삭제하며 기존 토큰은 거부한다. 응답과 함께 SSO 세션 쿠키가 지워진다.
       - 개인정보를 추가 보관하지 않는다. 감사로그와 사용자 FK 없는 원 탈퇴 완료 확인·동기화·복원용 기록은 개인정보 값 없이 유지한다.
    3. 응답 유실·503 또는 세션 무효화로 원 API가 401이면 `/sso/auth/withdrawals/complete`에 같은 확인 키를 보낸다.
       - 유효한 키로 커밋된 원 요청의 외부 기록·Valkey 반영을 재개하고, 완료 시 204를 반환한다.
       - 미커밋 요청·불명·만료 키는 동일한 404다. 키는 첫 커밋부터 24시간만 유효하고 연장하지 않는다.
       - 브라우저 완료 경로는 세션 쿠키 대신 확인 키와 자기 Origin·CSRF 헤더를 검증한다. 개인정보·계정 상태 본문은 반환하지 않는다.

