paths:
  /api/v1/auth/signup:
    post:
      operationId: signupLocal
      tags: [Auth]
      summary: Local 계정 공개 가입
      description: |
        관리자 초대·승인 없이 Local 계정을 만든다. 계정은 `pending_verification` 상태로 생성되고 이메일 확인 메일을 보낸다.
        이미 가입된 이메일이어도 같은 `202`를 반환하고, 새 계정 대신 "이미 가입됨" 안내 메일을 보낸다(계정 열거 방지, FR-AUTH-006).
        테넌트 소속과 SaaS 이용 권한은 부여하지 않는다(FR-USER-003).
      security: []
      x-requirements: [FR-USER-003, FR-AUTH-006, FR-AUTH-007, D-04]
      x-audit-event: user.signup_requested
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/auth/email-verifications/confirm:
    post:
      operationId: confirmEmailVerification
      tags: [Auth]
      summary: 이메일 소유 확인 완료
      description: |
        메일의 확인 토큰을 제출한다. 성공하면 계정이 `active`가 된다. 토큰은 1회용이며 **[제안]** 24시간 유효하다.
        확인 수단(링크 토큰)은 SC-01의 "인증 링크나 코드" 중 링크 방식이다.
      security: []
      x-requirements: [FR-USER-003, D-04]
      x-audit-event: user.email_verified
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerificationConfirmRequest'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/InvalidTokenValue'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/auth/email-verifications/resend:
    post:
      operationId: resendEmailVerification
      tags: [Auth]
      summary: 이메일 확인 메일 재발송
      description: 계정 존재·확인 여부와 관계없이 항상 `202`를 반환한다(계정 열거 방지). 이전 확인 토큰은 무효화된다.
      security: []
      x-requirements: [FR-USER-003, FR-AUTH-006, D-04]
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerificationResendRequest'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/auth/local/login:
    post:
      operationId: loginLocal
      tags:
      - Auth
      summary: Local 로그인
      description: |
        이메일·비밀번호로 로그인하고 기본 토큰(`aud = passport`, `tenant_id` 없음)을 발급한다.
        - `web`: 등록된 BFF client 인증이 필수이며 토큰은 BFF 서버에 응답 본문으로 반환한다. 브라우저는 /bff/auth/local/login을 사용한다.
        - `native`: 토큰을 응답 본문으로 전달한다. client_type 생략 시 native로 처리한다.
        BFF 자격 증명 없이 web 로그인을 만들 수 없고 브라우저 응답에 토큰을 전달하지 않는다.

        계정이 없거나 비밀번호가 틀리면 같은 `401 invalid_credentials`를 반환하고, 응답 시간도 같게 맞춘다.
        아래 두 오류는 비밀번호가 맞을 때만 반환한다.
        - `403 email_verification_required`: 이메일 미확인
        - `403 account_inactive`: 계정 차단·비활성
      security:
      - bffClientBasic: []
      - {}
      x-requirements:
      - FR-AUTH-001
      - FR-AUTH-002
      - FR-AUTH-005
      - FR-AUTH-006
      - FR-AUTH-007
      - FR-AUTH-008-01
      - FR-AUTH-009-02
      - FR-AUTH-010
      - SC-01
      x-audit-event: auth.login_succeeded / auth.login_failed
      parameters:
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocalLoginRequest'
      responses:
        '200':
          description: 로그인 성공
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              examples:
                web:
                  $ref: '#/components/examples/TokenResponseWeb'
                native:
                  $ref: '#/components/examples/TokenResponseNative'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
          description: '이메일·비밀번호 불일치(`invalid_credentials`, 계정 존재 여부 비공개) 또는 BFF client 인증 실패(`invalid_client`)'
        '403':
          $ref: '#/components/responses/LoginForbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/auth/token:
    post:
      operationId: issueToken
      tags:
      - Auth
      summary: Access Token 발급·갱신(테넌트 선택, SaaS 진입 포함)
      description: |
        BFF 서버 또는 직접 API 클라이언트가 본문의 refresh_token으로 지정한 tenant_id·허용 audience의 Access Token을 발급하고 Refresh Token을 회전한다.
        web 로그인에 연결된 Refresh Token은 등록된 BFF client 인증이 필수이며 해당 client의 허용 audience로 제한한다. native는 기존 직접 토큰 계약을 따른다.
        로그인의 서버 측 client_type·client 연결을 검증하며 요청 본문으로 web/native를 전환할 수 없다. 브라우저 세션 쿠키는 받지 않는다.
        토큰은 응답 본문으로 BFF 서버·직접 클라이언트에만 전달한다. 테넌트·MFA·이용 자격·로그인 유지·외부 인증 상태를 확인한다.
        BFF는 계열별 갱신을 직렬화한다. 무효화된 Refresh Token 재사용은 기존 전체 로그인 종료·토큰 철회 정책을 따른다.
        검증 불가(503) 또는 조건 미충족이면 토큰을 회전하지 않고 기존 로그인·Refresh Token을 보존한다.
        `401`(`invalid_client` 제외)이면 로그인이 끝난 것이므로 BFF는 그 세션과 서버 측 토큰을 삭제하고 세션 쿠키를 지운다(FR-AUTH-009-02-03).
      security:
      - bffClientBasic: []
      - {}
      x-requirements:
      - FR-AUTH-002
      - FR-AUTH-008
      - FR-AUTH-008-01
      - FR-AUTH-008-03
      - FR-AUTH-009-01
      - FR-AUTH-009-02-01
      - FR-AUTH-009-02-02
      - FR-AUTH-009-03
      - FR-AUTH-009-07
      - FR-AUTH-009-07-01
      - FR-OIDC-002
      - FR-OIDC-013
      - FR-OIDC-016
      - FR-APP-004
      - FR-APP-005
      - FR-MFA-003
      - D-03
      - SC-04
      parameters:
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
            examples:
              bffRefresh:
                summary: BFF 서버의 테넌트 토큰 갱신(클라이언트 인증 필수)
                value:
                  refresh_token: prt_server_secret
                  tenant_id: 0193a3c1-7c2e-7d11-9a40-5b1e2f3a4b5c
              nativeRefresh:
                summary: 직접 API 클라이언트 갱신
                value:
                  refresh_token: prt_native_secret
      responses:
        '200':
          description: 발급 성공
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              examples:
                tenantToken:
                  $ref: '#/components/examples/TokenResponseTenant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/RefreshUnauthorized'
          description: Refresh 실패(`refresh_token_invalid`, `refresh_token_reused`, `login_expired`, `token_revoked`) 또는 BFF client 인증 실패(`invalid_client`). 재로그인 필요
        '403':
          $ref: '#/components/responses/TokenForbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/TokenUnavailable'

  /api/v1/auth/logout:
    post:
      operationId: logout
      tags:
      - Auth
      summary: 현재 로그인 로그아웃
      description: |-
        현재 로그인(`sid`)을 종료한다. 연결된 Refresh Token은 폐기하고, Access Token은 모든 audience에 대해 즉시 철회한다.
        - 외부 Provider 로그아웃은 요청하지 않는다(FR-AUTH-009-04).
        - 이미 종료된 로그인이어도 `204`를 반환한다(멱등).
        - SaaS BFF가 호출해도 그 브라우저의 로그인(`sid`) 전체가 끝난다. 같은 로그인에 연결된 Passport 포털과 다른 SaaS의 BFF 세션도 무효가 된다(SSO 단일 로그아웃).
          Passport BFF는 요청마다 `sid` 상태를 확인하고, SaaS BFF는 `verifyAccess` 거부나 갱신 `401`로 이를 알게 되어 자기 세션을 지운다.

        BFF는 Bearer 또는 BFF client 인증과 연결된 refresh_token으로 서버에서 호출한다. Basic 인증 분기는 해당 사용자 로그인에 연결된 유효한 Refresh Token도 반드시 검증한다. 종료 범위의 BFF 세션도 무효화한다. 브라우저 쿠키 삭제는 BFF의 대응 로그아웃 경로가 수행한다.
      security:
      - bearerAuth: []
      - bffClientBasic: []
      x-requirements:
      - FR-AUTH-009-04
      - FR-AUTH-009-06-01
      x-audit-event: auth.logout
      parameters:
      - $ref: '#/components/parameters/RequestId'
      responses:
        '204':
          description: 로그아웃 완료
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: Bearer 인증 실패 또는 BFF client 인증 실패(`invalid_client`)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRefreshRequest'

  /api/v1/auth/logout-all:
    post:
      operationId: logoutAll
      tags:
      - Auth
      summary: 모든 기기에서 로그아웃
      description: |-
        사용자의 모든 Passport 로그인을 종료하고, 모든 Refresh Token 폐기와 Access Token 즉시 철회를 한다.
        Local과 OIDC 로그인을 모두 포함하며, 외부 Provider 로그아웃은 요청하지 않는다(FR-AUTH-009-04).

        BFF는 Bearer 또는 BFF client 인증과 연결된 refresh_token으로 서버에서 호출한다. Basic 인증 분기는 해당 사용자 로그인에 연결된 유효한 Refresh Token도 반드시 검증한다. 종료 범위의 BFF 세션도 무효화한다. 브라우저 쿠키 삭제는 BFF의 대응 로그아웃 경로가 수행한다.
      x-requirements:
      - FR-AUTH-009-04
      - FR-AUTH-009-06-01
      x-audit-event: auth.logout_all
      parameters:
      - $ref: '#/components/parameters/RequestId'
      responses:
        '204':
          description: 전체 로그아웃 완료
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: Bearer 인증 실패 또는 BFF client 인증 실패(`invalid_client`)
      security:
      - bearerAuth: []
      - bffClientBasic: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRefreshRequest'

  /api/v1/auth/reauthentication/password:
    post:
      operationId: reauthenticateWithPassword
      tags: [Auth]
      summary: 비밀번호 재인증
      description: |
        현재 로그인에 Local 재인증 시각을 기록한다. 재인증이 필요한 작업은 이 시각이 5분 이내인지 확인한다(**[제안]**, 5장).
        - 비밀번호가 틀리면 `422 validation_failed`이고 `errors[].field = password`이다.
          `401`을 쓰지 않는 이유는 클라이언트가 로그인 만료로 오인하지 않게 하기 위해서다.
        - Local 비밀번호가 없는 계정은 `409 local_credential_not_set`이다. 이런 계정은 OIDC 재인증(`intent = reauth`)을 쓴다.
        - 실패는 로그인과 같은 실패 제한을 적용한다.
      x-requirements: [FR-MFA-004-01, FR-MFA-004-02, FR-OIDC-005, FR-USER-005]
      x-audit-event: auth.reauthenticated
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordReauthRequest'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/auth/jwks.json:
    get:
      operationId: getJwks
      tags: [Auth]
      summary: Access Token 검증 키(JWKS)
      description: |
        Passport Access Token 서명 검증용 공개 키 집합(RFC 7517)이다. 현재 키, 교체 예정 키, 유예 중인 이전 키를 포함한다.
        이 엔드포인트는 OIDC Discovery 제공을 뜻하지 않는다(2.1 제외 범위).
      security: []
      x-requirements: [FR-AUTH-008, FR-AUTH-008-01, NFR-SEC-002, D-02]
      responses:
        '200':
          description: JWKS
          headers:
            Cache-Control:
              description: '**[제안]** `public, max-age=300`'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Jwks'

  /api/v1/auth/tenants/{tenant_code}/login-options:
    get:
      operationId: getTenantLoginOptions
      tags: [OIDC]
      summary: 테넌트 로그인 진입 정보
      description: |
        테넌트 전용 로그인 링크와 공통 화면의 테넌트 코드 입력(FR-OIDC-011)에서 대상 테넌트를 식별한다.
        테넌트가 없거나 `active`가 아니면 `404`이다.
        OIDC 설정이 없거나 비활성·오류이면 `oidc.available = false`이다. 다른 Provider로 대체하지 않는다(FR-OIDC-014).
      security: []
      x-requirements: [FR-OIDC-011, FR-OIDC-014, FR-WEB-001]
      parameters:
        - $ref: '#/components/parameters/TenantCodePath'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 로그인 진입 정보
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantLoginOptions'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/auth/oidc/{tenant_code}/authorizations:
    post:
      operationId: startOidcAuthorization
      tags:
      - OIDC
      summary: 테넌트 OIDC 인증 시작
      description: |
        대상 테넌트의 활성 OIDC 설정으로 로그인 트랜잭션을 만들고, Provider의 Authorization URL을 반환한다.
        - 트랜잭션은 `state`, `nonce`, PKCE(`S256`) verifier, `tenant_id`, `oidc_config_id`, 설정 버전, `intent`, `return_to`를 묶어 저장한다.
          **[제안]** 유효 10분, 1회용이다(FR-OIDC-007, FR-OIDC-012).
        - `intent = login`은 인증이 필요 없다.
        - `intent = link`, `reauth`는 Bearer 토큰이 필요하며, 트랜잭션을 현재 로그인(`sid`)에 묶는다.
        - `return_to`는 등록된 Passport BFF 완료 URI와 정확히 일치해야 한다. SaaS에는 별도 SSO 코드 흐름으로 이동한다(오픈 리다이렉트 방지).
        - 설정이 없거나 비활성이면 `403 tenant_access_denied(oidc_configuration_unavailable)`이다.
        - 외부 상태를 확인할 수 없으면 `503 idp_status_unavailable`이다.
      security:
      - {}
      - bearerAuth: []
      x-requirements:
      - FR-OIDC-001
      - FR-OIDC-003
      - FR-OIDC-007
      - FR-OIDC-008
      - FR-OIDC-011
      - FR-OIDC-012
      - FR-OIDC-014
      - FR-OIDC-016
      - SC-02
      parameters:
      - $ref: '#/components/parameters/TenantCodePath'
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OidcAuthorizationRequest'
      responses:
        '201':
          description: 트랜잭션 생성. 브라우저를 `authorization_url`로 이동한다.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OidcAuthorization'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/IdpUnavailable'

  /api/v1/auth/oidc/callback/{tenant_id}:
    get:
      operationId: oidcCallback
      tags:
      - OIDC
      summary: 테넌트 OIDC Callback
      description: |
        Provider가 브라우저를 돌려보내는 Redirect URI다. 테넌트 관리자는 이 URI를 IdP 클라이언트에 등록한다(`OidcConfiguration.redirect_uri`).
        테넌트별 경로는 다중 발급자 Mix-Up 방어에 쓴다(RFC 9700).

        **검증**(하나라도 실패하면 로그인을 만들지 않는다)
        1. `state`로 트랜잭션을 찾는다. 1회용이고 만료되지 않았어야 한다. 트랜잭션의 `tenant_id`가 경로와 같아야 한다(FR-OIDC-012).
        2. `iss` 파라미터(RFC 9207)가 있으면 설정의 발급자와 같아야 한다.
        3. 트랜잭션 시점의 설정 버전이 현재와 같고 설정이 `enabled`여야 한다(D-06).
        4. PKCE verifier로 코드를 교환한다. ID Token의 서명(테넌트 설정의 JWKS), `iss`, `aud = client_id`, `nonce`, `exp`, `iat`를 검증한다(FR-OIDC-003).
        5. 외부 Access Token을 쓰는 경우 공통 JWT 검증 엔진에서 테넌트 설정의 용도·audience 규칙으로 검증한다. JWT만 지원한다(FR-OIDC-009-01).

        **처리**: 11장 F-03, F-04와 같다.

        **응답**: 항상 `302`로 트랜잭션의 `return_to`에 이동한다. 결과는 URL 조각(`#`)의 파라미터로 전달한다.

        | `oidc_result` | 추가 파라미터 | 의미 |
        | --- | --- | --- |
        | `logged_in` | `tenant_id` | Passport BFF가 토큰을 서버에 저장하고 세션 쿠키 설정(`intent = login`) |
        | `link_required` | `link_ticket` | 같은 이메일의 기존 계정이 있다. 기존 계정 로그인 후 연결 |
        | `link_ready` | `link_ticket` | 연결 준비 완료(`intent = link`) |
        | `reauthenticated` | | 현재 로그인에 OIDC 재인증 기록(`intent = reauth`) |
        | `error` | `error_code` | 실패. `error_code`: `access_denied`(사용자 취소), `invalid_response`, `membership_required`, `account_inactive`, `identity_already_linked`, `reauthentication_failed`, `oidc_configuration_unavailable`, `idp_status_unavailable`, `oidc_provider_error`, `transaction_expired` |

        트랜잭션을 찾을 수 없어 `return_to`를 알 수 없으면 관리 포털의 기본 오류 화면으로 이동한다.
      security: []
      x-requirements:
      - FR-OIDC-002
      - FR-OIDC-003
      - FR-OIDC-004
      - FR-OIDC-005
      - FR-OIDC-006
      - FR-OIDC-007
      - FR-OIDC-008
      - FR-OIDC-009
      - FR-OIDC-009-01
      - FR-OIDC-012
      - FR-OIDC-013
      - FR-OIDC-014
      - FR-OIDC-016
      - FR-AUTH-008-02
      - FR-AUTH-008-04
      - FR-USER-006
      - FR-MEM-008
      - D-08
      - SC-02
      x-audit-event: auth.oidc_login_succeeded / auth.oidc_login_failed / user.created_from_oidc / membership.auto_provisioned
      parameters:
      - $ref: '#/components/parameters/TenantIdPath'
      - name: state
        in: query
        required: true
        schema:
          type: string
          maxLength: 256
      - name: code
        in: query
        description: 성공 시 Authorization Code
        schema:
          type: string
          maxLength: 2048
      - name: iss
        in: query
        description: RFC 9207 발급자 식별자
        schema:
          type: string
          format: uri
      - name: error
        in: query
        description: Provider 오류 코드(예 `access_denied`)
        schema:
          type: string
          maxLength: 256
      - name: error_description
        in: query
        schema:
          type: string
          maxLength: 1024
      responses:
        '302':
          description: '`return_to`(또는 기본 오류 화면)로 이동'
          headers:
            Location:
              description: '예: `https://passport.example.com/login/callback#oidc_result=logged_in&tenant_id=0193a3c1-7c2e-7d11-9a40-5b1e2f3a4b5c`'
              schema:
                type: string
                format: uri
            Set-Cookie:
              $ref: '#/components/headers/SetBffSessionCookie'

  /api/v1/users/me:
    get:
      operationId: getMe
      tags: [Me]
      summary: 현재 사용자 조회
      description: |
        본인의 모든 프로필 항목과 계정 상태를 반환한다(FR-USER-002-02).
        별도 신원 JWT나 ID Token 대신 이 API로 사용자 정보를 제공한다(FR-AUTH-010).
        기본 토큰과 테넌트 토큰을 모두 받는다.
      x-requirements: [FR-USER-001, FR-USER-002, FR-USER-002-02, FR-USER-004, FR-AUTH-010]
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Activity'
      responses:
        '200':
          description: 현재 사용자
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSelf'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      operationId: updateMe
      tags: [Me]
      summary: 현재 사용자 프로필 수정
      description: |
        표시 이름과 선택 항목(전화번호, 실명)을 수정한다. 선택 항목에 `null`을 보내면 삭제한다.
        이메일 변경은 P0 범위가 아니다. 프로필 사진은 `PUT /users/me/avatar`로 바꾼다.
      x-requirements: [FR-USER-002, FR-USER-002-01, NFR-SEC-006]
      x-audit-event: user.profile_updated
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Activity'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: 수정 결과
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSelf'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'

  /api/v1/users/me/avatar:
    put:
      operationId: uploadMyAvatar
      tags: [Me]
      summary: 프로필 사진 등록·교체
      description: |
        **[제안]** PNG, JPEG, WebP만 받으며 최대 2 MiB다. 서버가 메타데이터를 제거하고 정사각형으로 다시 인코딩한다.
        교체하면 이전 사진은 삭제한다.
      x-requirements: [FR-USER-002]
      x-audit-event: user.avatar_updated
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Activity'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  contentMediaType: application/octet-stream
            encoding:
              file:
                contentType: image/png, image/jpeg, image/webp
      responses:
        '200':
          description: 등록 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvatarResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
    delete:
      operationId: deleteMyAvatar
      tags: [Me]
      summary: 프로필 사진 삭제
      x-requirements: [FR-USER-002]
      x-audit-event: user.avatar_deleted
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Activity'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/avatars/{avatar_id}:
    get:
      operationId: getAvatar
      tags: [Me]
      summary: 프로필 사진 이미지
      description: |
        `<img>` 태그에서 Bearer 헤더를 보낼 수 없으므로 인증 없이 제공한다.
        `avatar_id`는 추측할 수 없는 값이고, 사진을 교체·삭제하거나 탈퇴하면 즉시 무효화된다.
        URL은 열람 권한이 있는 응답(6장)에만 포함된다.
      security: []
      x-requirements: [FR-USER-002, FR-USER-002-02, FR-USER-005]
      parameters:
        - name: avatar_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9_-]{22,64}$'
      responses:
        '200':
          description: 이미지
          headers:
            Cache-Control:
              description: '`private, max-age=3600`'
              schema:
                type: string
          content:
            image/webp:
              schema:
                type: string
                contentMediaType: image/webp
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/users/me/password:
    post:
      operationId: changePassword
      tags:
      - Me
      summary: 비밀번호 변경
      description: |
        현재 비밀번호를 확인하고 새 비밀번호로 바꾼다. 해시는 Argon2id를 쓴다(FR-AUTH-007).
        - 성공하면 현재 로그인을 포함한 모든 로그인을 종료한다. Refresh Token은 폐기하고 Access Token은 즉시 철회한다(FR-AUTH-009-05-01, 009-06-02).
        - 클라이언트는 새 비밀번호로 다시 로그인한다.
        - 현재 비밀번호가 틀리면 `422 validation_failed`이고 `errors[].field = current_password`이다.
        - Local 비밀번호가 없는 계정은 `409 local_credential_not_set`이다.
      x-requirements:
      - FR-AUTH-003
      - FR-AUTH-007
      - FR-AUTH-009-05-01
      - FR-AUTH-009-06-02
      x-audit-event: user.password_changed
      parameters:
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
      responses:
        '204':
          description: 변경 완료. 모든 로그인 종료
          headers: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/users/me/withdrawal:
    post:
      operationId: withdrawMe
      tags:
      - Me
      summary: 계정 탈퇴
      description: |
        최근 재인증이 필요하다(5장). 확정하면 유예기간 없이 즉시 탈퇴하며, 취소와 복구는 없다(FR-USER-005).
        - 계정을 `deleted`로 바꾸고 모든 로그인과 토큰을 종료한다.
        - 인증 수단을 무효화하고 모든 멤버십을 `removed`로 바꾼다. 멤버십 종료는 접근 자격 변경이므로 8장 규약을 따른다.
        - 프로필 사진은 즉시 삭제한다. 이메일·표시 이름·전화번호·실명은 24시간 보관 후 삭제한다.
        - **[제안]** 어떤 테넌트의 마지막 관리자이면 `409 last_tenant_admin`이고, 해당 `tenant_ids`를 함께 반환한다(16장 4번).
      x-requirements:
      - FR-USER-005
      - FR-USER-005-01
      - FR-APP-008-01
      - FR-APP-008-06
      - FR-APP-008-09
      - SC-06
      x-audit-event: user.withdrawn
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WithdrawalRequest'
      responses:
        '204':
          description: 탈퇴 완료
          headers: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ReauthenticationRequired'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/AccessSyncPending'

  /api/v1/users/me/tenants:
    get:
      operationId: listMyTenants
      tags: [Me]
      summary: 소속 테넌트 목록
      description: |
        본인의 멤버십 목록이다(`removed` 제외). `access`는 **현재 로그인** 기준으로 테넌트 토큰을 받을 수 있는지와 그 이유를 알려준다.
        테넌트 선택 화면(FR-WEB-003)에 쓴다. 판정은 안내용이며, 실제 발급 시 다시 검사한다.
        검색 `q`는 테넌트 이름과 코드에 적용한다.
      x-requirements: [FR-MEM-001, FR-MEM-002, FR-WEB-003, FR-OIDC-013, SC-04]
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Activity'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Query'
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, -name, joined_at, -joined_at]
            default: name
      responses:
        '200':
          description: 소속 테넌트 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyTenantPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/users/me/identities:
    get:
      operationId: listMyIdentities
      tags: [Identities]
      summary: 연결된 인증 수단 목록
      description: Local 자격 증명과 외부 신원을 프로필과 분리해 보여준다(FR-USER-007). 외부 신원은 `(issuer, subject)`로 식별한다(FR-OIDC-004).
      x-requirements: [FR-USER-006, FR-USER-007, FR-OIDC-004]
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Activity'
      responses:
        '200':
          description: 인증 수단 목록
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Identity'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: linkIdentity
      tags: [Identities]
      summary: 외부 신원 연결
      description: |
        OIDC 콜백에서 받은 링크 티켓의 외부 신원을 현재 사용자에 연결한다.
        - 기존 계정의 재인증(최근 5분, 로그인 직후 포함)과 `confirm: true`가 모두 필요하다(FR-OIDC-005, D-08).
        - 플랫폼 관리자 승인은 요구하지 않는다.
        - 외부 신원이 이미 다른 사용자에게 연결되어 있으면 `409 identity_already_linked`이고, 기존 연결을 유지한다.
        - 계정 병합과 신원 이전은 제공하지 않는다.
      x-requirements: [FR-OIDC-005, FR-USER-006, D-08, FR-WEB-002]
      x-audit-event: identity.linked
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkIdentityRequest'
      responses:
        '201':
          description: 연결 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identity'
        '400':
          $ref: '#/components/responses/InvalidTokenValue'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ReauthenticationRequired'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/users/me/tenants/{tenant_id}/mfa:
    get:
      operationId: getMyTenantMfa
      tags: [MFA]
      summary: 본인의 테넌트별 MFA 상태
      description: |
        대상 테넌트의 MFA 정책, 본인의 TOTP 등록 여부, 남은 복구 코드 수, 현재 로그인의 충족 상태를 반환한다.
        TOTP는 사용자·테넌트 조합 단위다(FR-MFA-004).
        `active` 멤버십이 없으면 `404`이다.
      x-requirements: [FR-MFA-002, FR-MFA-003, FR-MFA-004, FR-WEB-009]
      parameters:
        - $ref: '#/components/parameters/TenantIdPath'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: MFA 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyTenantMfa'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/users/me/tenants/{tenant_id}/mfa/totp/enrollment:
    post:
      operationId: startTotpEnrollment
      tags: [MFA]
      summary: TOTP 등록 시작
      description: |
        대상 테넌트용 TOTP secret을 만들고 `otpauth://` URI를 반환한다. secret은 이 응답에서만 반환한다(RFC 6238).
        - 확인 전까지는 미확정 상태다. **[제안]** 10분 동안 확인하지 않으면 폐기한다.
        - 이미 등록되어 있으면 `409 totp_already_enrolled`이다.
        - **[제안]** 첫 등록은 현재 로그인만으로 허용하고 등록 사실을 이메일로 알린다(16장 2번).
      x-requirements: [FR-MFA-001, FR-MFA-004, FR-WEB-009]
      x-audit-event: mfa.totp_enrollment_started
      parameters:
        - $ref: '#/components/parameters/TenantIdPath'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '201':
          description: 등록 시작
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpEnrollment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/users/me/tenants/{tenant_id}/mfa/totp/enrollment/confirm:
    post:
      operationId: confirmTotpEnrollment
      tags: [MFA]
      summary: TOTP 등록 확인
      description: |
        앱에 표시된 OTP로 등록을 확정한다.
        - 성공하면 일회용 복구 코드 10개를 **이 응답에서만** 반환한다(FR-MFA-004).
        - 현재 로그인의 해당 테넌트 MFA를 충족 상태로 기록한다.
        - 진행 중인 등록이 없으면 `409 conflict`이다.
      x-requirements: [FR-MFA-001, FR-MFA-004, FR-MFA-005, FR-WEB-009]
      x-audit-event: mfa.totp_enrolled
      parameters:
        - $ref: '#/components/parameters/TenantIdPath'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpCodeRequest'
      responses:
        '200':
          description: 등록 완료
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryCodes'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/InvalidOtp'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/users/me/tenants/{tenant_id}/mfa/verify:
    post:
      operationId: verifyMfa
      tags: [MFA]
      summary: MFA 인증(TOTP)
      description: |
        현재 로그인의 대상 테넌트 MFA를 충족한다. 충족 상태는 그 로그인이 유효한 동안 재사용한다(FR-MFA-003).
        - 이후 `POST /auth/token`으로 테넌트 토큰을 받는다.
        - 같은 시간 스텝의 OTP 재사용과 실패 제한을 적용한다(FR-MFA-005).
        - 다른 테넌트의 TOTP로는 충족할 수 없다.
        - 미등록이면 `409 conflict`이다.
      x-requirements: [FR-MFA-001, FR-MFA-003, FR-MFA-005, SC-07]
      x-audit-event: mfa.verified / mfa.verification_failed
      parameters:
        - $ref: '#/components/parameters/TenantIdPath'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpCodeRequest'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/InvalidOtp'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/users/me/tenants/{tenant_id}/mfa/recovery:
    post:
      operationId: recoverMfaWithCode
      tags: [MFA]
      summary: 복구 코드로 TOTP 재등록 준비
      description: |
        최근 재인증(기존 계정 인증)과 일회용 복구 코드가 모두 필요하다.
        - 성공하면 사용한 코드를 소진하고, 해당 테넌트의 TOTP 등록을 해제한다.
        - 사용자는 이어서 등록 절차(`startTotpEnrollment` → `confirmTotpEnrollment`)로 다시 등록한다(FR-MFA-004).
        - 다른 테넌트의 TOTP와 테넌트 MFA 정책은 바뀌지 않는다.
      x-requirements: [FR-MFA-004, FR-MFA-005, FR-WEB-009]
      x-audit-event: mfa.recovery_code_used
      parameters:
        - $ref: '#/components/parameters/TenantIdPath'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryCodeRequest'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ReauthenticationRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidOtp'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/users/me/tenants/{tenant_id}/mfa/totp/disable:
    post:
      operationId: disableTotp
      tags: [MFA]
      summary: 개인 TOTP 해제
      description: |
        다음 두 가지를 모두 요구한다(FR-MFA-004-01).
        - 로그인 방식과 같은 방식의 최근 재인증: Local은 비밀번호, OIDC는 해당 테넌트 Provider
        - 해당 사용자·테넌트의 현재 OTP

        기존 로그인 상태만으로는 해제할 수 없다. 테넌트 MFA 정책은 바뀌지 않으므로, 정책이 켜져 있으면 다음 접근 때 다시 등록해야 한다.
        재인증 방식이 맞지 않으면 `403 reauthentication_required`이고, `accepted_methods`로 필요한 방식을 알려준다.
      x-requirements: [FR-MFA-004, FR-MFA-004-01, FR-MFA-005]
      x-audit-event: mfa.totp_disabled
      parameters:
        - $ref: '#/components/parameters/TenantIdPath'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpCodeRequest'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ReauthenticationRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/InvalidOtp'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/users/me/tenants/{tenant_id}/mfa/reset-requests:
    post:
      operationId: createMfaResetRequest
      tags: [MFA]
      summary: 관리자 MFA 초기화 요청
      description: |
        OTP와 복구 코드를 모두 분실했을 때 쓴다. 최근 재인증(사용자 계정 재인증)이 필요하다(FR-MFA-004-02).
        - 요청은 해당 테넌트 관리자와 플랫폼 관리자의 승인 대기 목록에 나타난다.
        - **[제안]** 72시간이 지나면 `expired`가 된다.
        - 대기 중인 요청이 이미 있으면 그 요청을 반환한다(`200`).
      x-requirements: [FR-MFA-004, FR-MFA-004-02, FR-WEB-009]
      x-audit-event: mfa.reset_requested
      parameters:
        - $ref: '#/components/parameters/TenantIdPath'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaResetRequestCreate'
      responses:
        '200':
          description: 이미 대기 중인 요청
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaResetRequest'
        '201':
          description: 요청 생성
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaResetRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ReauthenticationRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/tenants:
    post:
      operationId: createTenant
      tags: [Tenants]
      summary: 테넌트 생성
      description: |
        이메일 소유를 확인한 사용자는 플랫폼 관리자 승인 없이 테넌트를 만들 수 있다(FR-TEN-001, D-05). 기본 토큰으로 호출한다.
        - 생성자는 첫 `admin`으로 자동 등록된다. 플랫폼 관리자 권한은 부여하지 않는다(FR-MEM-004).
        - MFA는 비활성, OIDC 소속 부여 방식은 사전 등록으로 시작한다(FR-TEN-008, D-08).
        - OIDC로 생성된 계정은 Provider가 `email_verified = true`로 준 경우에만 이메일 확인 완료로 본다.
        - 코드가 이미 쓰이고 있으면 `409 already_exists`이다.
      x-requirements: [FR-TEN-001, FR-TEN-002, FR-TEN-003, FR-MEM-004, FR-TEN-008, D-05, SC-03]
      x-audit-event: tenant.created
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Activity'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantCreateRequest'
      responses:
        '201':
          description: 생성 완료
          headers:
            Location:
              description: '`/api/v1/tenants/{tenant_id}`'
              schema:
                type: string
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/tenants/{tenant_id}:
    get:
      operationId: getTenant
      tags: [Tenants]
      summary: 테넌트 조회
      description: 테넌트 토큰이 필요하다. 모든 활성 구성원이 조회할 수 있다. `my_role`은 호출자의 역할이다.
      x-requirements: [FR-TEN-001, FR-TEN-003]
      parameters:
        - $ref: '#/components/parameters/TenantIdPath'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Activity'
      responses:
        '200':
          description: 테넌트
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TenantForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateTenant
      tags: [Tenants]
      summary: 테넌트 정보 수정
      description: |
        테넌트 `admin`이 이름을 바꾼다. `code`는 로그인 링크에 쓰이므로 바꿀 수 없다(**[제안]**).
        상태 변경은 플랫폼 관리자의 `adminUpdateTenantStatus`로 한다.
      x-requirements: [FR-TEN-003]
      x-audit-event: tenant.updated
      parameters:
        - $ref: '#/components/parameters/TenantIdPath'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Activity'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantUpdateRequest'
      responses:
        '200':
          description: 수정 결과
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TenantForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'

  /api/v1/tenants/{tenant_id}/mfa-policy:
    get:
      operationId: getTenantMfaPolicy
      tags: [Tenants]
      summary: 테넌트 MFA 정책 조회
      description: 테넌트 `admin` 전용이다. 구성원은 `getMyTenantMfa`로 정책 활성 여부를 본다.
      x-requirements: [FR-TEN-008, FR-MFA-002, FR-WEB-008]
      parameters:
        - $ref: '#/components/parameters/TenantIdPath'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Activity'
      responses:
        '200':
          description: MFA 정책
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantMfaPolicy'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TenantForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: putTenantMfaPolicy
      tags: [Tenants]
      summary: 테넌트 MFA 정책 변경
      description: |
        테넌트 `admin`이 자기 테넌트의 MFA를 켜거나 끈다(FR-TEN-008).
        - 켜면 `enabled_at`을 기록한다. 그 이전에 성립한 로그인은 로그인이 끝날 때까지 유예하고, 새 로그인부터 MFA를 요구한다(FR-MFA-003).
        - 이 테넌트의 변경은 다른 테넌트에 영향을 주지 않는다.
      x-requirements: [FR-TEN-008, FR-MFA-002, FR-MFA-003, FR-MFA-004, FR-WEB-008, SC-07]
      x-audit-event: tenant.mfa_policy_changed
      parameters:
        - $ref: '#/components/parameters/TenantIdPath'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Activity'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantMfaPolicyUpdate'
      responses:
        '200':
          description: 변경 결과
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantMfaPolicy'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TenantForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'

  /api/v1/tenants/{tenant_id}/oidc-configuration:
    get:
      operationId: getTenantOidcConfiguration
      tags: [Tenant OIDC]
      summary: 테넌트 OIDC 설정 조회
      description: |
        테넌트 `admin` 전용이다. `client_secret`은 반환하지 않고 설정 여부(`client_secret_set`)만 반환한다(7장 API 원칙).
        설정이 없으면 `404`이다.
      x-requirements: [FR-OIDC-010, FR-TEN-009, FR-WEB-010]
      parameters:
        - $ref: '#/components/parameters/TenantIdPath'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Activity'
      responses:
        '200':
          description: OIDC 설정
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OidcConfiguration'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TenantForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: putTenantOidcConfiguration
      tags: [Tenant OIDC]
      summary: 테넌트 OIDC 설정 등록·변경·활성화·비활성화
      description: |
        테넌트당 설정은 하나이므로 단일 리소스로 관리한다(FR-OIDC-010). 테넌트 `admin`은 플랫폼 관리자 승인 없이 바꿀 수 있다(FR-TEN-009).
        - 처음 만들 때는 `If-None-Match: *`, 바꿀 때는 `If-Match`를 보낸다.
        - `client_secret`은 쓰기 전용이다.
          - 처음 만들 때와 `issuer`·`client_id`를 바꿀 때는 필수다.
          - 그 외에는 생략하면 기존 값을 유지한다.
        - 저장 전에 `issuer`의 Discovery 문서와 JWKS를 조회해 검증한다.
          발급자가 다르거나 조회에 실패하면 `422 validation_failed`이다(FR-OIDC-006).
        - **신뢰 변경**
          - 대상: `issuer`, `client_id`, `client_secret`, `accepted_acr_values`, `accepted_amr_values` 변경과 `enabled → disabled` 전환
          - 처리: `trust_version`을 올린다. 이 설정에 근거한 이 테넌트의 OIDC 로그인과 Passport Access·Refresh Token을 즉시 무효화한다(D-06).
          - 응답의 `trust_changed`가 `true`가 된다.
          - 그 외 필드(`display_name`, `member_provisioning`) 변경은 기존 로그인을 유지한다.
          - Local 로그인과 다른 테넌트의 로그인은 영향을 받지 않는다.
      x-requirements: [FR-OIDC-001, FR-OIDC-006, FR-OIDC-010, FR-OIDC-014, FR-TEN-009, FR-WEB-010, D-06, D-08]
      x-audit-event: tenant.oidc_configuration_changed
      parameters:
        - $ref: '#/components/parameters/TenantIdPath'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Activity'
        - $ref: '#/components/parameters/IfMatchOptional'
        - $ref: '#/components/parameters/IfNoneMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OidcConfigurationWrite'
      responses:
        '200':
          description: 변경 완료
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OidcConfigurationChangeResult'
        '201':
          description: 생성 완료
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OidcConfigurationChangeResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TenantForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'

  /api/v1/tenants/{tenant_id}/members:
    get:
      operationId: listTenantMembers
      tags: [Members]
      summary: 멤버 목록
      description: |
        보는 사람의 역할에 따라 항목 스키마가 다르다(6장).

        | 보는 사람 | 항목 | 볼 수 있는 상태 | `q` 검색 대상 |
        | --- | --- | --- | --- |
        | `admin` | `MemberAdminView` | 모든 상태 | 이메일, 표시 이름, 실명 |
        | `member` | `MemberPeerView` | `active`만 | 표시 이름 |
      x-requirements: [FR-MEM-003, FR-USER-002-02, FR-WEB-004, NFR-SEC-004]
      parameters:
        - $ref: '#/components/parameters/TenantIdPath'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Activity'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Query'
        - name: role
          in: query
          schema:
            $ref: '#/components/schemas/TenantRole'
        - name: status
          in: query
          description: '`admin`만 사용할 수 있다. 기본은 `removed`를 제외한 전체이다.'
          schema:
            $ref: '#/components/schemas/MembershipStatus'
        - name: sort
          in: query
          schema:
            type: string
            enum: [display_name, -display_name, joined_at, -joined_at]
            default: display_name
      responses:
        '200':
          description: 멤버 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TenantForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    post:
      operationId: addTenantMember
      tags: [Members]
      summary: 멤버 사전 등록(추가)
      description: |
        테넌트 `admin`이 이메일로 멤버를 사전 등록한다(FR-MEM-003, D-08 사전 등록·초대 방식). 응답 상태는 항상 `pre_registered`다.
        계정 존재 여부를 관리자에게 드러내지 않기 위해서다.

        다음 경우에 그 사용자의 멤버십이 `active`가 된다.
        - 확인된 같은 이메일의 사용자가 이 테넌트로 처음 토큰을 요청할 때
        - 이 테넌트의 OIDC로 로그인할 때. 이때는 Provider의 `email_verified = true`인 이메일만 매칭한다.

        초대장 발송·수락·만료(FR-MEM-006)는 P1이다.
        같은 사용자·테넌트에 `removed`가 아닌 멤버십이 있으면 `409 already_exists`이다(FR-MEM-005).
      x-requirements: [FR-MEM-001, FR-MEM-003, FR-MEM-004, FR-MEM-005, FR-WEB-004, D-08]
      x-audit-event: membership.pre_registered
      parameters:
        - $ref: '#/components/parameters/TenantIdPath'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Activity'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberCreateRequest'
      responses:
        '201':
          description: 사전 등록 완료
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberAdminView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TenantForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/tenants/{tenant_id}/members/{membership_id}:
    get:
      operationId: getTenantMember
      tags: [Members]
      summary: 멤버 조회
      description: |
        `admin`은 `MemberAdminView`, `member`는 `active` 멤버의 `MemberPeerView`를 받는다.
        `member`가 볼 수 없는 멤버는 `404`이다.
      x-requirements: [FR-MEM-003, FR-USER-002-02]
      parameters:
        - $ref: '#/components/parameters/TenantIdPath'
        - $ref: '#/components/parameters/MembershipIdPath'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Activity'
      responses:
        '200':
          description: 멤버
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TenantForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateTenantMember
      tags: [Members]
      summary: 멤버 역할·상태 변경
      description: |
        테넌트 `admin`이 역할(`admin`/`member`)과 상태(`active`/`suspended`)를 바꾼다.
        - `suspended`(비활성화)는 접근 자격 변경이다. 8장 규약(`If-Match`, `Idempotency-Key` 필수, `503 access_sync_pending`)을 따른다(FR-APP-008).
        - **[제안]** 마지막 `active` 관리자를 강등하거나 비활성화하면 `409 last_tenant_admin`이다.
        - `removed` 멤버십은 바꿀 수 없다(`409 conflict`). 복구는 P1 재가입 신청·승인으로 한다(FR-MEM-008).
      x-requirements: [FR-MEM-003, FR-MEM-004, FR-APP-008-01, FR-APP-008-05, FR-APP-008-06, FR-APP-008-07, FR-APP-008-09, FR-WEB-004, SC-05]
      x-audit-event: membership.updated
      parameters:
        - $ref: '#/components/parameters/TenantIdPath'
        - $ref: '#/components/parameters/MembershipIdPath'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Activity'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberUpdateRequest'
      responses:
        '200':
          description: 변경 완료(DB 커밋과 Valkey 반영 완료)
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberAdminView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TenantForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '503':
          $ref: '#/components/responses/AccessSyncPending'
    delete:
      operationId: removeTenantMember
      tags: [Members]
      summary: 멤버십 해지
      description: |
        멤버십을 `removed`(해지)로 바꾼다. 감사·재가입 판단을 위해 레코드는 남긴다.
        - 접근 자격 변경이므로 8장 규약을 따른다.
        - 성공 응답 이후 시작된 해당 사용자·테넌트의 신규 요청(Passport, SaaS)은 거부된다(FR-APP-008-01).
        - 사전 등록 멤버십도 같은 방식으로 취소한다.
        - **[제안]** 마지막 `active` 관리자는 해지할 수 없다(`409 last_tenant_admin`).
      x-requirements: [FR-MEM-003, FR-APP-008-01, FR-APP-008-02, FR-APP-008-05, FR-APP-008-06, FR-APP-008-07, FR-APP-008-09, FR-WEB-004, SC-05]
      x-audit-event: membership.removed
      parameters:
        - $ref: '#/components/parameters/TenantIdPath'
        - $ref: '#/components/parameters/MembershipIdPath'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Activity'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      responses:
        '204':
          description: 해지 완료(DB 커밋과 Valkey 반영 완료)
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TenantForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '503':
          $ref: '#/components/responses/AccessSyncPending'

