  /sso/api/v1/auth/oidc/{tenant_code}/authorizations:
    post:
      operationId: ssoStartOidcAuthorization
      tags:
      - SSO
      summary: 'SSO: 테넌트 OIDC 인증 시작'
      description: |
        Passport SSO가 직접 처리하는 OIDC 시작 경로다. 대응하는 공개 /api/v1 시작 경로는 두지 않는다.
        - 자기 Origin·CSRF 헤더를 검증하고 트랜잭션별 256비트 비밀 쿠키를 생성한다.
        - state·nonce·PKCE와 테넌트·설정·신뢰 버전·의도·return_to·쿠키 해시를 서버에 함께 저장한다.
        - intent=login은 로그인 세션이 필요 없다. link/reauth는 유효한 SSO 세션을 트랜잭션에 묶는다.
        - return_to는 등록된 포털 완료 URI와 정확히 일치해야 한다. 외부 상태 확인 불가는 503이다.
        - 비밀 쿠키는 JSON·URL에 반환하지 않으며 콜백에서 소비 전에 대조한다. 속성은 2장을 따른다.
      security:
      - csrfHeader: []
      - ssoSessionCookie: []
        csrfHeader: []
      x-requirements:
      - FR-OIDC-001
      - FR-OIDC-003
      - FR-OIDC-007
      - FR-OIDC-008
      - FR-OIDC-011
      - FR-OIDC-012
      - FR-OIDC-014
      - FR-OIDC-016
      - SC-02
      - FR-AUTH-009-02-01
      - FR-AUTH-009-02-04
      responses:
        '201':
          description: 트랜잭션 생성. 브라우저를 `authorization_url`로 이동한다.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/OidcBrowserBindingCookie'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OidcAuthorization'
        '401':
          $ref: '#/components/responses/SsoUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/IdpUnavailable'
      parameters:
      - $ref: '#/components/parameters/TenantCodePath'
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OidcAuthorizationRequest'

