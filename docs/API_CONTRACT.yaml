        user_id: 0193a3b0-aaaa-7bbb-8ccc-0d0e0f101112
        tenant_id: 0193a3c1-7c2e-7d11-9a40-5b1e2f3a4b5c
        verified_at: '2026-10-31T09:12:03Z'

  schemas:
    # ---------- 공통 값 ----------
    Uuid:
      type: string
      format: uuid
      examples: [0193a3c1-7c2e-7d11-9a40-5b1e2f3a4b5c]
    Timestamp:
      type: string
      format: date-time
      examples: ['2026-10-31T09:00:00Z']
    Email:
      type: string
      format: email
      maxLength: 254
      description: 비교·유일성 판단은 소문자 정규화 후 수행한다.
      examples: [kim@acme.example]
    Password:
      type: string
      minLength: 12
      maxLength: 128
      writeOnly: true
      description: '**[제안]** 12~128자, 조합 규칙 없음, 이메일과 같은 값 금지.'
    DisplayName:
      type: string
      minLength: 1
      maxLength: 50
      description: 앞뒤 공백 제거 후 1~50자, 제어 문자 금지. 실명일 필요 없음(FR-USER-002).
      examples: [Kim]
    Phone:
      type: string
      pattern: '^\+[1-9][0-9]{6,14}$'
      description: E.164 형식
      examples: ['+821012345678']
    RealName:
      type: string
      minLength: 1
      maxLength: 100
      examples: [김하늘]
    TenantCode:
      type: string
      minLength: 3
      maxLength: 32
      pattern: '^[a-z0-9](?:[a-z0-9-]{1,30}[a-z0-9])$'
      description: '**[제안]** 소문자·숫자·하이픈. 로그인 링크·코드 입력용. 생성 후 변경 불가.'
      examples: [acme]
    TenantName:
      type: string
      minLength: 1
      maxLength: 100
      examples: [ACME Research]
    ApplicationCode:
      type: string
      minLength: 3
      maxLength: 32
      pattern: '^[a-z][a-z0-9-]{1,30}[a-z0-9]$'
      not:
        const: passport
      description: Access Token `aud`와 서비스 `client_id`로 쓴다. `passport`는 예약어.
      examples: [papyrus]
    Audience:
      type: string
      minLength: 3
      maxLength: 32
      pattern: '^[a-z][a-z0-9-]{1,30}[a-z0-9]$'
      description: '`passport` 또는 Application `code`'
      examples: [passport, papyrus]
    Reason:
      type: string
      minLength: 1
      maxLength: 500
    OtpCode:
      type: string
      pattern: '^[0-9]{6}$'
      writeOnly: true
      examples: ['492039']
    IdempotencyKey:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[A-Za-z0-9._:-]+$'
      examples: [5f0c2a8e-2d0b-4b6f-9a51-7f1c3c9d2e44]
    NextCursor:
      type: [string, 'null']
      description: 다음 페이지 커서. 마지막 페이지면 `null`.
    AcceptedResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: accepted

    # ---------- 오류 ----------
    ErrorCode:
      type: string
      enum:
      - invalid_request
      - invalid_token_value
      - invalid_grant
      - idempotency_key_required
      - unauthenticated
      - invalid_token
      - token_revoked
      - login_expired
      - invalid_credentials
      - refresh_token_invalid
      - refresh_token_reused
      - invalid_client
      - forbidden
      - email_verification_required
      - account_inactive
      - tenant_access_denied
      - tenant_context_mismatch
      - mfa_required
      - reauthentication_required
      - self_action_forbidden
      - not_found
      - conflict
      - already_exists
      - identity_already_linked
      - last_tenant_admin
      - totp_already_enrolled
      - local_credential_not_set
      - precondition_failed
      - payload_too_large
      - unsupported_media_type
      - validation_failed
      - invalid_otp
      - idempotency_key_reused
      - precondition_required
      - too_many_requests
      - access_sync_pending
      - entitlement_unverifiable
      - idp_status_unavailable
      - oidc_provider_error

    TenantAccessDeniedReason:
      type: string
      enum: [not_a_member, membership_inactive, tenant_inactive, application_not_enabled, oidc_login_required, oidc_configuration_unavailable]
    SsoAuthorizationError:
      type: string
      description: '`bffAuthorizeSso`가 SaaS BFF callback으로 돌려보내는 오류'
      enum: [invalid_request, access_denied, tenant_access_denied, no_eligible_tenant, temporarily_unavailable, server_error]
    Problem:
      type: object
      description: RFC 9457 Problem Details. 아래 확장 필드는 해당 `code`에서만 나타난다.
      required: [type, title, status, code, request_id]
      properties:
        type:
          type: string
          description: '`urn:passport:problem:{code}`'
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          $ref: '#/components/schemas/ErrorCode'
        request_id:
          type: string
        errors:
          type: array
          description: '`validation_failed`의 필드별 오류'
          items:
            $ref: '#/components/schemas/FieldError'
        reason:
          $ref: '#/components/schemas/TenantAccessDeniedReason'
        mfa:
          $ref: '#/components/schemas/MfaRequirement'
        accepted_methods:
          type: array
          description: '`reauthentication_required`에서 인정하는 재인증 방식'
          items:
            type: string
            enum: [password, oidc]
        db_committed:
          type: boolean
          description: '`access_sync_pending`에서 항상 `true`'
        cache_synced:
          type: boolean
          description: '`access_sync_pending`에서 항상 `false`'
        tenant_ids:
          type: array
          description: '`last_tenant_admin`의 대상 테넌트'
          items:
            $ref: '#/components/schemas/Uuid'
    FieldError:
      type: object
      required: [field, code]
      properties:
        field:
          type: string
          description: 점 표기 경로(예 `bff_redirect_uris.0`)
        code:
          type: string
          description: '`required`, `too_short`, `too_long`, `invalid_format`, `mismatch`, `not_allowed` 등'
        message:
          type: string
    MfaRequirement:
      type: object
      required: [tenant_id, enrolled, methods]
      properties:
        tenant_id:
          $ref: '#/components/schemas/Uuid'
        enrolled:
          type: boolean
          description: '`false`면 TOTP 등록부터 진행'
        methods:
          type: array
          items:
            type: string
            enum: [totp]

    # ---------- 인증 ----------
    ClientType:
      type: string
      enum:
      - web
      - native
      description: '`web`은 BFF 서버 측 토큰 보관(8시간·미사용 30분), `native`는 직접 토큰 사용(7일·미사용 3일)'

    SignupRequest:
      type: object
      additionalProperties: false
      required: [email, password, display_name]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          $ref: '#/components/schemas/Password'
        display_name:
          $ref: '#/components/schemas/DisplayName'
      examples:
        - email: kim@acme.example
          password: correct-horse-battery-staple
          display_name: Kim
    EmailVerificationConfirmRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          minLength: 16
          maxLength: 256
          writeOnly: true
    EmailVerificationResendRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          $ref: '#/components/schemas/Email'
    LocalLoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
          description: 로그인에서는 정책 길이를 검사하지 않는다(기존 비밀번호 호환).
        client_type:
          $ref: '#/components/schemas/ClientType'
      examples:
        - email: kim@acme.example
          password: correct-horse-battery-staple
          client_type: web
    TokenRequest:
      type: object
      additionalProperties: false
      properties:
        refresh_token:
          type: string
          maxLength: 512
          writeOnly: true
          description: BFF 서버 또는 직접 클라이언트의 Refresh Token. 브라우저 쿠키로 받지 않는다. web 로그인의 경우 BFF client 인증·연결 검증이 필수다.
        audience:
          $ref: '#/components/schemas/Audience'
        tenant_id:
          $ref: '#/components/schemas/Uuid'
      description: '`audience` 기본값은 `passport`. `passport`가 아닌 `audience`는 `tenant_id`가 필수다.'
      required:
      - refresh_token

    LoginInfo:
      type: object
      required: [login_id, auth_method, client_type, authenticated_at, expires_at, idle_expires_at]
      properties:
        login_id:
          $ref: '#/components/schemas/Uuid'
        auth_method:
          type: string
          enum: [local, oidc]
        client_type:
          $ref: '#/components/schemas/ClientType'
        authenticated_at:
          $ref: '#/components/schemas/Timestamp'
        expires_at:
          $ref: '#/components/schemas/Timestamp'
        idle_expires_at:
          $ref: '#/components/schemas/Timestamp'
        oidc_tenant_id:
          type: [string, 'null']
          format: uuid
          description: OIDC 로그인의 대상 테넌트
    TokenResponse:
      type: object
      required:
      - access_token
      - token_type
      - expires_in
      - audience
      - tenant_id
      - login
      - refresh_token
      properties:
        access_token:
          type: string
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
          const: 1800
        audience:
          $ref: '#/components/schemas/Audience'
        tenant_id:
          type:
          - string
          - 'null'
          format: uuid
        refresh_token:
          type: string
          description: BFF 서버 또는 직접 API 클라이언트에만 반환한다. 브라우저 BFF 응답에 포함하지 않는다.
        login:
          $ref: '#/components/schemas/LoginInfo'

    PasswordReauthRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
    Jwk:
      type: object
      required: [kty, kid, use, alg]
      properties:
        kty:
          type: string
          examples: [EC]
        kid:
          type: string
        use:
          type: string
          const: sig
        alg:
          type: string
          examples: [ES256]
        crv:
          type: string
        x:
          type: string
        y:
          type: string
        n:
          type: string
        e:
          type: string
    Jwks:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            $ref: '#/components/schemas/Jwk'
      examples:
        - keys:
            - kty: EC
              kid: '2026-10'
              use: sig
              alg: ES256
              crv: P-256
              x: f83OJ3D2xF1Bg8vub9tLe1gHMzV76e8Tus9uPHvRVEU
              y: x_FEzRu9m36HLN_tue659LNpXW6pCyStikYjKIWI5a0

    # ---------- OIDC ----------
    TenantLoginOptions:
      type: object
      required: [tenant_id, tenant_code, tenant_name, oidc]
      properties:
        tenant_id:
          $ref: '#/components/schemas/Uuid'
        tenant_code:
          $ref: '#/components/schemas/TenantCode'
        tenant_name:
          $ref: '#/components/schemas/TenantName'
        oidc:
          type: object
          required: [available]
          properties:
            available:
              type: boolean
            provider_display_name:
              type: [string, 'null']
              examples: [ACME SSO]
    OidcAuthorizationRequest:
      type: object
      additionalProperties: false
      required:
      - intent
      - return_to
      properties:
        intent:
          type: string
          enum:
          - login
          - link
          - reauth
        return_to:
          type: string
          format: uri
          maxLength: 2048
          description: 등록된 Passport BFF 완료 URI와 정확히 일치해야 한다. SaaS의 임의 URL로 외부 인증 결과·링크 티켓을 전달하지 않는다.
        client_type:
          type: string
          const: web
          description: P0의 OIDC는 웹만 지원
      examples:
      - intent: login
        return_to: https://passport.example.com/login/callback
        client_type: web

    OidcAuthorization:
      type: object
      required: [authorization_url, expires_at]
      properties:
        authorization_url:
          type: string
          format: uri
          examples: ['https://idp.acme.example/realms/acme/protocol/openid-connect/auth?response_type=code&client_id=passport&redirect_uri=https%3A%2F%2Fpassport.example.com%2Fapi%2Fv1%2Fauth%2Foidc%2Fcallback%2F0193a3c1-7c2e-7d11-9a40-5b1e2f3a4b5c&scope=openid%20email%20profile&state=st_x&nonce=n_y&code_challenge=cc_z&code_challenge_method=S256']
        expires_at:
          $ref: '#/components/schemas/Timestamp'

    # ---------- 사용자 ----------
    UserStatus:
      type: string
      enum: [pending_verification, active, suspended, deactivated, deleted]
    UserSelf:
      type: object
      required: [user_id, status, email, email_verified, display_name, avatar_url, phone, real_name, platform_roles, created_at]
      properties:
        user_id:
          $ref: '#/components/schemas/Uuid'
        status:
          $ref: '#/components/schemas/UserStatus'
        email:
          $ref: '#/components/schemas/Email'
        email_verified:
          type: boolean
        display_name:
          $ref: '#/components/schemas/DisplayName'
        avatar_url:
          type: [string, 'null']
          format: uri
        phone:
          type: [string, 'null']
          pattern: '^\+[1-9][0-9]{6,14}$'
        real_name:
          type: [string, 'null']
          maxLength: 100
        platform_roles:
          type: array
          items:
            type: string
            enum: [platform_admin]
        created_at:
          $ref: '#/components/schemas/Timestamp'
      examples:
        - user_id: 0193a3b0-aaaa-7bbb-8ccc-0d0e0f101112
          status: active
          email: kim@acme.example
          email_verified: true
          display_name: Kim
          avatar_url: https://passport.example.com/api/v1/avatars/Zx8kQ2pL0aN5vR7tY3uW1e
          phone: '+821012345678'
          real_name: 김하늘
          platform_roles: []
          created_at: '2026-10-01T02:00:00Z'
    UserUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        display_name:
          $ref: '#/components/schemas/DisplayName'
        phone:
          type: [string, 'null']
          pattern: '^\+[1-9][0-9]{6,14}$'
        real_name:
          type: [string, 'null']
          minLength: 1
          maxLength: 100
      examples:
        - display_name: Haneul
          phone: null
    AvatarResponse:
      type: object
      required: [avatar_url]
      properties:
        avatar_url:
          type: string
          format: uri
    PasswordChangeRequest:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
        new_password:
          $ref: '#/components/schemas/Password'
    WithdrawalRequest:
      type: object
      additionalProperties: false
      required: [confirm]
      properties:
        confirm:
          type: boolean
          const: true
          description: 탈퇴 확정 의사. 취소·복구 불가 안내 후 받는다.
    TenantAccess:
      type: object
      required: [status, mfa_enabled]
      description: 현재 로그인 기준 안내용 판정
      properties:
        status:
          type: string
          enum: [allowed, mfa_required, mfa_enrollment_required, oidc_login_required, tenant_inactive, membership_inactive]
        mfa_enabled:
          type: boolean
    MyTenant:
      type: object
      required: [tenant_id, code, name, tenant_status, membership_id, role, membership_status, access]
      properties:
        tenant_id:
          $ref: '#/components/schemas/Uuid'
        code:
          $ref: '#/components/schemas/TenantCode'
        name:
          $ref: '#/components/schemas/TenantName'
        tenant_status:
          $ref: '#/components/schemas/TenantStatus'
        membership_id:
          $ref: '#/components/schemas/Uuid'
        role:
          $ref: '#/components/schemas/TenantRole'
        membership_status:
          $ref: '#/components/schemas/MembershipStatus'
        joined_at:
          type: [string, 'null']
          format: date-time
        access:
          $ref: '#/components/schemas/TenantAccess'
    MyTenantPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MyTenant'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
      examples:
        - items:
            - tenant_id: 0193a3c1-7c2e-7d11-9a40-5b1e2f3a4b5c
              code: acme
              name: ACME Research
              tenant_status: active
              membership_id: 0193a3c5-4444-7aaa-8bbb-0c0d0e0f1011
              role: admin
              membership_status: active
              joined_at: '2026-10-02T00:00:00Z'
              access:
                status: mfa_required
                mfa_enabled: true
          next_cursor: null

    # ---------- 인증 수단 ----------
    Identity:
      type: object
      required: [identity_id, type, linked_at]
      properties:
        identity_id:
          $ref: '#/components/schemas/Uuid'
        type:
          type: string
          enum: [local, oidc]
        email:
          type: [string, 'null']
          description: '`local`의 로그인 이메일'
        tenant_id:
          type: [string, 'null']
          format: uuid
          description: '`oidc`가 연결된 테넌트 OIDC 설정의 테넌트'
        oidc_config_id:
          type: [string, 'null']
          format: uuid
        issuer:
          type: [string, 'null']
          format: uri
        subject:
          type: [string, 'null']
          maxLength: 255
        provider_display_name:
          type: [string, 'null']
        linked_at:
          $ref: '#/components/schemas/Timestamp'
        last_used_at:
          type: [string, 'null']
          format: date-time
    LinkIdentityRequest:
      type: object
      additionalProperties: false
      required: [link_ticket, confirm]
      properties:
        link_ticket:
          type: string
          minLength: 16
          maxLength: 256
          writeOnly: true
        confirm:
          type: boolean
          const: true

    # ---------- MFA ----------
    MyTenantMfa:
      type: object
      required: [tenant_id, tenant_mfa_enabled, totp_enrolled, recovery_codes_remaining, current_login]
      properties:
        tenant_id:
          $ref: '#/components/schemas/Uuid'
        tenant_mfa_enabled:
          type: boolean
        totp_enrolled:
          type: boolean
        totp_enrolled_at:
          type: [string, 'null']
          format: date-time
        recovery_codes_remaining:
          type: integer
          minimum: 0
          maximum: 10
        current_login:
          type: object
          required: [status]
          properties:
            status:
              type: string
              enum: [not_required, grace, satisfied_totp, satisfied_external, required]
        pending_reset_request_id:
          type: [string, 'null']
          format: uuid
    TotpEnrollment:
      type: object
      required: [secret, otpauth_uri, algorithm, digits, period, expires_at]
      properties:
        secret:
          type: string
          pattern: '^[A-Z2-7]{32}$'
          description: Base32 secret(160비트)
        otpauth_uri:
          type: string
          examples: ['otpauth://totp/Passport:kim@acme.example?secret=JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP&issuer=Passport%20(acme)&algorithm=SHA1&digits=6&period=30']
        algorithm:
          type: string
          const: SHA1
        digits:
          type: integer
          const: 6
        period:
          type: integer
          const: 30
        expires_at:
          $ref: '#/components/schemas/Timestamp'
    OtpCodeRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          $ref: '#/components/schemas/OtpCode'
    RecoveryCodes:
      type: object
      required: [recovery_codes, generated_at]
      properties:
        recovery_codes:
          type: array
          minItems: 10
          maxItems: 10
          items:
            type: string
            pattern: '^[A-Z2-7]{4}-[A-Z2-7]{4}-[A-Z2-7]{4}$'
        generated_at:
          $ref: '#/components/schemas/Timestamp'
    RecoveryCodeRequest:
      type: object
      additionalProperties: false
      required: [recovery_code]
      properties:
        recovery_code:
          type: string
          pattern: '^[A-Za-z2-7]{4}-?[A-Za-z2-7]{4}-?[A-Za-z2-7]{4}$'
          writeOnly: true
    MfaResetRequestStatus:
      type: string
      enum: [pending, approved, rejected, expired]
    MfaResetRequestCreate:
      type: object
      additionalProperties: false
      properties:
        note:
          type: string
          maxLength: 500
          description: 관리자에게 보여줄 메모(연락 가능 시간 등)
    MfaResetRequest:
      type: object
      required: [request_id, tenant_id, user_id, user_email, user_display_name, status, created_at, expires_at]
      properties:
        request_id:
          $ref: '#/components/schemas/Uuid'
        tenant_id:
          $ref: '#/components/schemas/Uuid'
        user_id:
          $ref: '#/components/schemas/Uuid'
        user_email:
          $ref: '#/components/schemas/Email'
        user_display_name:
          $ref: '#/components/schemas/DisplayName'
        status:
          $ref: '#/components/schemas/MfaResetRequestStatus'
        note:
          type: [string, 'null']
        created_at:
          $ref: '#/components/schemas/Timestamp'
        expires_at:
          $ref: '#/components/schemas/Timestamp'
        decided_at:
          type: [string, 'null']
          format: date-time
        decided_by:
          type: [string, 'null']
          format: uuid
        verification_method:
          type: [string, 'null']
          enum: [organization_contact, in_person, other, null]
        decision_reason:
          type: [string, 'null']
    MfaResetRequestPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MfaResetRequest'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
    MfaResetApproval:
      type: object
      additionalProperties: false
      required: [verification_method, verification_note, reason]
      properties:
        verification_method:
          type: string
          enum: [organization_contact, in_person, other]
          description: 관리자 별도 본인 확인 방식(FR-MFA-004-02)
        verification_note:
          type: string
          minLength: 1
          maxLength: 500
          description: 확인 경로·내용. 민감 개인정보를 적지 않는다.
        reason:
          $ref: '#/components/schemas/Reason'
      examples:
        - verification_method: organization_contact
          verification_note: 인사팀 등록 번호로 전화 확인(2026-10-31 10:05)
          reason: 휴대폰 분실로 인한 TOTP 재등록
    MfaResetRejection:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          $ref: '#/components/schemas/Reason'

    # ---------- 테넌트 ----------
    TenantStatus:
      type: string
      enum: [active, suspended, deactivated]
    TenantRole:
      type: string
      enum: [admin, member]
    TenantCreateRequest:
      type: object
      additionalProperties: false
      required: [code, name]
      properties:
        code:
          $ref: '#/components/schemas/TenantCode'
        name:
          $ref: '#/components/schemas/TenantName'
      examples:
        - code: acme
          name: ACME Research
    TenantUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          $ref: '#/components/schemas/TenantName'
    Tenant:
      type: object
      required: [tenant_id, code, name, status, mfa_enabled, created_at, updated_at]
      properties:
        tenant_id:
          $ref: '#/components/schemas/Uuid'
        code:
          $ref: '#/components/schemas/TenantCode'
        name:
          $ref: '#/components/schemas/TenantName'
        status:
          $ref: '#/components/schemas/TenantStatus'
        mfa_enabled:
          type: boolean
        my_role:
          description: 호출자의 역할. 플랫폼 관리자 API에서는 `null`.
          anyOf:
            - $ref: '#/components/schemas/TenantRole'
            - type: 'null'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
      examples:
        - tenant_id: 0193a3c1-7c2e-7d11-9a40-5b1e2f3a4b5c
          code: acme
          name: ACME Research
          status: active
          mfa_enabled: false
          my_role: admin
          created_at: '2026-10-02T00:00:00Z'
          updated_at: '2026-10-02T00:00:00Z'
    TenantPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Tenant'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
    TenantStatusUpdate:
      type: object
      additionalProperties: false
      required: [status, reason]
      properties:
        status:
          $ref: '#/components/schemas/TenantStatus'
        reason:
          $ref: '#/components/schemas/Reason'
    TenantMfaPolicy:
      type: object
      required: [tenant_id, enabled, enabled_at, updated_at]
      properties:
        tenant_id:
          $ref: '#/components/schemas/Uuid'
        enabled:
          type: boolean
        enabled_at:
          type: [string, 'null']
          format: date-time
          description: 마지막 활성화 시각. 이전에 성립한 로그인은 유예한다.
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    TenantMfaPolicyUpdate:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled:
          type: boolean

    # ---------- 테넌트 OIDC ----------
    OidcProviderType:
      type: string
      enum: [keycloak, auth0]
      description: 초기 연동·검증 대상(FR-OIDC-001)
    MemberProvisioning:
      type: string
      enum: [pre_registration, auto]
      description: OIDC 최초 인증 사용자의 소속 부여 방식. 기본 `pre_registration`(D-08)
    OidcConfigurationWrite:
      type: object
      additionalProperties: false
      required: [provider_type, display_name, issuer, client_id, member_provisioning, status]
      properties:
        provider_type:
          $ref: '#/components/schemas/OidcProviderType'
        display_name:
          type: string
          minLength: 1
          maxLength: 100
        issuer:
          type: string
          format: uri
          maxLength: 2048
          pattern: '^https://'
        client_id:
          type: string
          minLength: 1
          maxLength: 255
        client_secret:
          type: string
          minLength: 1
          maxLength: 1024
          writeOnly: true
          description: 생성과 `issuer`·`client_id` 변경 시 필수. 생략하면 기존 값 유지
        scopes:
          type: array
          maxItems: 20
          items:
            type: string
            pattern: '^[\x21\x23-\x5B\x5D-\x7E]+$'
          description: '`openid` 필수. 기본 `[openid, email, profile]`'
        member_provisioning:
          $ref: '#/components/schemas/MemberProvisioning'
        accepted_acr_values:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 255
          description: '**[제안]** 외부 MFA 인정 규칙. ID Token `acr`이 이 중 하나면 Passport TOTP 생략'
        accepted_amr_values:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 64
          description: '**[제안]** ID Token `amr`에 이 중 하나가 있으면 Passport TOTP 생략'
        status:
          type: string
          enum: [enabled, disabled]
      examples:
        - provider_type: keycloak
          display_name: ACME SSO
          issuer: https://idp.acme.example/realms/acme
          client_id: passport
          client_secret: s3cr3t-from-keycloak
          scopes: [openid, email, profile]
          member_provisioning: pre_registration
          accepted_acr_values: []
          accepted_amr_values: [otp]
          status: enabled
    OidcConfiguration:
      type: object
      required: [oidc_config_id, tenant_id, provider_type, display_name, issuer, client_id, client_secret_set, scopes, member_provisioning, accepted_acr_values, accepted_amr_values, status, redirect_uri, trust_version, last_validation, created_at, updated_at]
      properties:
        oidc_config_id:
          $ref: '#/components/schemas/Uuid'
        tenant_id:
          $ref: '#/components/schemas/Uuid'
        provider_type:
          $ref: '#/components/schemas/OidcProviderType'
        display_name:
          type: string
        issuer:
          type: string
          format: uri
        client_id:
          type: string
        client_secret_set:
          type: boolean
        scopes:
          type: array
          items:
            type: string
        member_provisioning:
          $ref: '#/components/schemas/MemberProvisioning'
        accepted_acr_values:
          type: array
          items:
            type: string
        accepted_amr_values:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [enabled, disabled]
        redirect_uri:
          type: string
          format: uri
          readOnly: true
          description: IdP 클라이언트에 등록할 Redirect URI(`/api/v1/auth/oidc/callback/{tenant_id}`)
        trust_version:
          type: integer
          minimum: 1
          description: 신뢰 변경마다 증가. 이 값이 바뀌면 기존 OIDC 로그인 무효
        last_validation:
          type: object
          required: [status, checked_at]
          properties:
            status:
              type: string
              enum: [ok, failed]
            checked_at:
              $ref: '#/components/schemas/Timestamp'
            error_code:
              type: [string, 'null']
              enum: [discovery_unreachable, issuer_mismatch, jwks_unreachable, invalid_client, null]
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    OidcConfigurationChangeResult:
      allOf:
        - $ref: '#/components/schemas/OidcConfiguration'
        - type: object
          required: [trust_changed]
          properties:
            trust_changed:
              type: boolean
              description: '`true`면 이 설정에 근거한 기존 OIDC 로그인과 토큰이 무효화되었다.'

    # ---------- 멤버 ----------
    MembershipStatus:
      type: string
      enum: [pre_registered, active, suspended, removed]
    MemberCreateRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        role:
          $ref: '#/components/schemas/TenantRole'
      examples:
        - email: lee@acme.example
          role: member
    MemberUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        role:
          $ref: '#/components/schemas/TenantRole'
        status:
          type: string
          enum: [active, suspended]
    MemberAdminView:
      type: object
      required: [view, membership_id, user_id, role, status, email, display_name, avatar_url, phone, real_name, mfa_totp_enrolled, joined_at, created_at, updated_at, etag]
      properties:
        view:
          type: string
          const: admin
        membership_id:
          $ref: '#/components/schemas/Uuid'
        user_id:
          type: [string, 'null']
          format: uuid
          description: '`pre_registered`면 `null`'
        role:
          $ref: '#/components/schemas/TenantRole'
        status:
          $ref: '#/components/schemas/MembershipStatus'
        email:
          $ref: '#/components/schemas/Email'
        display_name:
          type: [string, 'null']
        avatar_url:
          type: [string, 'null']
          format: uri
        phone:
          type: [string, 'null']
        real_name:
          type: [string, 'null']
        mfa_totp_enrolled:
          type: boolean
          description: 이 테넌트의 TOTP 등록 여부
        joined_at:
          type: [string, 'null']
          format: date-time
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
        etag:
          type: string
          description: 목록에서 바로 변경할 때 `If-Match`에 쓴다
      examples:
        - view: admin
          membership_id: 0193a3c5-4444-7aaa-8bbb-0c0d0e0f1011
          user_id: 0193a3b0-aaaa-7bbb-8ccc-0d0e0f101112
          role: member
          status: active
          email: kim@acme.example
          display_name: Kim
          avatar_url: null
          phone: '+821012345678'
          real_name: 김하늘
          mfa_totp_enrolled: true
          joined_at: '2026-10-02T00:00:00Z'
          created_at: '2026-10-01T00:00:00Z'
          updated_at: '2026-10-02T00:00:00Z'
          etag: '"3"'
    MemberPeerView:
      type: object
      required: [view, membership_id, user_id, role, display_name, avatar_url]
      properties:
        view:
          type: string
          const: peer
        membership_id:
          $ref: '#/components/schemas/Uuid'
        user_id:
          $ref: '#/components/schemas/Uuid'
        role:
          $ref: '#/components/schemas/TenantRole'
        display_name:
          $ref: '#/components/schemas/DisplayName'
        avatar_url:
          type: [string, 'null']
          format: uri
    MemberView:
      oneOf:
        - $ref: '#/components/schemas/MemberAdminView'
        - $ref: '#/components/schemas/MemberPeerView'
      discriminator:
        propertyName: view
        mapping:
          admin: '#/components/schemas/MemberAdminView'
          peer: '#/components/schemas/MemberPeerView'
    MemberPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MemberView'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'

    # ---------- 탈퇴 보관 정보 ----------
    WithdrawnUser:
      type: object
      required: [user_id, withdrawn_at, retention_expires_at]
      properties:
        user_id:
          $ref: '#/components/schemas/Uuid'
        withdrawn_at:
          $ref: '#/components/schemas/Timestamp'
        retention_expires_at:
          $ref: '#/components/schemas/Timestamp'
    WithdrawnUserPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WithdrawnUser'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
    RetainedProfileAccessRequest:
      type: object
      additionalProperties: false
      required: [purpose, reason]
      properties:
        purpose:
          type: string
          enum: [customer_inquiry, dispute_resolution, security_incident, fraud_investigation]
          description: FR-USER-005-01의 허용 목적
        reason:
          type: string
          minLength: 10
          maxLength: 500
      examples:
        - purpose: customer_inquiry
          reason: 탈퇴 직후 결제 환불 문의(티켓 CS-2026-1031-07)
    RetainedProfile:
      type: object
      required: [user_id, email, display_name, phone, real_name, withdrawn_at, retention_expires_at]
      properties:
        user_id:
          $ref: '#/components/schemas/Uuid'
        email:
          $ref: '#/components/schemas/Email'
        display_name:
          $ref: '#/components/schemas/DisplayName'
        phone:
          type: [string, 'null']
        real_name:
          type: [string, 'null']
        withdrawn_at:
          $ref: '#/components/schemas/Timestamp'
        retention_expires_at:
          $ref: '#/components/schemas/Timestamp'

    # ---------- 테넌트 서비스 ----------
    TenantApplicationListStatus:
      type: string
      enum: [active, inactive, not_enabled]
    TenantApplicationWrite:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [active, inactive]
    TenantApplication:
      type: object
      required: [tenant_id, application_id, code, name, status, updated_at, etag]
      properties:
        tenant_id:
          $ref: '#/components/schemas/Uuid'
        application_id:
          $ref: '#/components/schemas/Uuid'
        code:
          $ref: '#/components/schemas/ApplicationCode'
        name:
          type: string
        status:
          $ref: '#/components/schemas/TenantApplicationListStatus'
        updated_at:
          type: [string, 'null']
          format: date-time
        etag:
          type: [string, 'null']
          description: '`not_enabled`면 `null`(처음 활성화는 `If-None-Match: *`)'
      examples:
        - tenant_id: 0193a3c1-7c2e-7d11-9a40-5b1e2f3a4b5c
          application_id: 0193a3a0-9999-7aaa-8bbb-0c0d0e0f1011
          code: papyrus
          name: Papyrus
          status: active
          updated_at: '2026-10-03T00:00:00Z'
          etag: '"2"'
    TenantApplicationPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TenantApplication'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'

    # ---------- 플랫폼 관리자 ----------
    PlatformUserView:
      type: object
      required: [user_id, email, display_name, avatar_url, status, created_at]
      description: 플랫폼 관리자 열람 범위(이메일·표시 이름·사진). 실명·전화번호 없음
      properties:
        user_id:
          $ref: '#/components/schemas/Uuid'
        email:
          $ref: '#/components/schemas/Email'
        display_name:
          $ref: '#/components/schemas/DisplayName'
        avatar_url:
          type: [string, 'null']
          format: uri
        status:
          $ref: '#/components/schemas/UserStatus'
        created_at:
          $ref: '#/components/schemas/Timestamp'
    PlatformUserPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PlatformUserView'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
    UserStatusUpdate:
      type: object
      additionalProperties: false
      required: [status, reason]
      properties:
        status:
          type: string
          enum: [active, suspended, deactivated]
        reason:
          $ref: '#/components/schemas/Reason'
    ApplicationStatus:
      type: string
      enum: [active, inactive]
    Application:
      type: object
      required:
      - application_id
      - code
      - client_id
      - name
      - status
      - created_at
      - updated_at
      - secret_rotated_at
      properties:
        application_id:
          $ref: '#/components/schemas/Uuid'
        code:
          $ref: '#/components/schemas/ApplicationCode'
        client_id:
          type: string
          description: '`code`와 같다'
        name:
          type: string
          minLength: 1
          maxLength: 100
        status:
          $ref: '#/components/schemas/ApplicationStatus'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
        secret_rotated_at:
          $ref: '#/components/schemas/Timestamp'
        bff_redirect_uris:
          type: array
          items:
            type: string
            format: uri
          description: SSO용 BFF client에 등록한 정확한 callback URI. 와일드카드·임의 목적지는 허용하지 않는다.

    ApplicationPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Application'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
    ApplicationCreateRequest:
      type: object
      additionalProperties: false
      required:
      - code
      - name
      properties:
        code:
          $ref: '#/components/schemas/ApplicationCode'
        name:
          type: string
          minLength: 1
          maxLength: 100
        bff_redirect_uris:
          type: array
          items:
            type: string
            format: uri
          description: SSO용 BFF client에 등록한 정확한 callback URI. 와일드카드·임의 목적지는 허용하지 않는다.
      examples:
      - code: papyrus
        name: Papyrus
        bff_redirect_uris:
        - https://papyrus.example.com/bff/auth/callback

    ApplicationUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        status:
          $ref: '#/components/schemas/ApplicationStatus'
        bff_redirect_uris:
          type: array
          items:
            type: string
            format: uri
          description: SSO용 BFF client에 등록한 정확한 callback URI. 와일드카드·임의 목적지는 허용하지 않는다.

    ApplicationSecret:
      type: object
      required: [client_id, client_secret, previous_secret_valid_until]
      properties:
        client_id:
          type: string
        client_secret:
          type: string
          description: 이 응답에서만 반환
        previous_secret_valid_until:
          type: [string, 'null']
          format: date-time
    ApplicationWithSecret:
      allOf:
        - $ref: '#/components/schemas/Application'
        - type: object
          required: [client_secret]
          properties:
            client_secret:
              type: string
              description: 이 응답에서만 반환
    SecretRotationRequest:
      type: object
      additionalProperties: false
      properties:
        revoke_previous:
          type: boolean
          default: false

    # ---------- 서비스(SaaS) ----------
    AccessVersions:
      type: object
      additionalProperties: false
      required: [tenant, membership, tenant_application]
      description: FR-APP-008-05의 세 단위 버전
      properties:
        tenant:
          type: integer
          minimum: 0
        membership:
          type: integer
          minimum: 0
        tenant_application:
          type: integer
          minimum: 0
    AccessVerifyRequest:
      type: object
      additionalProperties: false
      required: [access_token, user_activity]
      properties:
        access_token:
          type: string
          maxLength: 8192
          writeOnly: true
          description: 사용자가 SaaS에 제시한 Passport Access Token 원문
        user_activity:
          type: boolean
          description: 사용자 명시적 동작으로 발생한 요청이면 `true`(FR-AUTH-009-03-03/06)
        cached_versions:
          $ref: '#/components/schemas/AccessVersions'
    AuthContext:
      type: object
      required: [sid, auth_method, oidc_config_id, external_issuer, auth_time, client_id, mfa]
      description: 공통 내부 인증 정보 중 SaaS에 제공하는 부분(FR-AUTH-008-04)
      properties:
        sid:
          $ref: '#/components/schemas/Uuid'
        auth_method:
          type: string
          enum: [local, oidc]
        oidc_config_id:
          type: [string, 'null']
          format: uuid
        external_issuer:
          type: [string, 'null']
          format: uri
          description: 원본 외부 발급자. Passport 토큰 `iss`와 구분
        auth_time:
          $ref: '#/components/schemas/Timestamp'
        client_id:
          type: string
        mfa:
          type: object
          required: [status, verified_at]
          properties:
            status:
              type: string
              enum: [not_required, totp, external, grace]
            verified_at:
              type: [string, 'null']
              format: date-time
    ServiceUserView:
      type: object
      required: [user_id, email, display_name, avatar_url]
      description: 연동 SaaS 제공 필드(FR-USER-002-02)
      properties:
        user_id:
          $ref: '#/components/schemas/Uuid'
        email:
          $ref: '#/components/schemas/Email'
        display_name:
          $ref: '#/components/schemas/DisplayName'
        avatar_url:
          type: [string, 'null']
          format: uri
    ServiceTenant:
      type: object
      required: [tenant_id, code, name, status]
      properties:
        tenant_id:
          $ref: '#/components/schemas/Uuid'
        code:
          $ref: '#/components/schemas/TenantCode'
        name:
          $ref: '#/components/schemas/TenantName'
        status:
          $ref: '#/components/schemas/TenantStatus'
    Entitlement:
      type: object
      required: [user, tenant, membership, tenant_application]
      properties:
        user:
          $ref: '#/components/schemas/ServiceUserView'
        tenant:
          $ref: '#/components/schemas/ServiceTenant'
        membership:
          type: object
          required: [membership_id, role, status]
          properties:
            membership_id:
              $ref: '#/components/schemas/Uuid'
            role:
              $ref: '#/components/schemas/TenantRole'
            status:
              $ref: '#/components/schemas/MembershipStatus'
        tenant_application:
          type: object
          required: [status]
          properties:
            status:
              type: string
              enum: [active, inactive]
    AccessVerifyResponse:
      type: object
      required: [decision, verified_at]
      properties:
        decision:
          type: string
          enum: [allow, deny]
        deny_reason:
          type: string
          enum: [invalid_token, token_revoked, login_expired, account_inactive, oidc_login_required, not_a_member, membership_inactive, tenant_inactive, application_not_enabled, mfa_required]
          description: '`deny`일 때만'
        suggested_status:
          type: integer
          enum: [401, 403]
          description: '`deny`일 때 SaaS가 반환할 상태 코드. 토큰·로그인 사유는 401, 그 외 403'
        cache_status:
          type: string
          enum: [fresh, stale, absent]
          description: '`allow`일 때만'
        user_id:
          $ref: '#/components/schemas/Uuid'
        tenant_id:
          $ref: '#/components/schemas/Uuid'
        versions:
          $ref: '#/components/schemas/AccessVersions'
        auth_context:
          $ref: '#/components/schemas/AuthContext'
        entitlement:
          $ref: '#/components/schemas/Entitlement'
        token:
          type: object
          required: [jti, exp]
          properties:
            jti:
              type: string
            exp:
              $ref: '#/components/schemas/Timestamp'
        verified_at:
          $ref: '#/components/schemas/Timestamp'
    ServiceMember:
      allOf:
        - $ref: '#/components/schemas/ServiceUserView'
        - type: object
          required: [membership_id, role]
          properties:
            membership_id:
              $ref: '#/components/schemas/Uuid'
            role:
              $ref: '#/components/schemas/TenantRole'
    ServiceMemberPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ServiceMember'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'

    # ---------- 헬스 ----------
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        checks:
          type: object
          properties:
            database:
              type: string
              enum: [ok, fail]
            valkey:
              type: string
              enum: [ok, fail]

    BffSessionResponse:
      type: object
      additionalProperties: false
      required:
      - authenticated
      properties:
        authenticated:
          type: boolean
        tenant_id:
          type:
          - string
          - 'null'
          format: uuid
        login:
          $ref: '#/components/schemas/LoginInfo'
      description: 브라우저용 안전한 상태. Access/Refresh Token·세션 쿠키 값·BFF client 비밀값을 포함하지 않는다.

    BffLocalLoginRequest:
      type: object
      additionalProperties: false
      required:
      - email
      - password
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
          description: 로그인에서는 정책 길이를 검사하지 않는다(기존 비밀번호 호환).
      description: Passport 관리 포털의 Local 로그인용. BFF가 서버에서 web client 유형·자격 증명을 설정한다. SaaS BFF는 Passport 중앙 로그인으로
        리다이렉트한다.

    BffContextRequest:
      type: object
      additionalProperties: false
      properties:
        tenant_id:
          $ref: '#/components/schemas/Uuid'
      description: 토큰·audience·client_id는 브라우저에서 받지 않고 BFF 설정과 세션에서 결정한다.

    LogoutRefreshRequest:
      type: object
      additionalProperties: false
      properties:
        refresh_token:
          type: string
          maxLength: 512
          writeOnly: true
      description: BFF client Basic 인증 분기에서는 refresh_token이 필수이며 해당 client·로그인과의 연결을 검증한다.

    SsoTokenRequest:
      type: object
      additionalProperties: false
      required:
      - code
      - code_verifier
      - redirect_uri
      - grant_type
      properties:
        code:
          type: string
          writeOnly: true
          maxLength: 512
        code_verifier:
          type: string
          writeOnly: true
          minLength: 43
          maxLength: 128
          pattern: ^[A-Za-z0-9._~-]+$
        redirect_uri:
          type: string
          format: uri
        grant_type:
          type: string
          const: authorization_code
      description: 코드의 client·redirect URI·PKCE·원래 로그인·테넌트 연결과 현재 접근 자격을 검증하고 원자적으로 한 번만 소비한다.

