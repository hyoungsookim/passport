  /sso/auth/oidc/callback/{tenant_id}:
    get:
      operationId: ssoOidcCallback
      tags:
      - SSO
      - OIDC
      summary: 테넌트 OIDC Callback
      description: |
        Passport SSO가 구현한다. Provider가 브라우저를 돌려보내는 Redirect URI다. 테넌트 관리자는 이 URI를 IdP 클라이언트에 등록한다(`OidcConfiguration.redirect_uri`).
        세션 쿠키를 설정하므로 Bearer 전용인 `/api/v1`이 아니라 SSO에 둔다.
        테넌트별 경로는 다중 발급자 Mix-Up 방어에 쓴다(RFC 9700).

        **검증**(하나라도 실패하면 로그인을 만들지 않는다)
        1. `state`로 미사용·미만료 트랜잭션을 찾고 최초 브라우저의 트랜잭션별 쿠키 해시를 대조한다.
           쿠키 누락·불일치는 소비 전에 거부한다. 트랜잭션의 `tenant_id`가 경로와 같아야 한다(FR-OIDC-007/012).
        2. `iss` 파라미터(RFC 9207)가 있으면 설정의 발급자와 같아야 한다.
        3. 트랜잭션 시점의 설정 버전이 현재와 같고 설정이 `enabled`여야 한다(D-06).
        4. PKCE verifier로 코드를 교환한다. ID Token의 서명(테넌트 설정의 JWKS), `iss`, `aud = client_id`, `nonce`, `exp`, `iat`를 검증한다(FR-OIDC-003).
        5. 외부 Access Token을 쓰는 경우 공통 JWT 검증 엔진에서 테넌트 설정의 용도·audience 규칙으로 검증한다. JWT만 지원한다(FR-OIDC-009-01).
        6. 지원 계약에서 요구하는 외부 세션·철회 대상 식별자를 검증하고 로그인 매핑에 저장한다. 필수 식별자 누락은 invalid_response다(FR-OIDC-017-01).

        **처리**: 11장 F-03, F-04와 같다.

        **응답**: 항상 `302`로 트랜잭션의 `return_to`에 이동한다. 결과는 URL 조각(`#`)의 파라미터로 전달한다.

        | `oidc_result` | 추가 파라미터 | 의미 |
        | --- | --- | --- |
        | `logged_in` | `tenant_id` | Passport SSO가 토큰을 서버에 저장하고 세션을 새로 생성·교체해 쿠키 설정(`intent = login`) |
        | `link_required` | `link_ticket` | 같은 이메일의 기존 계정이 있다. 기존 계정 로그인 후 연결 |
        | `link_ready` | `link_ticket` | 연결 준비 완료(`intent = link`) |
        | `reauthenticated` | | 현재 로그인에 OIDC 재인증 기록(`intent = reauth`) |
        | `error` | `error_code` | 실패. `error_code`: `access_denied`(사용자 취소), `invalid_response`, `membership_required`, `account_inactive`, `identity_already_linked`, `reauthentication_failed`, `oidc_configuration_unavailable`, `idp_status_unavailable`, `oidc_provider_error`, `transaction_expired` |

        최초 브라우저 바인딩 검증 실패 시 세션 생성·신원 연결·재인증을 수행하지 않는다.
        정상 처리한 트랜잭션의 쿠키는 삭제한다. 외부 로그인 생성 시 검증된 세션·토큰 대상 매핑을 함께 저장한다.
        트랜잭션을 찾을 수 없어 `return_to`를 알 수 없으면 관리 포털의 기본 오류 화면으로 이동한다.
      security: []
      x-requirements:
      - FR-OIDC-002
      - FR-OIDC-003
      - FR-OIDC-004
      - FR-OIDC-005
      - FR-OIDC-006
      - FR-OIDC-007
      - FR-OIDC-008
      - FR-OIDC-009
      - FR-OIDC-009-01
      - FR-OIDC-012
      - FR-OIDC-013
      - FR-OIDC-014
      - FR-OIDC-016
      - FR-AUTH-008-02
      - FR-AUTH-008-04
      - FR-USER-006
      - FR-MEM-008
      - D-08
      - SC-02
      - ADR-014
      - FR-AUTH-009-02-01
      - D-03
      - FR-MEM-005-01
      - FR-OIDC-017-01
      x-audit-event: auth.oidc_login_succeeded / auth.oidc_login_failed / user.created_from_oidc / membership.auto_provisioned
      parameters:
      - $ref: '#/components/parameters/TenantIdPath'
      - name: state
        in: query
        required: true
        schema:
          type: string
          maxLength: 256
      - name: code
        in: query
        description: 성공 시 Authorization Code
        schema:
          type: string
          maxLength: 2048
      - name: iss
        in: query
        description: RFC 9207 발급자 식별자
        schema:
          type: string
          format: uri
      - name: error
        in: query
        description: Provider 오류 코드(예 `access_denied`)
        schema:
          type: string
          maxLength: 256
      - name: error_description
        in: query
        schema:
          type: string
          maxLength: 1024
      responses:
        '302':
          description: '`return_to`(또는 기본 오류 화면)로 이동'
          headers:
            Location:
              description: '예: `https://passport.example.com/login/callback#oidc_result=logged_in&tenant_id=0193a3c1-7c2e-7d11-9a40-5b1e2f3a4b5c`'
              schema:
                type: string
                format: uri
            Set-Cookie:
              description: 로그인 성공 시 SSO 세션 쿠키를 설정하고, 정상 처리한 트랜잭션의 OIDC 바인딩 쿠키를 별도 Set-Cookie 헤더로 삭제한다.
              schema:
                type: string

  /sso/auth/login:
    servers:
    - url: https://{saas_sso_host}
      description: 각 SaaS 웹의 SSO 호스트. Passport는 이 경로를 구현하지 않는다.
      variables:
        saas_sso_host:
          default: papyrus.example.com
    get:
      operationId: ssoStart
      tags:
      - SaaS SSO Reference
      summary: '[SaaS 구현] Passport 중앙 로그인으로 SSO 시작'
      description: |
        **각 SaaS SSO가 구현하는 참고 계약이다. Passport는 이 경로를 구현하지 않는다.** 경로는 예시이며 SaaS가 정할 수 있다.
        SaaS SSO가 서버에서 자신의 client_id·등록된 callback·state·PKCE verifier를 생성·보관하고 Passport `GET /sso/auth/authorize`로 리다이렉트한다.
        요청의 임의 목적지·client 비밀값은 수용하지 않는다.
        대상 테넌트를 알면 `tenant_id`로 전달하고, 모르면 생략해 Passport가 테넌트 선택을 맡게 한다.
      x-implemented-by: saas-sso
      security: []
      x-requirements: [ADR-014, D-01, D-03, FR-AUTH-009-02-04]
      parameters:
      - name: tenant_id
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Uuid'
      responses:
        '302':
          description: 등록된 목적지로 이동. 토큰을 URL에 넣지 않는다.
          headers:
            Location:
              schema:
                type: string
                format: uri
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '400':
          $ref: '#/components/responses/BadRequest'

  /sso/auth/authorize:
    get:
      operationId: ssoAuthorize
      tags:
      - SSO
      summary: Passport 중앙 로그인에서 SSO 인가 코드 발급
      description: |
        Passport 호스트의 Passport SSO가 구현한다. SaaS SSO의 `ssoStart`가 브라우저를 이 경로로 보낸다.

        **처리 순서**
        1. `client_id`가 활성 Application이고 `redirect_uri`가 그 `sso_redirect_uris` 값과 정확히 일치해야 한다.
           아니면 `400`을 반환하고 리다이렉트하지 않는다(오픈 리다이렉트 방지).
        2. 그 밖의 파라미터 오류는 `redirect_uri`로 `error=invalid_request`를 돌려보낸다.
        3. Passport SSO 세션이 없거나 만료됐으면 검증된 요청을 보존하고 Passport 로그인 화면(Local 또는 테넌트 OIDC)으로 이동한다.
           로그인을 마치면 이 단계부터 이어간다.
        4. 대상 테넌트를 정한다.
           - `tenant_id`가 있으면 그 테넌트를 쓴다.
           - 없으면 Passport 포털이 테넌트 선택 화면을 보여준다. 후보는 사용자의 `active` 멤버십 중 이 Application이 `active`인 테넌트다.
           - 후보가 없으면 `error=no_eligible_tenant`이다.
        5. 대상 테넌트의 인가 검사(4장 2~5)를 수행한다.
           - 그 테넌트의 OIDC 로그인이 필요하면 Passport 포털에서 그 절차를 거친 뒤 이어간다.
           - 그 외 실패는 `error=tenant_access_denied`와 `error_reason`이다.
        6. client·redirect URI·원래 로그인·테넌트·PKCE에 묶인 일회용 코드를 발급하고 `redirect_uri?code=...&state=...`로 이동한다.
           코드 수명은 **[제안]** 60초다.

        Access/Refresh Token은 브라우저에 전달하지 않는다. 오류 리다이렉트에도 `state`를 그대로 돌려준다.

        **오류 리다이렉트**: `redirect_uri?error=...&error_reason=...&state=...`

        | `error` | 의미 |
        | --- | --- |
        | `invalid_request` | 파라미터 누락·형식 오류 |
        | `access_denied` | 사용자가 로그인·테넌트 선택를 취소함 |
        | `tenant_access_denied` | 대상 테넌트 접근 조건 미충족. `error_reason`은 `TenantAccessDeniedReason` 값 |
        | `no_eligible_tenant` | `tenant_id`를 생략했지만 선택할 수 있는 테넌트가 없음 |
        | `temporarily_unavailable` | 접근 자격 또는 외부 Provider 상태를 확인할 수 없음(`entitlement_unverifiable`, `idp_status_unavailable`) |
        | `server_error` | 그 밖의 서버 오류 |
      security: []
      x-requirements: [ADR-014, D-01, D-03, FR-AUTH-009-02-03, FR-AUTH-009-02-04, FR-OIDC-013, FR-APP-004]
      parameters:
      - name: client_id
        in: query
        required: true
        schema:
          type: string
          maxLength: 128
      - name: redirect_uri
        in: query
        required: true
        schema:
          type: string
          format: uri
      - name: state
        in: query
        required: true
        schema:
          type: string
          minLength: 16
          maxLength: 256
      - name: code_challenge
        in: query
        required: true
        schema:
          type: string
          minLength: 43
          maxLength: 128
      - name: code_challenge_method
        in: query
        required: true
        schema:
          type: string
          const: S256
      - name: tenant_id
        in: query
        required: false
        description: 생략하면 Passport 포털이 테넌트 선택 화면을 보여준다(처리 순서 4).
        schema:
          $ref: '#/components/schemas/Uuid'
      responses:
        '302':
          description: '`redirect_uri`로 코드 또는 오류를 전달하거나, Passport 로그인·테넌트 선택 화면으로 이동. 토큰을 URL에 넣지 않는다.'
          headers:
            Location:
              schema:
                type: string
                format: uri
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`client_id`가 없거나 비활성이고, `redirect_uri`가 등록 값과 일치하지 않음. 리다이렉트하지 않는다.'

  /sso/auth/callback:
    servers:
    - url: https://{saas_sso_host}
      description: 각 SaaS 웹의 SSO 호스트. Passport는 이 경로를 구현하지 않는다.
      variables:
        saas_sso_host:
          default: papyrus.example.com
    get:
      operationId: ssoCallback
      tags:
      - SaaS SSO Reference
      summary: '[SaaS 구현] SSO 코드 교환과 SSO 세션 생성'
      description: |
        **각 SaaS SSO가 구현하는 참고 계약이다. Passport는 이 경로를 구현하지 않는다.** 실제 경로는 Application의 `sso_redirect_uris`에 등록한 값이다.
        브라우저와 연결해 보관한 state·PKCE를 검증하고 자신의 client 자격 증명으로 `/api/v1/auth/sso/token`을 호출한다.
        토큰은 서버에 보관하며 새 불투명 세션 쿠키만 설정한다. 원래 로그인 만료·활동·테넌트 범위와 철회 상태를 계속 적용한다.
        실패·재사용된 트랜잭션으로 세션을 만들지 않는다. state는 성공·실패 모두 검증하며 code와 error 중 하나만 수용한다.
        `error`가 오면 토큰을 교환하거나 세션을 만들지 않고, `ssoAuthorize`의 오류 표에 맞는 안내 화면을 보여준다.
      x-implemented-by: saas-sso
      security: []
      x-requirements: [ADR-014, D-01, D-03, FR-AUTH-009-02-01, FR-AUTH-009-02-03, FR-AUTH-009-02-04]
      parameters:
      - name: state
        in: query
        required: true
        schema:
          type: string
          maxLength: 256
      - name: code
        in: query
        required: false
        schema:
          type: string
          maxLength: 512
      - name: error
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/SsoAuthorizationError'
      - name: error_reason
        in: query
        required: false
        description: '`error = tenant_access_denied`일 때만 온다.'
        schema:
          $ref: '#/components/schemas/TenantAccessDeniedReason'
      responses:
        '302':
          description: SaaS 화면으로 이동. 토큰을 URL에 넣지 않는다.
          headers:
            Location:
              schema:
                type: string
                format: uri
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              description: SaaS SSO 자신의 불투명 세션 쿠키. 이름·속성은 SaaS가 정하되 HttpOnly·Secure·SameSite를 적용하고, 새 세션 ID로 발급한다(세션 고정 방지).
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SsoUnauthorized'
          description: 코드 교환 실패. 세션을 만들지 않는다.

  /api/v1/auth/sso/token:
    post:
      operationId: exchangeSsoCode
      tags:
      - Auth
      summary: 서버 간 SSO 인가 코드 교환
      description: |
        등록된 SSO client를 인증하고 코드의 client·redirect URI·PKCE·원래 로그인·테넌트와 현재 이용 자격·철회를 검증한다.
        코드를 원자적으로 한 번만 소비하며 해당 client의 허용 audience로만 토큰을 발급한다.
        SSO별 Refresh Token 계열을 사용하되 원래 로그인 유지 한도와 종료 범위에 연결한다. 서비스 간 쿠키나 Refresh Token을 공유하지 않는다.
        응답은 SSO 서버만 받고 브라우저에 전달하지 않는다.

        | 상태 | `code` | 경우 |
        | --- | --- | --- |
        | 400 | `invalid_grant` | 코드가 없거나 만료·사용됨, 코드의 client와 인증한 client 불일치, `redirect_uri` 불일치, `code_verifier`가 PKCE와 불일치 |
        | 401 | `invalid_client` | SSO client 인증 실패, 비활성 Application |
        | 403 | `tenant_access_denied` | 코드 발급 후 접근 자격 상태가 바뀜 |
        | 422 | `validation_failed` | 폼 필드 누락·형식 오류 |

        이미 사용된 코드가 다시 오면 `400 invalid_grant`를 반환하고, 그 코드로 발급한 Refresh Token 계열을 폐기한다.
      security:
      - ssoClientBasic: []
      x-requirements:
      - ADR-014
      - FR-AUTH-009-02-01
      - FR-AUTH-009-02-03
      - FR-AUTH-009-02-04
      - D-03
      responses:
        '200':
          description: 처리 성공
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/InvalidGrant'
        '401':
          $ref: '#/components/responses/InvalidClient'
        '403':
          $ref: '#/components/responses/TokenForbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/TokenUnavailable'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SsoTokenRequest'

