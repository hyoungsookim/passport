components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Passport 발급 RFC 9068 Access Token. 외부 Provider 토큰은 받지 않는다.
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Protection
      description: 값 `1`. 쿠키 인증 요청에 필수이며, `Origin` 허용 목록 검사와 함께 적용한다.
    serviceBasic:
      type: http
      scheme: basic
      description: 연동 SaaS 백엔드의 `client_id:client_secret`(TLS 필수).
    bffSessionCookie:
      type: apiKey
      in: cookie
      name: __Host-passport_session
      description: Passport BFF의 불투명 세션 식별자. Access/Refresh Token이 아니며 /bff에서만 수용한다. SaaS BFF는 자신의 호스트·쿠키를 사용한다.
    bffClientBasic:
      type: http
      scheme: basic
      description: 등록된 BFF confidential client의 서버 측 client_id:client_secret(TLS 필수). client별 허용 audience·redirect
        URI를 검증한다. 브라우저에 전달하지 않는다.

  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      description: 요청 추적 ID. 없으면 서버가 만든다.
      schema:
        type: string
        maxLength: 128
        pattern: '^[A-Za-z0-9._-]+$'
    Activity:
      name: X-Passport-Activity
      in: header
      description: 사용자 명시적 동작으로 발생한 요청이면 `user`. 없으면 미사용 만료를 초기화하지 않는다(3.2).
      schema:
        type: string
        enum: [user]
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: 직전 응답의 `ETag`. 누락 시 `428`, 불일치 시 `412`.
      schema:
        type: string
    IfMatchOptional:
      name: If-Match
      in: header
      description: 기존 리소스를 바꿀 때 필수.
      schema:
        type: string
    IfNoneMatch:
      name: If-None-Match
      in: header
      description: 새로 만들 때 `*`.
      schema:
        type: string
        enum: ['*']
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      description: 접근 자격 변경 API 필수(8장).
      schema:
        $ref: '#/components/schemas/IdempotencyKey'
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      description: 재시도 시 중복 생성 방지(8장).
      schema:
        $ref: '#/components/schemas/IdempotencyKey'
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      description: 직전 응답의 `next_cursor`.
      schema:
        type: string
        maxLength: 512
    Query:
      name: q
      in: query
      description: 대소문자 무시 부분 일치 검색(엔드포인트별 대상 필드).
      schema:
        type: string
        minLength: 2
        maxLength: 100
    TenantIdPath:
      name: tenant_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    TenantCodePath:
      name: tenant_code
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/TenantCode'
    MembershipIdPath:
      name: membership_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    UserIdPath:
      name: user_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ApplicationIdPath:
      name: application_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    RequestIdPath:
      name: request_id
      in: path
      required: true
      description: MFA 초기화 요청 ID
      schema:
        $ref: '#/components/schemas/Uuid'

  headers:
    XRequestId:
      description: 요청 추적 ID
      schema:
        type: string
    ETag:
      description: 리소스 버전. 변경 요청의 `If-Match`에 쓴다.
      schema:
        type: string
        examples: ['"7"']
    IdempotencyReplayed:
      description: 같은 `Idempotency-Key`의 저장된 결과를 재생했으면 `true`.
      schema:
        type: string
        enum: ['true']
    NoStore:
      description: '`no-store`'
      schema:
        type: string
        const: no-store
    RetryAfter:
      description: 재시도까지 기다릴 초
      schema:
        type: integer
        minimum: 1
    SetBffSessionCookie:
      description: '[제안] 브라우저의 불투명 BFF 세션 쿠키. __Host-passport_session=<opaque-id>; HttpOnly; Secure; SameSite=Lax;
        Path=/; Max-Age=<원래 로그인 잔여 초>'
      schema:
        type: string

    ClearBffSessionCookie:
      description: '[제안] 브라우저의 불투명 BFF 세션 쿠키. __Host-passport_session=; HttpOnly; Secure; SameSite=Lax; Path=/;
        Max-Age=0'
      schema:
        type: string

  responses:
    Accepted:
      description: 접수됨(결과를 드러내지 않음)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AcceptedResponse'
    NoContent:
      description: 성공
    BadRequest:
      description: 잘못된 요청
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            idempotencyKeyRequired:
              value:
                type: urn:passport:problem:idempotency_key_required
                title: Idempotency-Key header is required
                status: 400
                code: idempotency_key_required
                request_id: req_01JBX4T9Q2
    InvalidTokenValue:
      description: 일회성 값(확인 토큰, 링크 티켓)이 없거나 만료·사용됨
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:passport:problem:invalid_token_value
            title: The token is invalid or expired
            status: 400
            code: invalid_token_value
            request_id: req_01JBX4T9Q2
    InvalidGrant:
      description: SSO 인가 코드가 없거나 만료·사용됨, 또는 client·`redirect_uri`·PKCE 불일치
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:passport:problem:invalid_grant
            title: The authorization code is invalid, expired, or already used
            status: 400
            code: invalid_grant
            request_id: req_01JBX4T9Q2
    Unauthorized:
      description: 인증 실패(`unauthenticated`, `invalid_token`, `token_revoked`, `login_expired`)
      headers:
        WWW-Authenticate:
          description: '`Bearer error="invalid_token"`'
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:passport:problem:token_revoked
            title: The access token has been revoked
            status: 401
            code: token_revoked
            request_id: req_01JBX4T9Q2
    InvalidCredentials:
      description: 이메일·비밀번호 불일치(계정 존재 여부 비공개)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:passport:problem:invalid_credentials
            title: Email or password is incorrect
            status: 401
            code: invalid_credentials
            request_id: req_01JBX4T9Q2
    RefreshUnauthorized:
      description: Refresh 실패(`refresh_token_invalid`, `refresh_token_reused`, `login_expired`, `token_revoked`).
        재로그인 필요
      headers: {}
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            reused:
              value:
                type: urn:passport:problem:refresh_token_reused
                title: Refresh token reuse detected; all logins were ended
                status: 401
                code: refresh_token_reused
                request_id: req_01JBX4T9Q2
            expired:
              value:
                type: urn:passport:problem:login_expired
                title: The login has expired
                status: 401
                code: login_expired
                detail: Idle timeout of 30 minutes exceeded.
                request_id: req_01JBX4T9Q2

    InvalidClient:
      description: 서비스 자격 증명 실패 또는 비활성 Application
      headers:
        WWW-Authenticate:
          description: '`Basic realm="passport-service"`'
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:passport:problem:invalid_client
            title: Client authentication failed
            status: 401
            code: invalid_client
            request_id: req_01JBX4T9Q2
    Forbidden:
      description: 권한 부족(`forbidden`, `tenant_access_denied`, `email_verification_required`, `self_action_forbidden`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:passport:problem:forbidden
            title: Platform administrator role is required
            status: 403
            code: forbidden
            request_id: req_01JBX4T9Q2
    LoginForbidden:
      description: 비밀번호는 맞지만 로그인할 수 없음
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            emailNotVerified:
              value:
                type: urn:passport:problem:email_verification_required
                title: Email verification is required
                status: 403
                code: email_verification_required
                request_id: req_01JBX4T9Q2
            accountInactive:
              value:
                type: urn:passport:problem:account_inactive
                title: The account is not active
                status: 403
                code: account_inactive
                request_id: req_01JBX4T9Q2
    TokenForbidden:
      description: 토큰 발급 조건 미충족(`tenant_access_denied`, `mfa_required`, `email_verification_required`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            mfaRequired:
              value:
                type: urn:passport:problem:mfa_required
                title: Multi-factor authentication is required for this tenant
                status: 403
                code: mfa_required
                request_id: req_01JBX4T9Q2
                mfa:
                  tenant_id: 0193a3c1-7c2e-7d11-9a40-5b1e2f3a4b5c
                  enrolled: false
                  methods: [totp]
            oidcLoginRequired:
              value:
                type: urn:passport:problem:tenant_access_denied
                title: This login cannot access the tenant
                status: 403
                code: tenant_access_denied
                reason: oidc_login_required
                request_id: req_01JBX4T9Q2
            applicationNotEnabled:
              value:
                type: urn:passport:problem:tenant_access_denied
                title: The application is not enabled for this tenant
                status: 403
                code: tenant_access_denied
                reason: application_not_enabled
                request_id: req_01JBX4T9Q2
    TenantForbidden:
      description: 테넌트 범위 인가 실패(`tenant_context_mismatch`, `forbidden`, `mfa_required`, `self_action_forbidden`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            contextMismatch:
              value:
                type: urn:passport:problem:tenant_context_mismatch
                title: The token is scoped to a different tenant
                status: 403
                code: tenant_context_mismatch
                request_id: req_01JBX4T9Q2
            notAdmin:
              value:
                type: urn:passport:problem:forbidden
                title: Tenant administrator role is required
                status: 403
                code: forbidden
                request_id: req_01JBX4T9Q2
    ReauthenticationRequired:
      description: 최근 재인증 필요
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:passport:problem:reauthentication_required
            title: Recent re-authentication is required
            status: 403
            code: reauthentication_required
            accepted_methods: [password]
            request_id: req_01JBX4T9Q2
    NotFound:
      description: 없음 또는 접근 권한 밖(은닉)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:passport:problem:not_found
            title: Resource not found
            status: 404
            code: not_found
            request_id: req_01JBX4T9Q2
    Conflict:
      description: 상태 충돌(`conflict`, `already_exists`, `identity_already_linked`, `last_tenant_admin`, `totp_already_enrolled`, `local_credential_not_set`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            lastAdmin:
              value:
                type: urn:passport:problem:last_tenant_admin
                title: The tenant must keep at least one active administrator
                status: 409
                code: last_tenant_admin
                tenant_ids: [0193a3c1-7c2e-7d11-9a40-5b1e2f3a4b5c]
                request_id: req_01JBX4T9Q2
            identityLinked:
              value:
                type: urn:passport:problem:identity_already_linked
                title: The external identity is linked to another account
                status: 409
                code: identity_already_linked
                request_id: req_01JBX4T9Q2
    PreconditionFailed:
      description: '`If-Match` 불일치. 최신 리소스를 다시 조회한다.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:passport:problem:precondition_failed
            title: The resource has been modified
            status: 412
            code: precondition_failed
            request_id: req_01JBX4T9Q2
    PreconditionRequired:
      description: '`If-Match` 누락'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:passport:problem:precondition_required
            title: If-Match header is required
            status: 428
            code: precondition_required
            request_id: req_01JBX4T9Q2
    PayloadTooLarge:
      description: 업로드 크기 초과
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnsupportedMediaType:
      description: 허용하지 않는 형식
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationFailed:
      description: 입력 검증 실패(`validation_failed`, `idempotency_key_reused`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:passport:problem:validation_failed
            title: Request validation failed
            status: 422
            code: validation_failed
            request_id: req_01JBX4T9Q2
            errors:
              - field: password
                code: too_short
                message: Password must be at least 12 characters.
    InvalidOtp:
      description: OTP·복구 코드 불일치·만료·재사용
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:passport:problem:invalid_otp
            title: The code is invalid
            status: 422
            code: invalid_otp
            request_id: req_01JBX4T9Q2
    TooManyRequests:
      description: 속도·실패 제한
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:passport:problem:too_many_requests
            title: Too many requests
            status: 429
            code: too_many_requests
            request_id: req_01JBX4T9Q2
    AccessSyncPending:
      description: DB 저장 완료, Valkey 반영 미완료(FR-APP-008-09). 같은 `Idempotency-Key`로 재시도한다.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:passport:problem:access_sync_pending
            title: Change saved but not yet effective; retry with the same Idempotency-Key
            status: 503
            code: access_sync_pending
            db_committed: true
            cache_synced: false
            request_id: req_01JBX4T9Q2
    EntitlementUnverifiable:
      description: 접근 자격 최신 상태 확인 불가(FR-APP-008-03). 요청을 거부하되 로그인은 유지한다.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:passport:problem:entitlement_unverifiable
            title: Access entitlement cannot be verified right now
            status: 503
            code: entitlement_unverifiable
            request_id: req_01JBX4T9Q2
    IdpUnavailable:
      description: 외부 Provider 상태 확인 불가 또는 통신 오류
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:passport:problem:idp_status_unavailable
            title: The identity provider status cannot be confirmed
            status: 503
            code: idp_status_unavailable
            request_id: req_01JBX4T9Q2
    TokenUnavailable:
      description: 발급 일시 불가(`entitlement_unverifiable`, `idp_status_unavailable`). 로그인과 Refresh Token은 유지된다.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:passport:problem:entitlement_unverifiable
            title: Access entitlement cannot be verified right now
            status: 503
            code: entitlement_unverifiable
            request_id: req_01JBX4T9Q2


    BffUnauthorized:
      description: BFF 세션 없음·만료·무효화. 새 로그인이 필요하며 쿠키만으로 철회·접근 자격 검사를 우회하지 않는다.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Set-Cookie:
          $ref: '#/components/headers/ClearBffSessionCookie'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:passport:problem:unauthenticated
            title: BFF login is required
            status: 401
            code: unauthenticated
            request_id: req_bff_login

