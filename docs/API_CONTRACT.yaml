    ## 16. 미결·제안 목록 (승인 필요)

    1. BFF 세션 쿠키의 이름·SameSite 값, 세션 저장·고정 방지·암호화·동시 갱신 구현 상세. SSO 인가 코드 수명은 60초를 제안하며 재사용·PKCE 불일치·redirect URI 불일치는 거부한다. 기존 Refresh Token 재사용 탐지 정책은 완화하지 않는다.
    2. TOTP 첫 등록의 신뢰 문제. 비밀번호만 탈취한 공격자가 자기 TOTP를 먼저 등록할 수 있다.
       제안은 첫 등록을 허용하되 등록 사실을 이메일로 알리는 것이다. 대안은 첫 등록에 이메일 확인 코드를 요구하는 것이다.
    3. 플랫폼 관리자 "강한 인증"(5장 보안 불변 조건)의 방식. 제안은 플랫폼 범위 TOTP 필수화이며, 이 계약에는 아직 반영하지 않았다.
    4. 마지막 관리자 보호(`409 last_tenant_admin`). 마지막 관리자의 강등·제거와 탈퇴를 막는다.
       탈퇴 즉시 완료 원칙(FR-USER-005)과 충돌하는지 확인이 필요하다.
    5. JWT `alg = ES256`, `aud`를 Application `code`로 쓰는 방식, 서명 키 게시·유지 24시간.
    6. 재인증 유효 5분, 링크 티켓 10분, 이메일 확인 토큰 24시간, MFA 초기화 요청 72시간, 멱등 키 보관 24시간.
    7. 비밀번호 정책: 12~128자, 조합 규칙 없음, 이메일과 같은 값 금지. 유출 비밀번호 목록 대조 여부.
    8. 속도·실패 제한 수치(10장).
    9. TOTP 매개변수: SHA-1, 6자리, 30초, 허용 오차 ±1 스텝, 같은 스텝 재사용 금지. 복구 코드 10개.
    10. 외부 MFA 인정 규칙의 표현(`accepted_acr_values`, `accepted_amr_values`). Keycloak·Auth0의 실제 클레임 검증이 필요하다.
    11. 테넌트 코드 형식(`^[a-z0-9](?:[a-z0-9-]{1,30}[a-z0-9])$`)과 생성 후 변경 불가.
    12. 사전 등록 멤버십의 이메일 매칭. OIDC는 Provider가 `email_verified = true`로 준 이메일만 쓰고, Local은 확인된 이메일만 쓴다.

    ## 17. BFF 경계의 추가 검증
    - BFF 세션 쿠키의 값은 비밀 식별자이며 LoginInfo.login_id로 대체할 수 없다.
    - 일반 브라우저 응답에는 Access/Refresh Token·BFF가 사용하는 client 비밀값을 포함하지 않는다.
    권한 있는 관리자가 서비스 자격 증명을 생성·교체할 때 새 비밀값을 한 번 표시하는 기존 관리 계약은 별도로 적용한다.
    - 일반 리소스 API의 Set-Cookie·WWW-Authenticate를 브라우저로 그대로 전달하지 않는다.
      세션 쿠키 설정·삭제는 BFF 자신의 인증·종료 처리만 수행한다.
    - /api/v1/auth/sso/token은 OAuth Authorization Code의 서버 간 교환으로,
      application/x-www-form-urlencoded의 grant_type=authorization_code를 사용한다.
    - BFF client 등록에는 서버 자격 증명, 고정 audience, 정확한 callback URI가 필요하다.
      관리 포털 client는 설치 설정으로, SaaS client는 해당 Application과 연결하여 관리한다.
      이 client 인증은 사용자 인증·현재 접근 자격·MFA 검사를 대체하지 않는다.
    - 외부 Provider의 OIDC callback과 JWKS·공개 헬스 체크는 일반 BFF 프록시 경계의 예외이다.

