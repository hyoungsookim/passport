paths:
  /api/v1/auth/signup:
    post:
      operationId: signupLocal
      tags: [Auth]
      summary: Local 계정 공개 가입
      description: |
        관리자 초대·승인 없이 Local 계정을 만든다. 계정은 `pending_verification` 상태로 생성되고 이메일 확인 메일을 보낸다.
        이미 가입된 이메일이어도 같은 `202`를 반환하고, 새 계정 대신 "이미 가입됨" 안내 메일을 보낸다(계정 열거 방지, FR-AUTH-006).
        테넌트 소속과 SaaS 이용 권한은 부여하지 않는다(FR-USER-003).
      security: []
      x-requirements: [FR-USER-003, FR-AUTH-006, FR-AUTH-007, D-04]
      x-audit-event: user.signup_requested
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/auth/email-verifications/confirm:
    post:
      operationId: confirmEmailVerification
      tags: [Auth]
      summary: 이메일 소유 확인 완료
      description: |
        메일의 확인 토큰을 제출한다. 성공하면 계정이 `active`가 된다. 토큰은 1회용이며 **[제안]** 24시간 유효하다.
        확인 수단(링크 토큰)은 SC-01의 "인증 링크나 코드" 중 링크 방식이다.
      security: []
      x-requirements: [FR-USER-003, D-04]
      x-audit-event: user.email_verified
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerificationConfirmRequest'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/InvalidTokenValue'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/auth/email-verifications/resend:
    post:
      operationId: resendEmailVerification
      tags: [Auth]
      summary: 이메일 확인 메일 재발송
      description: 계정 존재·확인 여부와 관계없이 항상 `202`를 반환한다(계정 열거 방지). 이전 확인 토큰은 무효화된다.
      security: []
      x-requirements: [FR-USER-003, FR-AUTH-006, D-04]
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerificationResendRequest'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/auth/local/login:
    post:
      operationId: loginLocal
      tags:
      - Auth
      summary: Local 로그인
      description: |
        이메일·비밀번호로 로그인하고 기본 토큰(`aud = passport`, `tenant_id` 없음)을 발급한다.
        - `web`: 등록된 SSO client 인증이 필수이며 토큰은 SSO 서버에 응답 본문으로 반환한다. 브라우저는 /sso/auth/local/login을 사용한다.
        - `native`: 토큰을 응답 본문으로 전달한다. client_type 생략 시 native로 처리한다.
        SSO 자격 증명 없이 web 로그인을 만들 수 없고 브라우저 응답에 토큰을 전달하지 않는다.

        계정이 없거나 비밀번호가 틀리면 같은 `401 invalid_credentials`를 반환하고, 응답 시간도 같게 맞춘다.
        아래 두 오류는 비밀번호가 맞을 때만 반환한다.
        - `403 email_verification_required`: 이메일 미확인
        - `403 account_inactive`: 계정 차단·비활성
      security:
      - ssoClientBasic: []
      - {}
      x-requirements:
      - FR-AUTH-001
      - FR-AUTH-002
      - FR-AUTH-005
      - FR-AUTH-006
      - FR-AUTH-007
      - FR-AUTH-008-01
      - FR-AUTH-009-02
      - FR-AUTH-010
      - SC-01
      x-audit-event: auth.login_succeeded / auth.login_failed
      parameters:
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocalLoginRequest'
      responses:
        '200':
          description: 로그인 성공
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              examples:
                web:
                  $ref: '#/components/examples/TokenResponseWeb'
                native:
                  $ref: '#/components/examples/TokenResponseNative'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
          description: '이메일·비밀번호 불일치(`invalid_credentials`, 계정 존재 여부 비공개) 또는 SSO client 인증 실패(`invalid_client`)'
        '403':
          $ref: '#/components/responses/LoginForbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/auth/token:
    post:
      operationId: issueToken
      tags:
      - Auth
      summary: Access Token 발급·갱신(테넌트 선택, SaaS 진입 포함)
      description: |
        SSO 서버 또는 직접 API 클라이언트가 본문의 refresh_token으로 지정한 tenant_id·허용 audience의 Access Token을 발급하고 Refresh Token을 회전한다.
        web 로그인에 연결된 Refresh Token은 등록된 SSO client 인증이 필수이며 해당 client의 허용 audience로 제한한다. native는 기존 직접 토큰 계약을 따른다.
        로그인의 서버 측 client_type·client 연결을 검증하며 요청 본문으로 web/native를 전환할 수 없다. 브라우저 세션 쿠키는 받지 않는다.
        토큰은 응답 본문으로 SSO 서버·직접 클라이언트에만 전달한다. 테넌트·이용 자격·로그인 유지·외부 인증 상태를 확인한다.
        SSO는 계열별 갱신을 직렬화한다. 무효화된 Refresh Token 재사용은 기존 전체 로그인 종료·토큰 철회 정책을 따른다.
        검증 불가(503) 또는 조건 미충족이면 토큰을 회전하지 않고 기존 로그인·Refresh Token을 보존한다.
        `401`(`invalid_client` 제외)이면 로그인이 끝난 것이므로 SSO는 그 세션과 서버 측 토큰을 삭제하고 세션 쿠키를 지운다(FR-AUTH-009-02-03).
      security:
      - ssoClientBasic: []
      - {}
      x-requirements:
      - FR-AUTH-002
      - FR-AUTH-008
      - FR-AUTH-008-01
      - FR-AUTH-008-03
      - FR-AUTH-009-01
      - FR-AUTH-009-02-01
      - FR-AUTH-009-02-02
      - FR-AUTH-009-03
      - FR-AUTH-009-07
      - FR-AUTH-009-07-01
      - FR-OIDC-002
      - FR-OIDC-013
      - FR-OIDC-016
      - FR-APP-004
      - FR-APP-005
      - D-03
      - SC-04
      parameters:
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
            examples:
              ssoRefresh:
                summary: SSO 서버의 테넌트 토큰 갱신(클라이언트 인증 필수)
                value:
                  refresh_token: prt_server_secret
                  tenant_id: 0193a3c1-7c2e-7d11-9a40-5b1e2f3a4b5c
              nativeRefresh:
                summary: 직접 API 클라이언트 갱신
                value:
                  refresh_token: prt_native_secret
      responses:
        '200':
          description: 발급 성공
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              examples:
                tenantToken:
                  $ref: '#/components/examples/TokenResponseTenant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/RefreshUnauthorized'
          description: Refresh 실패(`refresh_token_invalid`, `refresh_token_reused`, `login_expired`, `token_revoked`) 또는 SSO client 인증 실패(`invalid_client`). 재로그인 필요
        '403':
          $ref: '#/components/responses/TokenForbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/TokenUnavailable'

  /api/v1/auth/logout:
    post:
      operationId: logout
      tags:
      - Auth
      summary: 현재 로그인 로그아웃
      description: |-
        현재 로그인(`sid`)을 종료한다. 연결된 Refresh Token은 폐기하고, Access Token은 모든 audience에 대해 즉시 철회한다.
        - 외부 Provider 로그아웃은 요청하지 않는다(FR-AUTH-009-04).
        - 이미 종료된 로그인이어도 `204`를 반환한다(멱등).
        - SaaS SSO가 호출해도 그 브라우저의 로그인(`sid`) 전체가 끝난다. 같은 로그인에 연결된 Passport 포털과 다른 SaaS의 SSO 세션도 무효가 된다(SSO 단일 로그아웃).
          Passport SSO는 요청마다 `sid` 상태를 확인하고, SaaS SSO는 `verifyAccess` 거부나 갱신 `401`로 이를 알게 되어 자기 세션을 지운다.

        SSO는 Bearer 또는 SSO client 인증과 연결된 refresh_token으로 서버에서 호출한다. Basic 인증 분기는 해당 사용자 로그인에 연결된 유효한 Refresh Token도 반드시 검증한다. 종료 범위의 SSO 세션도 무효화한다. 브라우저 쿠키 삭제는 SSO의 대응 로그아웃 경로가 수행한다.
      security:
      - bearerAuth: []
      - ssoClientBasic: []
      x-requirements:
      - FR-AUTH-009-04
      - FR-AUTH-009-06-01
      x-audit-event: auth.logout
      parameters:
      - $ref: '#/components/parameters/RequestId'
      responses:
        '204':
          description: 로그아웃 완료
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: Bearer 인증 실패 또는 SSO client 인증 실패(`invalid_client`)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRefreshRequest'

  /api/v1/auth/logout-all:
    post:
      operationId: logoutAll
      tags:
      - Auth
      summary: 모든 기기에서 로그아웃
      description: |-
        사용자의 모든 Passport 로그인을 종료하고, 모든 Refresh Token 폐기와 Access Token 즉시 철회를 한다.
        Local과 OIDC 로그인을 모두 포함하며, 외부 Provider 로그아웃은 요청하지 않는다(FR-AUTH-009-04).

        SSO는 Bearer 또는 SSO client 인증과 연결된 refresh_token으로 서버에서 호출한다. Basic 인증 분기는 해당 사용자 로그인에 연결된 유효한 Refresh Token도 반드시 검증한다. 종료 범위의 SSO 세션도 무효화한다. 브라우저 쿠키 삭제는 SSO의 대응 로그아웃 경로가 수행한다.
      x-requirements:
      - FR-AUTH-009-04
      - FR-AUTH-009-06-01
      x-audit-event: auth.logout_all
      parameters:
      - $ref: '#/components/parameters/RequestId'
      responses:
        '204':
          description: 전체 로그아웃 완료
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: Bearer 인증 실패 또는 SSO client 인증 실패(`invalid_client`)
      security:
      - bearerAuth: []
      - ssoClientBasic: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRefreshRequest'

  /api/v1/auth/reauthentication/password:
    post:
      operationId: reauthenticateWithPassword
      tags: [Auth]
      summary: 비밀번호 재인증
      description: |
        현재 로그인에 Local 재인증 시각을 기록한다. 재인증이 필요한 작업은 이 시각이 5분 이내인지 확인한다(**[제안]**, 5장).
        - 비밀번호가 틀리면 `422 validation_failed`이고 `errors[].field = password`이다.
          `401`을 쓰지 않는 이유는 클라이언트가 로그인 만료로 오인하지 않게 하기 위해서다.
        - Local 비밀번호가 없는 계정은 `409 local_credential_not_set`이다. 이런 계정은 OIDC 재인증(`intent = reauth`)을 쓴다.
        - 실패는 로그인과 같은 실패 제한을 적용한다.
      x-requirements: [FR-OIDC-005, FR-USER-005]
      x-audit-event: auth.reauthenticated
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordReauthRequest'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/auth/jwks.json:
    get:
      operationId: getJwks
      tags: [Auth]
      summary: Access Token 검증 키(JWKS)
      description: |
        Passport Access Token 서명 검증용 공개 키 집합(RFC 7517)이다. 현재 키, 교체 예정 키, 유예 중인 이전 키를 포함한다.
        이 엔드포인트는 OIDC Discovery 제공을 뜻하지 않는다(2.1 제외 범위).
      security: []
      x-requirements: [FR-AUTH-008, FR-AUTH-008-01, NFR-SEC-002, D-02]
      responses:
        '200':
          description: JWKS
          headers:
            Cache-Control:
              description: '**[제안]** `public, max-age=300`'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Jwks'

  /api/v1/auth/tenants/{tenant_code}/login-options:
    get:
      operationId: getTenantLoginOptions
      tags: [OIDC]
      summary: 테넌트 로그인 진입 정보
      description: |
        테넌트 전용 로그인 링크와 공통 화면의 테넌트 코드 입력(FR-OIDC-011)에서 대상 테넌트를 식별한다.
        테넌트가 없거나 `active`가 아니면 `404`이다.
        OIDC 설정이 없거나 비활성·오류이면 `oidc.available = false`이다. 다른 Provider로 대체하지 않는다(FR-OIDC-014).
      security: []
      x-requirements: [FR-OIDC-011, FR-OIDC-014, FR-WEB-001]
      parameters:
        - $ref: '#/components/parameters/TenantCodePath'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 로그인 진입 정보
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantLoginOptions'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/users/me:
    get:
      operationId: getMe
      tags: [Me]
      summary: 현재 사용자 조회
      description: |
        본인의 모든 프로필 항목과 계정 상태를 반환한다(FR-USER-002-02).
        별도 신원 JWT나 ID Token 대신 이 API로 사용자 정보를 제공한다(FR-AUTH-010).
        기본 토큰과 테넌트 토큰을 모두 받는다.
      x-requirements: [FR-USER-001, FR-USER-002, FR-USER-002-02, FR-USER-004, FR-AUTH-010]
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Activity'
      responses:
        '200':
          description: 현재 사용자
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSelf'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      operationId: updateMe
      tags: [Me]
      summary: 현재 사용자 프로필 수정
      description: |
        표시 이름과 선택 항목(이름, 성)을 수정한다. 선택 항목에 `null`을 보내면 삭제한다.
        이메일 변경은 P0 범위가 아니다.
      x-requirements: [FR-USER-002, FR-USER-002-01, NFR-SEC-006, NFR-OPS-002-03]
      x-audit-event: user.profile_updated
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Activity'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '200':
          description: 수정 결과
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSelf'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '503':
          $ref: '#/components/responses/SecurityChangeUnavailable'

  /api/v1/users/me/password:
    post:
      operationId: changePassword
      tags:
      - Me
      summary: 비밀번호 변경
      description: |
        현재 비밀번호를 확인하고 새 비밀번호로 바꾼다. 해시는 Argon2id를 쓴다(FR-AUTH-007).
        - 성공하면 현재 로그인을 포함한 모든 로그인을 종료한다. Refresh Token은 폐기하고 Access Token은 즉시 철회한다(FR-AUTH-009-05-01, 009-06-02).
        - 클라이언트는 새 비밀번호로 다시 로그인한다.
        - 현재 비밀번호가 틀리면 `422 validation_failed`이고 `errors[].field = current_password`이다.
        - Local 비밀번호가 없는 계정은 `409 local_credential_not_set`이다.
      x-requirements:
      - FR-AUTH-003
      - FR-AUTH-007
      - FR-AUTH-009-05-01
      - FR-AUTH-009-06-02
      x-audit-event: user.password_changed
      parameters:
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
      responses:
        '204':
          description: 변경 완료. 모든 로그인 종료
          headers: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/auth/withdrawals/complete:
    post:
      operationId: completeWithdrawal
      tags: [Auth]
      summary: 커밋된 탈퇴 요청의 완료 처리 재개
      description: |
        Withdrawal-Receipt 해시로 찾은 원 탈퇴 요청의 외부 커밋 기록·Valkey 반영을 재시도하고 완료 시 204를 반환한다.
        로그인 쿠키·Bearer는 필요 없고 수용하지 않는다. 키는 원 DB 커밋부터 24시간만 유효하며 수명을 연장하지 않는다.
        새 탈퇴를 시작하거나 계정·로그인·권한을 복구하지 않고, 개인정보·계정 상태 응답 본문도 반환하지 않는다.
        원 DB 커밋이 없거나 키가 불명·만료된 경우 동일한 404다. 본문·사용자 ID·임의 작업 인자를 받지 않는다.
        같은 키의 동시 요청도 원 이벤트를 멱등 처리한다. 불명 키 탐색은 IP별 속도 제한을 적용한다.
      security:
      - withdrawalReceipt: []
      x-requirements: [FR-USER-005-02, FR-APP-008-09, NFR-OPS-002-03]
      x-audit-event: user.withdrawal_completion_retried
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/WithdrawalReceipt'
      responses:
        '204':
          description: 원 탈퇴 처리 완료. 반복 확인에도 동일 응답
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/SecurityChangeUnavailable'

  /sso/auth/withdrawals/complete:
    post:
      operationId: ssoCompleteWithdrawal
      tags: [SSO]
      summary: 브라우저의 탈퇴 완료 처리 재개
      description: |
        자기 Origin·CSRF 헤더와 Withdrawal-Receipt를 검증한다. 종료된 로그인 세션 쿠키를 요구하지 않는다.
        확인 키만 고정된 completeWithdrawal로 전달하며 브라우저 Authorization·Cookie·임의 본문은 전달하지 않는다.
        성공 시 현재 세션 쿠키와 클라이언트에 보관한 확인 키를 정리한다. 미완료 시 키의 원 만료 시각을 유지한다.
      security:
      - withdrawalReceipt: []
        csrfHeader: []
      x-sso-upstream:
        method: POST
        path: /api/v1/auth/withdrawals/complete
      x-requirements: [FR-USER-005-02, FR-APP-008-09, NFR-OPS-002-03]
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/WithdrawalReceipt'
      responses:
        '204':
          description: 원 탈퇴 처리 완료
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              $ref: '#/components/headers/ClearSsoSessionCookie'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/SecurityChangeUnavailable'

  /api/v1/users/me/withdrawal:
    post:
      operationId: withdrawMe
      tags:
      - Me
      summary: 계정 탈퇴
      description: |
        최근 재인증이 필요하다(5장). 확정하면 유예기간 없이 즉시 탈퇴하며, 취소와 복구는 없다(FR-USER-005).
        - `users` 행과 직접·간접 FK로 연결된 모든 자손을 같은 트랜잭션에서 물리 삭제한다. 기존 사용자 ID를 재사용하지 않는다.
        - 인증 정보·과거 해지 멤버십·종료 로그인·토큰 요청과 처리 이력을 삭제한다. 테넌트·서비스·OIDC 설정은 유지하며 접근 자격 변경의 완료 조건은 8장 규약을 따른다.
        - 개인정보를 추가 보관하지 않는다. `audit_logs`는 사용자 FK 없이 유지하고 기존 사용자 ID·탈퇴 시각·삭제 결과를 개인정보 값 없이 기록한다.
        - 최초 요청 전에 클라이언트가 만든 Withdrawal-Receipt를 필수로 받는다. 원 사용자 ID·멱등 키·본문에 해시를 바인딩해 같은 탈퇴 트랜잭션에서 저장한다. 원 탈퇴 완료 확인·동기화·보안 기록은 사용자 FK 없이 보존하며 삭제된 사용자 프로필을 담은 기존 멱등 응답은 제거한다.
        - 로그인 종료 후 응답 유실·503이면 전용 completeWithdrawal 경로를 사용한다. 완료 키의 수명은 DB 커밋부터 24시간이다.
        - **[제안]** 어떤 테넌트의 마지막 관리자이면 `409 last_tenant_admin`이고, 해당 `tenant_ids`를 함께 반환한다(16장 2번).
      x-requirements:
      - FR-USER-005
      - FR-USER-005-01
      - FR-APP-008-01
      - FR-APP-008-06
      - FR-APP-008-09
      - SC-06
      - FR-USER-005-02
      - NFR-OPS-002-03
      x-audit-event: user.withdrawn
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/IdempotencyKeyRequired'
      - $ref: '#/components/parameters/WithdrawalReceipt'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WithdrawalRequest'
      responses:
        '204':
          description: 탈퇴 완료
          headers: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ReauthenticationRequired'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/SecurityChangeUnavailable'

  /api/v1/users/me/tenants:
    get:
      operationId: listMyTenants
      tags: [Me]
      summary: 소속 테넌트 목록
      description: |
        본인의 멤버십 목록이다(`removed` 제외). `access`는 **현재 로그인** 기준으로 테넌트 토큰을 받을 수 있는지와 그 이유를 알려준다.
        테넌트 선택 화면(FR-WEB-003)에 쓴다. 판정은 안내용이며, 실제 발급 시 다시 검사한다.
        검색 `q`는 테넌트 이름과 코드에 적용한다.
      x-requirements: [FR-MEM-001, FR-MEM-002, FR-WEB-003, FR-OIDC-013, SC-04]
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Activity'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Query'
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, -name, joined_at, -joined_at]
            default: name
      responses:
        '200':
          description: 소속 테넌트 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyTenantPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/users/me/identities:
    get:
      operationId: listMyIdentities
      tags: [Identities]
      summary: 연결된 인증 수단 목록
      description: Local 인증 수단의 유무와 연결된 외부 신원을 보여주며 인증 비밀값은 포함하지 않는다(FR-USER-007). 외부 신원은 `(issuer, subject)`로 식별한다(FR-OIDC-004).
      x-requirements: [FR-USER-006, FR-USER-007, FR-OIDC-004]
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Activity'
      responses:
        '200':
          description: 인증 수단 목록
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Identity'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: linkIdentity
      tags: [Identities]
      summary: 외부 신원 연결
      description: |
        OIDC 콜백에서 받은 링크 티켓의 외부 신원을 현재 사용자에 연결한다.
        - 기존 계정의 재인증(최근 5분, 로그인 직후 포함)과 `confirm: true`가 모두 필요하다(FR-OIDC-005, D-08).
        - 플랫폼 관리자 승인은 요구하지 않는다.
        - 외부 신원이 이미 다른 사용자에게 연결되어 있으면 `409 identity_already_linked`이고, 기존 연결을 유지한다.
        - 계정 병합과 신원 이전은 제공하지 않는다.
      x-requirements: [FR-OIDC-005, FR-USER-006, D-08, FR-WEB-002]
      x-audit-event: identity.linked
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkIdentityRequest'
      responses:
        '201':
          description: 연결 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identity'
        '400':
          $ref: '#/components/responses/InvalidTokenValue'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ReauthenticationRequired'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/tenants:
    post:
      operationId: createTenant
      tags: [Tenants]
      summary: 테넌트 생성
      description: |
        이메일 소유를 확인한 사용자는 플랫폼 관리자 승인 없이 테넌트를 만들 수 있다(FR-TEN-001, D-05). 기본 토큰으로 호출한다.
        - 생성자는 첫 `admin`으로 자동 등록된다. 플랫폼 관리자 권한은 부여하지 않는다(FR-MEM-004).
        - OIDC 소속 부여 방식은 수동 등록(`manual`)으로 시작한다(D-08).
        - OIDC로 생성된 계정은 Provider가 `email_verified = true`로 준 경우에만 이메일 확인 완료로 본다.
        - 코드가 이미 쓰이고 있으면 `409 already_exists`이다.
      x-requirements: [FR-TEN-001, FR-TEN-002, FR-TEN-003, FR-MEM-004, D-05, SC-03]
      x-audit-event: tenant.created
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Activity'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantCreateRequest'
      responses:
        '201':
          description: 생성 완료
          headers:
            Location:
              description: '`/api/v1/tenants/{tenant_id}`'
              schema:
                type: string
            ETag:
              $ref: '#/components/headers/ETag'
          content:
