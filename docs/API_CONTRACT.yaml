components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Passport 발급 RFC 9068 Access Token. 외부 Provider 토큰은 받지 않는다.
    withdrawalReceipt:
      type: apiKey
      in: header
      name: Withdrawal-Receipt
      description: 원 탈퇴 요청의 완료 처리 전용 256비트 키. DB 커밋부터 24시간, 일반 API 인증 불가.
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Protection
      description: 값 `1`. 쿠키 인증 요청에 필수이며, `Origin` 허용 목록 검사와 함께 적용한다.
    serviceBasic:
      type: http
      scheme: basic
      description: 연동 SaaS 백엔드의 `client_id:client_secret`(TLS 필수).
    ssoSessionCookie:
      type: apiKey
      in: cookie
      name: __Host-passport_session
      description: Passport SSO의 불투명 세션 식별자. Access/Refresh Token이 아니며 /sso에서만 수용한다. SaaS SSO는 자신의 호스트·쿠키를 사용한다.
    ssoClientBasic:
      type: http
      scheme: basic
      description: 등록된 SSO confidential client의 서버 측 client_id:client_secret(TLS 필수). client별 허용 audience·redirect
        URI를 검증한다. 브라우저에 전달하지 않는다.

  parameters:
    WithdrawalReceipt:
      name: Withdrawal-Receipt
      in: header
      required: true
      description: 첫 탈퇴 요청 전에 클라이언트가 생성·보관한 CSPRNG 32바이트의 base64url 값. 응답·로그에 노출하지 않는다.
      schema:
        type: string
        minLength: 43
        maxLength: 43
        pattern: '^[A-Za-z0-9_-]{43}$'
        writeOnly: true
    RequestId:
      name: X-Request-ID
      in: header
      description: 요청 추적 ID. 없으면 서버가 만든다.
      schema:
        type: string
        maxLength: 128
        pattern: '^[A-Za-z0-9._-]+$'
    Activity:
      name: X-Passport-Activity
      in: header
      description: 사용자 명시적 동작으로 발생한 요청이면 `user`. 없으면 미사용 만료를 초기화하지 않는다(3.2).
      schema:
        type: string
        enum: [user]
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: 직전 응답의 `ETag`. 누락 시 `428`, 불일치 시 `412`.
      schema:
        type: string
    IfMatchOptional:
      name: If-Match
      in: header
      description: 기존 리소스를 바꿀 때 필수.
      schema:
        type: string
    IfNoneMatch:
      name: If-None-Match
      in: header
      description: 새로 만들 때 `*`.
      schema:
        type: string
        enum: ['*']
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      description: 접근 자격 변경 및 외부 보안 기록 대상 변경 API 필수(8장).
      schema:
        $ref: '#/components/schemas/IdempotencyKey'
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      description: 재시도 시 중복 생성 방지(8장).
      schema:
        $ref: '#/components/schemas/IdempotencyKey'
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      description: 직전 응답의 `next_cursor`.
      schema:
        type: string
        maxLength: 512
    Query:
      name: q
      in: query
      description: 대소문자 무시 부분 일치 검색(엔드포인트별 대상 필드).
      schema:
        type: string
        minLength: 2
        maxLength: 100
    TenantIdPath:
      name: tenant_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    TenantCodePath:
      name: tenant_code
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/TenantCode'
    MembershipIdPath:
      name: membership_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    UserIdPath:
      name: user_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ApplicationIdPath:
      name: application_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
  headers:
    OidcBrowserBindingCookie:
      description: 트랜잭션별 __Host-passport_oidc_<id>=<secret>; HttpOnly; Secure; SameSite=Lax; Path=/; Domain 없음. 만료는 트랜잭션과 같으며 콜백 종결 시 삭제한다.
      schema:
        type: string
    XRequestId:
      description: 요청 추적 ID
      schema:
        type: string
    ETag:
      description: 리소스 버전. 변경 요청의 `If-Match`에 쓴다.
      schema:
        type: string
        examples: ['"7"']
    IdempotencyReplayed:
      description: 같은 `Idempotency-Key`의 저장된 결과를 재생했으면 `true`.
      schema:
        type: string
        enum: ['true']
    NoStore:
      description: '`no-store`'
      schema:
        type: string
        const: no-store
    RetryAfter:
      description: 재시도까지 기다릴 초
      schema:
        type: integer
        minimum: 1
    SetSsoSessionCookie:
      description: '[제안] 브라우저의 불투명 SSO 세션 쿠키. __Host-passport_session=<opaque-id>; HttpOnly; Secure; SameSite=Lax;
        Path=/; Max-Age=<원래 로그인 잔여 초>'
      schema:
        type: string

    ClearSsoSessionCookie:
      description: '[제안] 브라우저의 불투명 SSO 세션 쿠키. __Host-passport_session=; HttpOnly; Secure; SameSite=Lax; Path=/;
        Max-Age=0'
      schema:
        type: string

  responses:
    Accepted:
      description: 접수됨(결과를 드러내지 않음)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AcceptedResponse'
    NoContent:
      description: 성공
    BadRequest:
      description: 잘못된 요청
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            idempotencyKeyRequired:
              value:
                type: urn:passport:problem:idempotency_key_required
                title: Idempotency-Key header is required
                status: 400
                code: idempotency_key_required
                request_id: req_01JBX4T9Q2
    InvalidTokenValue:
      description: 일회성 값(확인 토큰, 링크 티켓)이 없거나 만료·사용됨
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:passport:problem:invalid_token_value
            title: The token is invalid or expired
            status: 400
            code: invalid_token_value
            request_id: req_01JBX4T9Q2
    InvalidGrant:
      description: SSO 인가 코드가 없거나 만료·사용됨, 또는 client·`redirect_uri`·PKCE 불일치
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:passport:problem:invalid_grant
            title: The authorization code is invalid, expired, or already used
            status: 400
            code: invalid_grant
            request_id: req_01JBX4T9Q2
    Unauthorized:
      description: 인증 실패(`unauthenticated`, `invalid_token`, `token_revoked`, `login_expired`)
      headers:
        WWW-Authenticate:
          description: '`Bearer error="invalid_token"`'
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:passport:problem:token_revoked
            title: The access token has been revoked
            status: 401
            code: token_revoked
            request_id: req_01JBX4T9Q2
    InvalidCredentials:
      description: 이메일·비밀번호 불일치(계정 존재 여부 비공개)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:passport:problem:invalid_credentials
            title: Email or password is incorrect
            status: 401
            code: invalid_credentials
            request_id: req_01JBX4T9Q2
    RefreshUnauthorized:
      description: Refresh 실패(`refresh_token_invalid`, `refresh_token_reused`, `login_expired`, `token_revoked`).
        재로그인 필요
      headers: {}
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            reused:
              value:
                type: urn:passport:problem:refresh_token_reused
                title: Refresh token reuse detected; all logins were ended
                status: 401
                code: refresh_token_reused
                request_id: req_01JBX4T9Q2
            expired:
              value:
                type: urn:passport:problem:login_expired
                title: The login has expired
                status: 401
                code: login_expired
                detail: Idle timeout of 30 minutes exceeded.
                request_id: req_01JBX4T9Q2

    InvalidClient:
      description: 서비스 자격 증명 실패 또는 비활성 Application
      headers:
        WWW-Authenticate:
          description: '`Basic realm="passport-service"`'
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:passport:problem:invalid_client
            title: Client authentication failed
            status: 401
            code: invalid_client
            request_id: req_01JBX4T9Q2
    Forbidden:
      description: 권한 부족(`forbidden`, `tenant_access_denied`, `email_verification_required`, `self_action_forbidden`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:passport:problem:forbidden
            title: Platform administrator role is required
            status: 403
            code: forbidden
            request_id: req_01JBX4T9Q2
    LoginForbidden:
      description: 비밀번호는 맞지만 로그인할 수 없음
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            emailNotVerified:
              value:
                type: urn:passport:problem:email_verification_required
                title: Email verification is required
                status: 403
                code: email_verification_required
                request_id: req_01JBX4T9Q2
            accountInactive:
              value:
                type: urn:passport:problem:account_inactive
                title: The account is not active
                status: 403
                code: account_inactive
                request_id: req_01JBX4T9Q2
    TokenForbidden:
      description: 토큰 발급 조건 미충족(`tenant_access_denied`, `email_verification_required`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            oidcLoginRequired:
              value:
                type: urn:passport:problem:tenant_access_denied
                title: This login cannot access the tenant
                status: 403
                code: tenant_access_denied
                reason: oidc_login_required
                request_id: req_01JBX4T9Q2
            applicationNotEnabled:
              value:
                type: urn:passport:problem:tenant_access_denied
                title: The application is not enabled for this tenant
                status: 403
                code: tenant_access_denied
                reason: application_not_enabled
                request_id: req_01JBX4T9Q2

    TenantForbidden:
      description: 테넌트 범위 인가 실패(`tenant_context_mismatch`, `forbidden`, `self_action_forbidden`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            contextMismatch:
              value:
                type: urn:passport:problem:tenant_context_mismatch
                title: The token is scoped to a different tenant
                status: 403
                code: tenant_context_mismatch
                request_id: req_01JBX4T9Q2
            notAdmin:
              value:
                type: urn:passport:problem:forbidden
                title: Tenant administrator role is required
                status: 403
                code: forbidden
                request_id: req_01JBX4T9Q2

    ReauthenticationRequired:
      description: 최근 재인증 필요
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:passport:problem:reauthentication_required
            title: Recent re-authentication is required
            status: 403
            code: reauthentication_required
            accepted_methods: [password]
            request_id: req_01JBX4T9Q2
    NotFound:
      description: 없음 또는 접근 권한 밖(은닉)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:passport:problem:not_found
            title: Resource not found
            status: 404
            code: not_found
            request_id: req_01JBX4T9Q2
    Conflict:
      description: 상태 충돌(`conflict`, `already_exists`, `identity_already_linked`, `last_tenant_admin`, `local_credential_not_set`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            lastAdmin:
              value:
                type: urn:passport:problem:last_tenant_admin
                title: The tenant must keep at least one active administrator
                status: 409
                code: last_tenant_admin
                tenant_ids:
                - 0193a3c1-7c2e-7d11-9a40-5b1e2f3a4b5c
                request_id: req_01JBX4T9Q2
            identityLinked:
              value:
                type: urn:passport:problem:identity_already_linked
                title: The external identity is linked to another account
                status: 409
                code: identity_already_linked
                request_id: req_01JBX4T9Q2

    PreconditionFailed:
      description: '`If-Match` 불일치. 최신 리소스를 다시 조회한다.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:passport:problem:precondition_failed
            title: The resource has been modified
            status: 412
            code: precondition_failed
            request_id: req_01JBX4T9Q2
    PreconditionRequired:
      description: '`If-Match` 누락'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:passport:problem:precondition_required
            title: If-Match header is required
            status: 428
            code: precondition_required
            request_id: req_01JBX4T9Q2
    ValidationFailed:
      description: 입력 검증 실패(`validation_failed`, `idempotency_key_reused`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:passport:problem:validation_failed
            title: Request validation failed
            status: 422
            code: validation_failed
            request_id: req_01JBX4T9Q2
            errors:
              - field: password
                code: too_short
                message: Password must be at least 12 characters.
    TooManyRequests:
      description: 속도·실패 제한
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:passport:problem:too_many_requests
            title: Too many requests
            status: 429
            code: too_many_requests
            request_id: req_01JBX4T9Q2
    SecurityChangeUnavailable:
      description: access_sync_pending(Valkey 반영 미완료) 또는 security_record_pending(외부 보안 기록 미완료). db_committed로 DB 커밋 여부를 구분한다. 원 요청을 안전하게 재시도하며 탈퇴는 전용 완료 경로를 사용한다.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            cachePending:
              value:
                type: urn:passport:problem:access_sync_pending
                title: Change saved; cache synchronization is pending
                status: 503
                code: access_sync_pending
                db_committed: true
                cache_synced: false
                request_id: req_01JBX4T9Q2
            externalBeforeCommit:
              value:
                type: urn:passport:problem:security_record_pending
                title: External security record unavailable; DB change rolled back
                status: 503
                code: security_record_pending
                db_committed: false
                security_recorded: false
                request_id: req_security_before
            externalAfterCommit:
              value:
                type: urn:passport:problem:security_record_pending
                title: DB change saved; external commit confirmation is pending
                status: 503
                code: security_record_pending
                db_committed: true
                security_recorded: false
                request_id: req_security_after
    EntitlementUnverifiable:
      description: 접근 자격 최신 상태 확인 불가(FR-APP-008-03). 요청을 거부하되 로그인은 유지한다.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:passport:problem:entitlement_unverifiable
            title: Access entitlement cannot be verified right now
            status: 503
            code: entitlement_unverifiable
            request_id: req_01JBX4T9Q2
    IdpUnavailable:
      description: 외부 Provider 상태 확인 불가 또는 통신 오류
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:passport:problem:idp_status_unavailable
            title: The identity provider status cannot be confirmed
            status: 503
            code: idp_status_unavailable
            request_id: req_01JBX4T9Q2
    TokenUnavailable:
      description: 발급 일시 불가(`entitlement_unverifiable`, `idp_status_unavailable`). 로그인과 Refresh Token은 유지된다.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:passport:problem:entitlement_unverifiable
            title: Access entitlement cannot be verified right now
            status: 503
            code: entitlement_unverifiable
            request_id: req_01JBX4T9Q2


    SsoUnauthorized:
      description: SSO 세션 없음·만료·무효화. 새 로그인이 필요하며 쿠키만으로 철회·접근 자격 검사를 우회하지 않는다.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Set-Cookie:
          $ref: '#/components/headers/ClearSsoSessionCookie'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:passport:problem:unauthenticated
            title: SSO login is required
            status: 401
            code: unauthenticated
            request_id: req_sso_login

  examples:
    TokenResponseWeb:
      summary: SSO 서버가 받는 웹 로그인 토큰(브라우저 응답 아님)
      value:
        access_token: eyJhbGciOiJFUzI1NiIsInR5cCI6ImF0K2p3dCIsImtpZCI6IjIwMjYtMTAifQ.eyJpc3MiOiJodHRwczovL3Bhc3Nwb3J0LmV4YW1wbGUuY29tIn0.sig
        token_type: Bearer
        expires_in: 1800
        audience: passport
        tenant_id: null
        login:
          login_id: 0193a3d0-1111-7aaa-8bbb-0c0d0e0f1011
          auth_method: local
          client_type: web
          authenticated_at: '2026-10-31T09:00:00Z'
          expires_at: '2026-10-31T17:00:00Z'
          idle_expires_at: '2026-10-31T09:30:00Z'
        refresh_token: prt_sso_server_secret

    TokenResponseNative:
      summary: 네이티브 로그인(Refresh Token은 본문)
      value:
        access_token: eyJhbGciOiJFUzI1NiIsInR5cCI6ImF0K2p3dCIsImtpZCI6IjIwMjYtMTAifQ.eyJpc3MiOiJodHRwczovL3Bhc3Nwb3J0LmV4YW1wbGUuY29tIn0.sig
        token_type: Bearer
        expires_in: 1800
        audience: passport
        tenant_id: null
        refresh_token: prt_6h2kD9sQ0vYxZ1uN4mB7cL3aE8fR5tW
        login:
          login_id: 0193a3d0-2222-7aaa-8bbb-0c0d0e0f1011
          auth_method: local
          client_type: native
          authenticated_at: '2026-10-31T09:00:00Z'
          expires_at: '2026-11-07T09:00:00Z'
          idle_expires_at: '2026-11-03T09:00:00Z'
    TokenResponseTenant:
      summary: SSO 서버가 보관하는 테넌트 토큰
      value:
        access_token: eyJhbGciOiJFUzI1NiIsInR5cCI6ImF0K2p3dCIsImtpZCI6IjIwMjYtMTAifQ.eyJ0ZW5hbnRfaWQiOiIuLi4ifQ.sig
        token_type: Bearer
        expires_in: 1800
        audience: passport
        tenant_id: 0193a3c1-7c2e-7d11-9a40-5b1e2f3a4b5c
        login:
          login_id: 0193a3d0-1111-7aaa-8bbb-0c0d0e0f1011
          auth_method: local
          client_type: web
          authenticated_at: '2026-10-31T09:00:00Z'
          expires_at: '2026-10-31T17:00:00Z'
          idle_expires_at: '2026-10-31T09:41:12Z'
        refresh_token: prt_sso_server_rotated_secret

    VerifyAllowFresh:
      summary: 허용, 캐시 최신
      value:
        decision: allow
        cache_status: fresh
        user_id: 0193a3b0-aaaa-7bbb-8ccc-0d0e0f101112
        tenant_id: 0193a3c1-7c2e-7d11-9a40-5b1e2f3a4b5c
        versions:
          tenant: 7
          membership: 3
          tenant_application: 2
        auth_context:
          sid: 0193a3d0-1111-7aaa-8bbb-0c0d0e0f1011
          auth_method: oidc
          oidc_config_id: 0193a3c9-5555-7aaa-8bbb-0c0d0e0f1011
          external_issuer: https://idp.acme.example/realms/acme
          auth_time: '2026-10-31T09:00:00Z'
          client_id: papyrus
        token:
          jti: 0193a3e0-3333-7aaa-8bbb-0c0d0e0f1011
          exp: '2026-10-31T09:30:00Z'
        verified_at: '2026-10-31T09:12:03Z'

    VerifyAllowStale:
      summary: 허용, 캐시 갱신 필요
      value:
        decision: allow
        cache_status: stale
        user_id: 0193a3b0-aaaa-7bbb-8ccc-0d0e0f101112
        tenant_id: 0193a3c1-7c2e-7d11-9a40-5b1e2f3a4b5c
        versions:
          tenant: 7
          membership: 4
          tenant_application: 2
        auth_context:
          sid: 0193a3d0-1111-7aaa-8bbb-0c0d0e0f1011
          auth_method: local
          oidc_config_id: null
          external_issuer: null
          auth_time: '2026-10-31T09:00:00Z'
          client_id: papyrus
        entitlement:
          user:
            user_id: 0193a3b0-aaaa-7bbb-8ccc-0d0e0f101112
            email: kim@acme.example
            display_name: Kim
          tenant:
            tenant_id: 0193a3c1-7c2e-7d11-9a40-5b1e2f3a4b5c
            code: acme
            name: ACME Research
            status: active
          membership:
            membership_id: 0193a3c5-4444-7aaa-8bbb-0c0d0e0f1011
            role: admin
            status: active
          tenant_application:
            status: active
        token:
          jti: 0193a3e0-3333-7aaa-8bbb-0c0d0e0f1011
          exp: '2026-10-31T09:30:00Z'
        verified_at: '2026-10-31T09:12:03Z'

    VerifyDenyMembership:
      summary: 거부, 멤버십 해지
      value:
        decision: deny
        deny_reason: membership_inactive
        suggested_status: 403
        user_id: 0193a3b0-aaaa-7bbb-8ccc-0d0e0f101112
        tenant_id: 0193a3c1-7c2e-7d11-9a40-5b1e2f3a4b5c
        verified_at: '2026-10-31T09:12:03Z'

  schemas:
    # ---------- 공통 값 ----------
    Uuid:
      type: string
      format: uuid
      examples: [0193a3c1-7c2e-7d11-9a40-5b1e2f3a4b5c]
    Timestamp:
      type: string
      format: date-time
      examples: ['2026-10-31T09:00:00Z']
    Email:
      type: string
      format: email
      maxLength: 254
      description: 비교·유일성 판단은 소문자 정규화 후 수행한다.
      examples: [kim@acme.example]
    Password:
      type: string
      minLength: 12
      maxLength: 128
      writeOnly: true
      description: '**[제안]** 12~128자, 조합 규칙 없음, 이메일과 같은 값 금지.'
    DisplayName:
      type: string
      minLength: 1
      maxLength: 50
      description: 앞뒤 공백 제거 후 1~50자, 제어 문자 금지. 실명일 필요 없음(FR-USER-002).
      examples: [Kim]
    Phone:
      type: string
      pattern: '^\+[1-9][0-9]{6,14}$'
      description: E.164 형식
      examples: ['+821012345678']
    RealName:
      type: string
      minLength: 1
      maxLength: 100
      examples: [김하늘]
    TenantCode:
      type: string
      minLength: 3
      maxLength: 32
      pattern: '^[a-z0-9](?:[a-z0-9-]{1,30}[a-z0-9])$'
      description: '**[제안]** 소문자·숫자·하이픈. 로그인 링크·코드 입력용. 생성 후 변경 불가.'
      examples: [acme]
    TenantName:
      type: string
      minLength: 1
      maxLength: 100
      examples: [ACME Research]
    ApplicationCode:
      type: string
      minLength: 3
      maxLength: 32
      pattern: '^[a-z][a-z0-9-]{1,30}[a-z0-9]$'
      not:
        const: passport
      description: Access Token `aud`와 서비스 `client_id`로 쓴다. `passport`는 예약어.
      examples: [papyrus]
    Audience:
      type: string
      minLength: 3
      maxLength: 32
      pattern: '^[a-z][a-z0-9-]{1,30}[a-z0-9]$'
      description: '`passport` 또는 Application `code`'
      examples: [passport, papyrus]
    Reason:
      type: string
      minLength: 1
      maxLength: 500
    IdempotencyKey:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[A-Za-z0-9._:-]+$'
      examples: [5f0c2a8e-2d0b-4b6f-9a51-7f1c3c9d2e44]
    NextCursor:
      type: [string, 'null']
      description: 다음 페이지 커서. 마지막 페이지면 `null`.
    AcceptedResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: accepted

    # ---------- 오류 ----------
    ErrorCode:
      type: string
      enum:
      - invalid_request
      - invalid_token_value
      - invalid_grant
      - idempotency_key_required
      - unauthenticated
      - invalid_token
      - token_revoked
      - login_expired
      - invalid_credentials
      - refresh_token_invalid
      - refresh_token_reused
      - invalid_client
      - forbidden
      - email_verification_required
      - account_inactive
      - tenant_access_denied
      - tenant_context_mismatch
      - reauthentication_required
      - self_action_forbidden
      - not_found
      - conflict
      - already_exists
      - identity_already_linked
      - last_tenant_admin
      - local_credential_not_set
      - precondition_failed
      - validation_failed
      - idempotency_key_reused
      - precondition_required
      - too_many_requests
      - access_sync_pending
      - security_record_pending
      - entitlement_unverifiable
      - idp_status_unavailable
      - oidc_provider_error

    TenantAccessDeniedReason:
      type: string
      enum: [not_a_member, membership_inactive, tenant_inactive, application_not_enabled, oidc_login_required, oidc_configuration_unavailable]
    SsoAuthorizationError:
      type: string
      description: '`ssoAuthorize`가 SaaS SSO callback으로 돌려보내는 오류'
      enum: [invalid_request, access_denied, tenant_access_denied, no_eligible_tenant, temporarily_unavailable, server_error]
    Problem:
      type: object
      description: RFC 9457 Problem Details. 아래 확장 필드는 해당 `code`에서만 나타난다.
      required:
      - type
      - title
      - status
      - code
      - request_id
      properties:
        type:
          type: string
          description: '`urn:passport:problem:{code}`'
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          $ref: '#/components/schemas/ErrorCode'
        request_id:
          type: string
        errors:
          type: array
          description: '`validation_failed`의 필드별 오류'
          items:
            $ref: '#/components/schemas/FieldError'
        reason:
          $ref: '#/components/schemas/TenantAccessDeniedReason'
        accepted_methods:
          type: array
          description: '`reauthentication_required`에서 인정하는 재인증 방식'
          items:
            type: string
            enum:
            - password
            - oidc
        db_committed:
          type: boolean
          description: 보안 변경 오류의 DB 커밋 여부. access_sync_pending에서는 항상 true
        cache_synced:
          type: boolean
          description: access_sync_pending에서는 false. 외부 기록 오류에는 Valkey 반영을 시도한 경우만 포함
        security_recorded:
          type: boolean
          description: security_record_pending에서는 false. 외부 변경 의도 또는 커밋 확인의 영속화 미완료
        tenant_ids:
          type: array
          description: '`last_tenant_admin`의 대상 테넌트'
          items:
            $ref: '#/components/schemas/Uuid'

    FieldError:
      type: object
      required: [field, code]
      properties:
        field:
          type: string
          description: 점 표기 경로(예 `sso_redirect_uris.0`)
        code:
          type: string
          description: '`required`, `too_short`, `too_long`, `invalid_format`, `mismatch`, `not_allowed` 등'
        message:
          type: string
    ClientType:
      type: string
      enum:
      - web
      - native
      description: '`web`은 SSO 서버 측 토큰 보관(8시간·미사용 30분), `native`는 직접 토큰 사용(7일·미사용 3일)'

    SignupRequest:
      type: object
      additionalProperties: false
      required: [email, password, display_name]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          $ref: '#/components/schemas/Password'
        display_name:
          $ref: '#/components/schemas/DisplayName'
      examples:
        - email: kim@acme.example
          password: correct-horse-battery-staple
          display_name: Kim
    EmailVerificationConfirmRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          minLength: 16
          maxLength: 256
          writeOnly: true
    EmailVerificationResendRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          $ref: '#/components/schemas/Email'
    LocalLoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
          description: 로그인에서는 정책 길이를 검사하지 않는다(기존 비밀번호 호환).
        client_type:
          $ref: '#/components/schemas/ClientType'
      examples:
        - email: kim@acme.example
          password: correct-horse-battery-staple
          client_type: web
    TokenRequest:
      type: object
      additionalProperties: false
      properties:
        refresh_token:
          type: string
          maxLength: 512
          writeOnly: true
          description: SSO 서버 또는 직접 클라이언트의 Refresh Token. 브라우저 쿠키로 받지 않는다. web 로그인의 경우 SSO client 인증·연결 검증이 필수다.
        audience:
          $ref: '#/components/schemas/Audience'
        tenant_id:
          $ref: '#/components/schemas/Uuid'
      description: '`audience` 기본값은 `passport`. `passport`가 아닌 `audience`는 `tenant_id`가 필수다.'
      required:
      - refresh_token

    LoginInfo:
      type: object
      required: [login_id, auth_method, client_type, authenticated_at, expires_at, idle_expires_at]
      properties:
        login_id:
          $ref: '#/components/schemas/Uuid'
        auth_method:
          type: string
          enum: [local, oidc]
        client_type:
          $ref: '#/components/schemas/ClientType'
        authenticated_at:
          $ref: '#/components/schemas/Timestamp'
        expires_at:
          $ref: '#/components/schemas/Timestamp'
        idle_expires_at:
          $ref: '#/components/schemas/Timestamp'
        oidc_tenant_id:
          type: [string, 'null']
          format: uuid
          description: OIDC 로그인의 대상 테넌트
    TokenResponse:
      type: object
      required:
      - access_token
      - token_type
      - expires_in
      - audience
      - tenant_id
      - login
      - refresh_token
      properties:
        access_token:
          type: string
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
          const: 1800
        audience:
          $ref: '#/components/schemas/Audience'
        tenant_id:
          type:
          - string
          - 'null'
          format: uuid
        refresh_token:
          type: string
          description: SSO 서버 또는 직접 API 클라이언트에만 반환한다. 브라우저 SSO 응답에 포함하지 않는다.
        login:
          $ref: '#/components/schemas/LoginInfo'

    PasswordReauthRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
    Jwk:
      type: object
      required: [kty, kid, use, alg]
      properties:
        kty:
          type: string
          examples: [EC]
        kid:
          type: string
        use:
          type: string
          const: sig
        alg:
          type: string
          examples: [ES256]
        crv:
          type: string
        x:
          type: string
        y:
          type: string
        n:
          type: string
        e:
          type: string
    Jwks:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            $ref: '#/components/schemas/Jwk'
      examples:
        - keys:
            - kty: EC
              kid: '2026-10'
              use: sig
              alg: ES256
              crv: P-256
              x: f83OJ3D2xF1Bg8vub9tLe1gHMzV76e8Tus9uPHvRVEU
              y: x_FEzRu9m36HLN_tue659LNpXW6pCyStikYjKIWI5a0

    # ---------- OIDC ----------
    TenantLoginOptions:
      type: object
      required: [tenant_id, tenant_code, tenant_name, oidc]
      properties:
        tenant_id:
          $ref: '#/components/schemas/Uuid'
        tenant_code:
          $ref: '#/components/schemas/TenantCode'
        tenant_name:
          $ref: '#/components/schemas/TenantName'
        oidc:
          type: object
          required: [available]
          properties:
            available:
              type: boolean
            provider_display_name:
              type: [string, 'null']
              examples: [ACME SSO]
    OidcAuthorizationRequest:
      type: object
      additionalProperties: false
      required:
      - intent
      - return_to
      properties:
        intent:
          type: string
          enum:
          - login
          - link
          - reauth
        return_to:
          type: string
          format: uri
          maxLength: 2048
          description: 등록된 Passport SSO 완료 URI와 정확히 일치해야 한다. SaaS의 임의 URL로 외부 인증 결과·링크 티켓을 전달하지 않는다.
        client_type:
          type: string
          const: web
          description: P0의 OIDC는 웹만 지원
      examples:
      - intent: login
        return_to: https://passport.example.com/login/callback
        client_type: web

    OidcAuthorization:
      type: object
      required: [authorization_url, expires_at]
      properties:
        authorization_url:
          type: string
          format: uri
          examples: ['https://idp.acme.example/realms/acme/protocol/openid-connect/auth?response_type=code&client_id=passport&redirect_uri=https%3A%2F%2Fpassport.example.com%2Fsso%2Fauth%2Foidc%2Fcallback%2F0193a3c1-7c2e-7d11-9a40-5b1e2f3a4b5c&scope=openid%20email%20profile&state=st_x&nonce=n_y&code_challenge=cc_z&code_challenge_method=S256']
        expires_at:
          $ref: '#/components/schemas/Timestamp'

    # ---------- 사용자 ----------
    UserStatus:
      type: string
      enum: [pending_verification, active, suspended, deactivated]
    UserSelf:
      type: object
      required: [user_id, status, email, email_verified, display_name, fist_name, last_name, platform_roles, created_at]
      properties:
        user_id:
          $ref: '#/components/schemas/Uuid'
        status:
          $ref: '#/components/schemas/UserStatus'
        email:
          $ref: '#/components/schemas/Email'
        email_verified:
          type: boolean
        display_name:
          $ref: '#/components/schemas/DisplayName'
        fist_name:
          type: [string, 'null']
          maxLength: 50
          description: 선택 실명 항목인 이름. 요청한 필드명을 그대로 사용한다
        last_name:
          type: [string, 'null']
          maxLength: 50
          description: 선택 실명 항목인 성
        platform_roles:
          type: array
          items:
            type: string
            enum: [platform_admin]
        created_at:
          $ref: '#/components/schemas/Timestamp'
      examples:
        - user_id: 0193a3b0-aaaa-7bbb-8ccc-0d0e0f101112
          status: active
          email: kim@acme.example
          email_verified: true
          display_name: Kim
          fist_name: 하늘
          last_name: 김
          platform_roles: []
          created_at: '2026-10-01T02:00:00Z'
    UserUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        display_name:
          $ref: '#/components/schemas/DisplayName'
        fist_name:
          type: [string, 'null']
          minLength: 1
          maxLength: 50
          description: 이름. null이면 삭제
        last_name:
          type: [string, 'null']
          minLength: 1
          maxLength: 50
          description: 성. null이면 삭제
      examples:
        - display_name: Haneul
          fist_name: 하늘
          last_name: 김
    PasswordChangeRequest:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
        new_password:
          $ref: '#/components/schemas/Password'
    WithdrawalRequest:
      type: object
      additionalProperties: false
      required: [confirm]
      properties:
        confirm:
          type: boolean
          const: true
          description: 탈퇴 확정 의사. 취소·복구 불가 안내 후 받는다.
    TenantAccess:
      type: object
      required:
      - status
      description: 현재 로그인 기준 안내용 판정
      properties:
        status:
          type: string
          enum:
          - allowed
          - oidc_login_required
          - tenant_inactive
          - membership_inactive

    MyTenant:
      type: object
      required: [tenant_id, code, name, tenant_status, membership_id, role, membership_status, access]
      properties:
        tenant_id:
          $ref: '#/components/schemas/Uuid'
        code:
          $ref: '#/components/schemas/TenantCode'
        name:
          $ref: '#/components/schemas/TenantName'
        tenant_status:
          $ref: '#/components/schemas/TenantStatus'
        membership_id:
          $ref: '#/components/schemas/Uuid'
        role:
          $ref: '#/components/schemas/TenantRole'
        membership_status:
          $ref: '#/components/schemas/MembershipStatus'
        joined_at:
          type: [string, 'null']
          format: date-time
        access:
          $ref: '#/components/schemas/TenantAccess'
    MyTenantPage:
      type: object
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MyTenant'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
      examples:
      - items:
        - tenant_id: 0193a3c1-7c2e-7d11-9a40-5b1e2f3a4b5c
          code: acme
          name: ACME Research
          tenant_status: active
          membership_id: 0193a3c5-4444-7aaa-8bbb-0c0d0e0f1011
          role: admin
          membership_status: active
          joined_at: '2026-10-02T00:00:00Z'
          access:
            status: allowed
        next_cursor: null

    Identity:
      type: object
      required: [identity_id, type, linked_at]
      properties:
        identity_id:
          $ref: '#/components/schemas/Uuid'
        type:
          type: string
          enum: [local, oidc]
        email:
          type: [string, 'null']
          description: '`local`의 로그인 이메일'
        tenant_id:
          type: [string, 'null']
          format: uuid
          description: '`oidc`가 연결된 테넌트 OIDC 설정의 테넌트'
        oidc_config_id:
          type: [string, 'null']
          format: uuid
        issuer:
          type: [string, 'null']
          format: uri
        subject:
          type: [string, 'null']
          maxLength: 255
        provider_display_name:
          type: [string, 'null']
        linked_at:
          $ref: '#/components/schemas/Timestamp'
        last_used_at:
          type: [string, 'null']
          format: date-time
    LinkIdentityRequest:
      type: object
      additionalProperties: false
      required: [link_ticket, confirm]
      properties:
        link_ticket:
          type: string
          minLength: 16
          maxLength: 256
          writeOnly: true
        confirm:
          type: boolean
          const: true

    TenantStatus:
      type: string
      enum: [active, suspended, deactivated]
    TenantRole:
      type: string
      enum: [admin, member]
    TenantCreateRequest:
      type: object
      additionalProperties: false
      required: [code, name]
      properties:
        code:
          $ref: '#/components/schemas/TenantCode'
        name:
          $ref: '#/components/schemas/TenantName'
      examples:
        - code: acme
          name: ACME Research
    TenantUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          $ref: '#/components/schemas/TenantName'
    Tenant:
      type: object
      required:
      - tenant_id
      - code
      - name
      - status
      - created_at
      - updated_at
      properties:
        tenant_id:
          $ref: '#/components/schemas/Uuid'
        code:
          $ref: '#/components/schemas/TenantCode'
        name:
          $ref: '#/components/schemas/TenantName'
        status:
          $ref: '#/components/schemas/TenantStatus'
        my_role:
          description: 호출자의 역할. 플랫폼 관리자 API에서는 `null`.
          anyOf:
          - $ref: '#/components/schemas/TenantRole'
          - type: 'null'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
      examples:
      - tenant_id: 0193a3c1-7c2e-7d11-9a40-5b1e2f3a4b5c
        code: acme
        name: ACME Research
        status: active
        my_role: admin
        created_at: '2026-10-02T00:00:00Z'
        updated_at: '2026-10-02T00:00:00Z'

    TenantPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Tenant'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
    TenantStatusUpdate:
      type: object
      additionalProperties: false
      required: [status, reason]
      properties:
        status:
          $ref: '#/components/schemas/TenantStatus'
        reason:
          $ref: '#/components/schemas/Reason'
    OidcProviderType:
      type: string
      enum: [keycloak, auth0]
      description: 초기 연동·검증 대상(FR-OIDC-001)
    MemberProvisioning:
      type: string
      enum: [manual, auto]
      default: manual
      description: OIDC 최초 인증 사용자의 소속 부여 방식. 기본 `manual`은 계정 생성 후 관리자가 `user_id`로 추가하며, `auto`는 이전 멤버십이 없는 사용자를 일반 구성원으로 자동 등록한다(D-08).
    OidcConfigurationWrite:
      type: object
      additionalProperties: false
      required:
      - provider_type
      - display_name
      - issuer
      - client_id
      - member_provisioning
      - status
      properties:
        provider_type:
          $ref: '#/components/schemas/OidcProviderType'
        display_name:
          type: string
          minLength: 1
          maxLength: 100
        issuer:
          type: string
          format: uri
          maxLength: 2048
          pattern: ^https://
        client_id:
          type: string
          minLength: 1
          maxLength: 255
        client_secret:
          type: string
          minLength: 1
          maxLength: 1024
          writeOnly: true
          description: 생성과 `issuer`·`client_id` 변경 시 필수. 생략하면 기존 값 유지
        scopes:
          type: array
          maxItems: 20
          items:
            type: string
            pattern: ^[\x21\x23-\x5B\x5D-\x7E]+$
          description: '`openid` 필수. 기본 `[openid, email, profile]`'
        member_provisioning:
          $ref: '#/components/schemas/MemberProvisioning'
        status:
          type: string
          enum:
          - enabled
          - disabled
      examples:
      - provider_type: keycloak
        display_name: ACME SSO
        issuer: https://idp.acme.example/realms/acme
        client_id: passport
        client_secret: s3cr3t-from-keycloak
        scopes:
        - openid
        - email
        - profile
        member_provisioning: manual
        status: enabled

    OidcConfiguration:
      type: object
      required:
      - oidc_config_id
      - tenant_id
      - provider_type
      - display_name
      - issuer
      - client_id
      - client_secret_set
      - scopes
      - member_provisioning
      - status
      - redirect_uri
      - trust_version
      - last_validation
      - created_at
      - updated_at
      properties:
        oidc_config_id:
          $ref: '#/components/schemas/Uuid'
        tenant_id:
          $ref: '#/components/schemas/Uuid'
        provider_type:
          $ref: '#/components/schemas/OidcProviderType'
        display_name:
          type: string
        issuer:
          type: string
          format: uri
        client_id:
          type: string
        client_secret_set:
          type: boolean
        scopes:
          type: array
          items:
            type: string
        member_provisioning:
          $ref: '#/components/schemas/MemberProvisioning'
        status:
          type: string
          enum:
          - enabled
          - disabled
        redirect_uri:
          type: string
          format: uri
          readOnly: true
          description: IdP 클라이언트에 등록할 Redirect URI(`/sso/auth/oidc/callback/{tenant_id}`)
        trust_version:
          type: integer
          minimum: 1
          description: 신뢰 변경마다 증가. 이 값이 바뀌면 기존 OIDC 로그인 무효
        last_validation:
          type: object
          required:
          - status
          - checked_at
          properties:
            status:
              type: string
              enum:
              - ok
              - failed
            checked_at:
              $ref: '#/components/schemas/Timestamp'
            error_code:
              type:
              - string
              - 'null'
              enum:
              - discovery_unreachable
              - issuer_mismatch
              - jwks_unreachable
              - invalid_client
              - unsupported_lifecycle_binding
              - null
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'

    OidcConfigurationChangeResult:
      allOf:
        - $ref: '#/components/schemas/OidcConfiguration'
        - type: object
          required: [trust_changed]
          properties:
            trust_changed:
              type: boolean
              description: '`true`면 이 설정에 근거한 기존 OIDC 로그인과 토큰이 무효화되었다.'

    # ---------- 멤버 ----------
    MembershipStatus:
      type: string
      enum: [active, suspended, removed]
    MemberCreateRequest:
      type: object
      additionalProperties: false
      required: [user_id]
      properties:
        user_id:
          $ref: '#/components/schemas/Uuid'
        role:
          $ref: '#/components/schemas/TenantRole'
          default: member
      examples:
        - user_id: 0195f000-0000-7000-8000-000000000001
          role: member
    MemberUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        role:
          $ref: '#/components/schemas/TenantRole'
        status:
          type: string
          enum: [active, suspended]
    MemberAdminView:
      type: object
      required:
      - view
      - membership_id
      - user_id
      - role
      - status
      - email
      - display_name
      - fist_name
      - last_name
      - joined_at
      - created_at
      - updated_at
      - etag
      properties:
        view:
          type: string
          const: admin
        membership_id:
          $ref: '#/components/schemas/Uuid'
        user_id:
          $ref: '#/components/schemas/Uuid'
        role:
          $ref: '#/components/schemas/TenantRole'
        status:
          $ref: '#/components/schemas/MembershipStatus'
        email:
          $ref: '#/components/schemas/Email'
        display_name:
          type:
          - string
          - 'null'
        fist_name:
          type:
          - string
          - 'null'
          maxLength: 50
          description: 이름
        last_name:
          type:
          - string
          - 'null'
          maxLength: 50
          description: 성
        joined_at:
          type:
          - string
          - 'null'
          format: date-time
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
        etag:
          type: string
          description: 목록에서 바로 변경할 때 `If-Match`에 쓴다
      examples:
      - view: admin
        membership_id: 0193a3c5-4444-7aaa-8bbb-0c0d0e0f1011
        user_id: 0193a3b0-aaaa-7bbb-8ccc-0d0e0f101112
        role: member
        status: active
        email: kim@acme.example
        display_name: Kim
        fist_name: 하늘
        last_name: 김
        joined_at: '2026-10-02T00:00:00Z'
        created_at: '2026-10-01T00:00:00Z'
        updated_at: '2026-10-02T00:00:00Z'
        etag: '"3"'

    MemberPeerView:
      type: object
      required: [view, membership_id, user_id, role, display_name]
      properties:
        view:
          type: string
          const: peer
        membership_id:
          $ref: '#/components/schemas/Uuid'
        user_id:
          $ref: '#/components/schemas/Uuid'
        role:
          $ref: '#/components/schemas/TenantRole'
        display_name:
          $ref: '#/components/schemas/DisplayName'
    MemberView:
      oneOf:
        - $ref: '#/components/schemas/MemberAdminView'
        - $ref: '#/components/schemas/MemberPeerView'
      discriminator:
        propertyName: view
        mapping:
          admin: '#/components/schemas/MemberAdminView'
          peer: '#/components/schemas/MemberPeerView'
    MemberPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MemberView'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'

    # ---------- 테넌트 서비스 ----------
    TenantApplicationListStatus:
      type: string
      enum: [active, inactive, not_enabled]
    TenantApplicationWrite:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [active, inactive]
    TenantApplication:
      type: object
      required: [tenant_id, application_id, code, name, status, updated_at, etag]
      properties:
        tenant_id:
          $ref: '#/components/schemas/Uuid'
        application_id:
          $ref: '#/components/schemas/Uuid'
        code:
          $ref: '#/components/schemas/ApplicationCode'
        name:
          type: string
        status:
          $ref: '#/components/schemas/TenantApplicationListStatus'
        updated_at:
          type: [string, 'null']
          format: date-time
        etag:
          type: [string, 'null']
          description: '`not_enabled`면 `null`(처음 활성화는 `If-None-Match: *`)'
      examples:
        - tenant_id: 0193a3c1-7c2e-7d11-9a40-5b1e2f3a4b5c
          application_id: 0193a3a0-9999-7aaa-8bbb-0c0d0e0f1011
          code: papyrus
          name: Papyrus
          status: active
          updated_at: '2026-10-03T00:00:00Z'
          etag: '"2"'
    TenantApplicationPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TenantApplication'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'

    # ---------- 플랫폼 관리자 ----------
    PlatformUserView:
      type: object
      required: [user_id, email, display_name, status, created_at]
      description: 플랫폼 관리자 열람 범위(이메일·표시 이름). 이름·성 없음
      properties:
        user_id:
          $ref: '#/components/schemas/Uuid'
        email:
          $ref: '#/components/schemas/Email'
        display_name:
          $ref: '#/components/schemas/DisplayName'
        status:
          $ref: '#/components/schemas/UserStatus'
        created_at:
          $ref: '#/components/schemas/Timestamp'
    PlatformUserPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PlatformUserView'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
    UserStatusUpdate:
      type: object
      additionalProperties: false
      required: [status, reason]
      properties:
        status:
          type: string
          enum: [active, suspended, deactivated]
        reason:
          $ref: '#/components/schemas/Reason'
    ApplicationStatus:
      type: string
      enum: [active, inactive]
    Application:
      type: object
      required:
      - application_id
      - code
      - client_id
      - name
      - status
      - created_at
      - updated_at
      - secret_rotated_at
      properties:
        application_id:
          $ref: '#/components/schemas/Uuid'
        code:
          $ref: '#/components/schemas/ApplicationCode'
        client_id:
          type: string
          description: '`code`와 같다'
        name:
          type: string
          minLength: 1
          maxLength: 100
        status:
          $ref: '#/components/schemas/ApplicationStatus'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
        secret_rotated_at:
          $ref: '#/components/schemas/Timestamp'
        sso_redirect_uris:
          type: array
          items:
            type: string
            format: uri
          description: SSO client에 등록한 정확한 callback URI. 와일드카드·임의 목적지는 허용하지 않는다.

    ApplicationPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Application'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
    ApplicationCreateRequest:
      type: object
      additionalProperties: false
      required:
      - code
      - name
      properties:
        code:
          $ref: '#/components/schemas/ApplicationCode'
        name:
          type: string
          minLength: 1
          maxLength: 100
        sso_redirect_uris:
          type: array
          items:
            type: string
            format: uri
          description: SSO client에 등록한 정확한 callback URI. 와일드카드·임의 목적지는 허용하지 않는다.
      examples:
      - code: papyrus
        name: Papyrus
        sso_redirect_uris:
        - https://papyrus.example.com/sso/auth/callback

    ApplicationUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        status:
          $ref: '#/components/schemas/ApplicationStatus'
        sso_redirect_uris:
          type: array
          items:
            type: string
            format: uri
          description: SSO client에 등록한 정확한 callback URI. 와일드카드·임의 목적지는 허용하지 않는다.

    ApplicationSecret:
      type: object
      required: [client_id, client_secret, previous_secret_valid_until]
      properties:
        client_id:
          type: string
        client_secret:
          type: string
          description: 이 응답에서만 반환
        previous_secret_valid_until:
          type: [string, 'null']
          format: date-time
    ApplicationWithSecret:
      allOf:
        - $ref: '#/components/schemas/Application'
        - type: object
          required: [client_secret]
          properties:
            client_secret:
              type: string
              description: 이 응답에서만 반환
    SecretRotationRequest:
      type: object
      additionalProperties: false
      properties:
        revoke_previous:
          type: boolean
          default: false

    # ---------- 서비스(SaaS) ----------
    AccessVersions:
      type: object
      additionalProperties: false
      required: [tenant, membership, tenant_application]
      description: FR-APP-008-05의 세 단위 버전
      properties:
        tenant:
          type: integer
          minimum: 0
        membership:
          type: integer
          minimum: 0
        tenant_application:
          type: integer
          minimum: 0
    AccessVerifyRequest:
      type: object
      additionalProperties: false
      required: [access_token, user_activity]
      properties:
        access_token:
          type: string
          maxLength: 8192
          writeOnly: true
          description: 사용자가 SaaS에 제시한 Passport Access Token 원문
        user_activity:
          type: boolean
          description: 사용자 명시적 동작으로 발생한 요청이면 `true`(FR-AUTH-009-03-03/06)
        cached_versions:
          $ref: '#/components/schemas/AccessVersions'
    AuthContext:
      type: object
      required:
      - sid
      - auth_method
      - oidc_config_id
      - external_issuer
      - auth_time
      - client_id
      description: 공통 내부 인증 정보 중 SaaS에 제공하는 부분(FR-AUTH-008-04)
      properties:
        sid:
          $ref: '#/components/schemas/Uuid'
        auth_method:
          type: string
          enum:
          - local
          - oidc
        oidc_config_id:
          type:
          - string
          - 'null'
          format: uuid
        external_issuer:
          type:
          - string
          - 'null'
          format: uri
          description: 원본 외부 발급자. Passport 토큰 `iss`와 구분
        auth_time:
          $ref: '#/components/schemas/Timestamp'
        client_id:
          type: string

    ServiceUserView:
      type: object
      required: [user_id, email, display_name]
      description: 연동 SaaS 제공 필드(FR-USER-002-02)
      properties:
        user_id:
          $ref: '#/components/schemas/Uuid'
        email:
          $ref: '#/components/schemas/Email'
        display_name:
          $ref: '#/components/schemas/DisplayName'
    ServiceTenant:
      type: object
      required: [tenant_id, code, name, status]
      properties:
        tenant_id:
          $ref: '#/components/schemas/Uuid'
        code:
          $ref: '#/components/schemas/TenantCode'
        name:
          $ref: '#/components/schemas/TenantName'
        status:
          $ref: '#/components/schemas/TenantStatus'
    Entitlement:
      type: object
      required: [user, tenant, membership, tenant_application]
      properties:
        user:
          $ref: '#/components/schemas/ServiceUserView'
        tenant:
          $ref: '#/components/schemas/ServiceTenant'
        membership:
          type: object
          required: [membership_id, role, status]
          properties:
            membership_id:
              $ref: '#/components/schemas/Uuid'
            role:
              $ref: '#/components/schemas/TenantRole'
            status:
              $ref: '#/components/schemas/MembershipStatus'
        tenant_application:
          type: object
          required: [status]
          properties:
            status:
              type: string
              enum: [active, inactive]
    AccessVerifyResponse:
      type: object
      required:
      - decision
      - verified_at
      properties:
        decision:
          type: string
          enum:
          - allow
          - deny
        deny_reason:
          type: string
          enum:
          - invalid_token
          - token_revoked
          - login_expired
          - account_inactive
          - oidc_login_required
          - not_a_member
          - membership_inactive
          - tenant_inactive
          - application_not_enabled
          description: '`deny`일 때만'
        suggested_status:
          type: integer
          enum:
          - 401
          - 403
          description: '`deny`일 때 SaaS가 반환할 상태 코드. 토큰·로그인 사유는 401, 그 외 403'
        cache_status:
          type: string
          enum:
          - fresh
          - stale
          - absent
          description: '`allow`일 때만'
        user_id:
          $ref: '#/components/schemas/Uuid'
        tenant_id:
          $ref: '#/components/schemas/Uuid'
        versions:
          $ref: '#/components/schemas/AccessVersions'
        auth_context:
          $ref: '#/components/schemas/AuthContext'
        entitlement:
          $ref: '#/components/schemas/Entitlement'
        token:
          type: object
          required:
          - jti
          - exp
          properties:
            jti:
              type: string
            exp:
              $ref: '#/components/schemas/Timestamp'
        verified_at:
          $ref: '#/components/schemas/Timestamp'

    ServiceMember:
      allOf:
        - $ref: '#/components/schemas/ServiceUserView'
        - type: object
          required: [membership_id, role]
          properties:
            membership_id:
              $ref: '#/components/schemas/Uuid'
            role:
              $ref: '#/components/schemas/TenantRole'
    ServiceMemberPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ServiceMember'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'

    # ---------- 헬스 ----------
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        checks:
          type: object
          properties:
            database:
              type: string
              enum: [ok, fail]
            valkey:
              type: string
              enum: [ok, fail]

    SsoSessionResponse:
      type: object
      additionalProperties: false
      required:
      - authenticated
      properties:
        authenticated:
          type: boolean
        tenant_id:
          type:
          - string
          - 'null'
          format: uuid
        login:
          $ref: '#/components/schemas/LoginInfo'
      description: 브라우저용 안전한 상태. Access/Refresh Token·세션 쿠키 값·SSO client 비밀값을 포함하지 않는다.

    SsoLocalLoginRequest:
      type: object
      additionalProperties: false
      required:
      - email
      - password
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
          description: 로그인에서는 정책 길이를 검사하지 않는다(기존 비밀번호 호환).
      description: Passport 관리 포털의 Local 로그인용. SSO가 서버에서 web client 유형·자격 증명을 설정한다. SaaS SSO는 Passport 중앙 로그인으로
        리다이렉트한다.

    SsoContextRequest:
      type: object
      additionalProperties: false
      properties:
        tenant_id:
          $ref: '#/components/schemas/Uuid'
      description: 토큰·audience·client_id는 브라우저에서 받지 않고 SSO 설정과 세션에서 결정한다.

    LogoutRefreshRequest:
      type: object
      additionalProperties: false
      properties:
        refresh_token:
          type: string
          maxLength: 512
          writeOnly: true
      description: SSO client Basic 인증 분기에서는 refresh_token이 필수이며 해당 client·로그인과의 연결을 검증한다.

    SsoTokenRequest:
      type: object
      additionalProperties: false
      required:
      - code
      - code_verifier
      - redirect_uri
      - grant_type
      properties:
        code:
          type: string
          writeOnly: true
          maxLength: 512
        code_verifier:
          type: string
          writeOnly: true
          minLength: 43
          maxLength: 128
          pattern: ^[A-Za-z0-9._~-]+$
        redirect_uri:
          type: string
          format: uri
        grant_type:
          type: string
          const: authorization_code
      description: 코드의 client·redirect URI·PKCE·원래 로그인·테넌트 연결과 현재 접근 자격을 검증하고 원자적으로 한 번만 소비한다.

