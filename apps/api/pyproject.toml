[project]
name = "Passport-API"
version = "0.1.0"
description = "Identity, Authentication and Tenant management service."
readme = "README.md"
authors = [
    { name = "hyoungsookim", email = "hskim7@yahoo.com" }
]
requires-python = ">=3.15"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "psycopg[binary]>=3.3.6",
    "sqlalchemy[asyncio]>=2.1.6",
]

[project.scripts]
api = "api:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
