[project]
name = "Passport-API"
version = "0.1.0"
description = "Identity, Authentication and Tenant management service."
readme = "README.md"
authors = [
    { name = "hyoungsookim", email = "hskim7@yahoo.com" }
]
requires-python = ">=3.15"
dependencies = [
    "alembic>=1.20.1",
    "celery>=5.6.3",
    "fastapi[standard]>=0.162.0",
    "psycopg[binary,pool]>=3.3.6",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
    "sqlalchemy[asyncio]>=2.1.6",
    "ty>=0.0.91",
]

[project.scripts]
api = "passport.server:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "passport"
module-root = ""
